      The in-process and IMAGE halves ARE met and were newly measured this round: the auditor
      built the shipped Dockerfile and got GET /health -> 200 with commit equal to
      `git rev-parse HEAD`, and the same run proved F-116's boot refusal fires in the real
      image and that helmet's invariant 4 holds on the wire.
      SAME SHAPE AS TASK-004's AC-7, which sat blocked for eleven days until Juano created the
      Vercel project. Fly needs an account, an app and secrets. RULED BY JUANO 2026-08-10:
      escalate and hold. Code blockers are fixed meanwhile; the AC closes when the deploy
      exists. TASK-003 CANNOT REACH done until then, independently of F-277.
      Note before that deploy is attempted: F-142 is undischarged - docs/architecture/
      migrations.md:120 still says the Fly release command runs migrations while fly.toml
      deliberately has none, which sends a reader to `fly deploy` by hand against an unmigrated
      schema with /health still reporting green.
