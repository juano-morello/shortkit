escalations:
  - task: TASK-059
    findings: [F-320]
    raised: 2026-08-11
    reason: >-
      DELETING FLY ORPHANS THE CLIENT-IP TRUST MODEL, and ADR-0030 - accepted the same day - does
      not mention it in its preconditions. resolveRateLimitPrincipal's "otherwise return
      Fly-Client-IP" and click-events.md:51's unspoofable premise are what discharge F-009 for
      ip_hash and for every IP-keyed rate-limit bucket. A trusted-header model is only ever as
      good as the proxy that strips it; with no deploy target, nothing strips it, so whatever
      eventually fronts this must reproduce that property or the rate-limit design has to change.
      No artifact says so today.
      NOT A BLOCKER FOR TASK-059's DISPATCH, and I am saying that rather than letting an
      escalation imply one. Every consumer of the client-IP model - rate limiting, click events -
      left with EPIC-002..006, so nothing reachable depends on it. THE DECISION IS WHETHER THE
      PRECONDITION IS RECORDED NOW OR WHEN A DEPLOY TARGET IS CHOSEN, and the case for now is
      that F-009's discharge is currently resting on a platform this initiative just deleted.
      Raised by sdlc-security-auditor in the design-mode pass, unprompted - my dispatch asked it
      to judge whether removing the platform while leaving the code is security-relevant, and it
      found that the artifacts discharging F-009 are the ones nobody was looking at.
      phases/design.md: a finding against an approved artifact is never fixed by the architect.
      The architect was told not to amend ADR-0030's preconditions and may only propose.
