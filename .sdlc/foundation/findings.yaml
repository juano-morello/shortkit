    assertRuntimeRoleCannotBypassRls(), which rejects for every reason pg can reject. db/client.ts
    sets connectionTimeoutMillis 2000 and F-149 establishes pg-pool applies that to ESTABLISHMENT, not
    only queue wait. GC-3 pins Neon's free tier, which scales to zero, so a cold wake exceeding 2s
    exits 1 and /health never binds. THE RESTART CASE IS THE ONE THAT WAS NEVER ANALYSED: the
    architect's "a failed deploy leaves the old version serving" holds for a deploy, where deploy.sh
    has just migrated so the database is warm, and does NOT hold for a restart, where there is no
    previous version. VERIFIED fly.toml:49 auto_start_machines = false, so once Fly's restart budget
    is spent nothing brings the machine back on an incoming request - recovery needs a human even
    after the database is healthy. Before this diff main.ts opened no database connection at boot at
    all, so the same outage left the process up with /health answering 200 and it self-recovered. Not
    a literal GC-8 violation - a process that never binds returns no 5xx - but it removes the branded
    404 path's only survival mode during a database outage. Both auditors confirmed nothing
    attacker-controlled reaches either precondition.
  required_change: >-
