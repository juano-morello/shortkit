    - leaving WITH CHECK correct - then the suite:
      pass  A->B  updateAll  (write on tenants, saw 0, affected 0) - refused: error [42501]
      pass  B->A  updateAll  (write on tenants, saw 0, affected 0) - refused: error [42501]
      report.json: verdict=pass, failed=[], unverified=[], 28 attempts
    THE SUITE EXITED 1 FOR AN INCIDENTAL REASON ONLY - the hand-written F-294 refusal roster is a
    literal list that updateAll joined - and the artifact SC-1 points at says PASS.
    The auditor measured the leak itself on a tenant_id-shaped probe carrying that policy: all
    seven shapes pass, and `UPDATE probe SET tenant_id = '<A>'` reports UPDATE 2, leaving tenant
    B's row OWNED BY TENANT A. A tenant taking ownership of another tenant's row is not a shape
    this harness has ever attempted.
