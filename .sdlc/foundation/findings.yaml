- id: F-224
  phase: test
  task: TASK-003
  source: sdlc-test-architect
  round: 1
  severity: major
  kind: scope
  file: .sdlc/foundation/design/adr-0027-build-commit-provenance.md
  line: 1
  summary: >-
    No artifact anywhere names the build-time SHA source that AC-6's `commit` field is supposed to
    report. Not an ADR, a contract, a workflow, an .env.example or a manifest - so the test had to
    choose the name in order to exist at all.
  failure_scenario: >-
    AC-6 requires `commit` to match the deployed git SHA, and Juano's 2026-08-06 split made the
    not-a-placeholder clause a tested one specifically because a stale or empty commit makes a deploy
    unidentifiable and regresses silently. But a test proving the value is not hardcoded must SET the
    source, and setting it requires naming it. The test architect searched and found no artifact that
    does, so the spec decided `GIT_COMMIT_SHA` and documented the decision in its own docblock. That is
    a test making a production decision by default - the exact inversion this workflow exists to
    prevent - and it is invisible unless someone reads the spec. If TASK-003's implementer picks a
    different variable the test fails for a reason that looks like a defect and is not.
  required_change: >-
    Name the variable in an artifact the implementer reads, and wire it where it is produced: the
    Dockerfile build arg, fly.toml, and apps/api/.env.example, all of which are in TASK-003's paths.
    The test's choice of GIT_COMMIT_SHA is a reasonable default and changing it is a single edit in the
    spec, which is NOT a weakening - but the name must live in the deploy artifacts rather than only in
    a test. Routing rule 0 - the ADR half belongs to sdlc-architect, the deploy artifacts to TASK-003.
  owner_slot: sdlc-architect
  ruling: >-
    FIXED 2026-08-06 by sdlc-architect in a new ADR-0027, after Juano ruled the name must be settled
    BEFORE TASK-003 dispatches so its implementer transcribes a decision rather than inheriting one
    from a test docblock. THE NAME: GIT_COMMIT_SHA, adopted from the spec, full 40 lowercase hex,
    matching /^[0-9a-f]{40}$/. GITHUB_SHA lost on a specific mechanism rather than taste - Actions
    populates it in EVERY job including quality and integration, which deploy nothing, so a boot guard
    reading it would be satisfied by ambient CI env rather than by the image's build arg. Full length
    rather than abbreviated so ONE predicate rejects unknown, empty, an unexpanded command
    substitution, a branch name, HEAD, uppercase, and a 7-char abbreviation.
    
    THE SOURCE: a Docker build arg promoted to ENV in the RUNTIME stage, supplied by infra/deploy.sh.
    Fly injects nothing usable - the eleven documented Machine vars carry no commit. The build arg wins
    because the value is BAKED INTO THE IMAGE, so image and reported SHA cannot disagree across a
    rollback, an --image reuse, a restart or a clone. The script matters because CI DOES NOT DEPLOY -
    ci.yml has only quality, integration and gate, and no Fly credentials - so every deploy is a
    hand-typed command and a remembered flag eventually gets forgotten.
    
    ABSENCE: REFUSE, three layers, no fallback anywhere - the build fails, the boot refuses, the read
    throws. The obviously-wrong sentinel was rejected for a reason worth keeping: it keeps /health
    answering 200, keeps the Fly check green, lets the deploy succeed, and is visible only to a human
    who reads the response. A NODE_ENV gate was rejected because it reintroduces a branch that never
    runs under test, which is F-225's exact shape.
    
    ORCHESTRATOR REPRODUCED ITS LOAD-BEARING DOCKER CLAIM independently: a global ARG not re-declared
    inside the runtime stage expands to EMPTY and the build SUCCEEDS, shipping GIT_COMMIT_SHA= with only
    an UndefinedVar warning. That is F-225's silent failure demonstrated rather than argued, and it is
    why the ADR makes the re-declaration and the RUN guard mandatory rather than stylistic.
    
    IT SEPARATED VERIFIED FROM INFERRED without being asked twice: Docker behaviour was RUN, while every
    Fly claim is inferred from docs because flyctl is not installed here - and it named TASK-003's
    implementer as the first person who can confirm any of it. It also corrected the finding's own file:
    field, which pointed at adr-0006-health-and-deploy.md, a filename that has never existed. I wrote
    that field. Repointed at ADR-0027.
  status: fixed
  resolved_by: sdlc-architect
  resolved_round: 1

