- id: F-219
  phase: ship
  task: TASK-002
  source: orchestrator
  round: 1
  severity: major
  kind: behavior
  file: .github/workflows/ci.yml
  line: 31
  summary: >-
    F-185's timeouts are sized against EXECUTION time but are consumed by QUEUE time. Under runner
    congestion the jobs are cancelled before executing a single step, so CI cannot pass at all -
    and the run reports `failure`, which is indistinguishable from a real one at a glance.
  failure_scenario: >-
    OBSERVED, not predicted. Run 31123456025 on 3f68317: conclusion FAILURE, all three jobs
    CANCELLED, and `gh api .../jobs` shows ZERO STEPS EXECUTED on every one of them. quality and
    integration were both cancelled at exactly 15 minutes after started_at, which is precisely the
    `timeout-minutes: 15` F-185 added. The timeouts were sized from run 31113561948's real timings -
    quality 56s, integration 51s - giving roughly 16x headroom, which is generous against EXECUTION.
    It is nothing against a queue: GitHub's runner pool has been congested for over an hour and six
    consecutive runs on this branch never completed. THE PART THAT MAKES IT A FINDING RATHER THAN AN
    OUTAGE is that F-185 was filed to bound a hung job so a required check fails fast instead of
    hanging for six hours - and the bound now fires on healthy jobs that simply have not started, so
    the required check reports failure on a tree nothing has tested. I contributed to the congestion
    myself: cancel-in-progress is true on feature branches by F-190's fix, so every ledger push I
    made superseded the in-flight run.
  required_change: >-
    Decide what the timeout is bounding. If it is execution, the job needs to distinguish
    not-yet-started from running - GitHub does not offer a separate queue timeout, so the practical
    options are a materially larger timeout-minutes that tolerates queueing, or accepting that a
    congested pool cancels runs and reading `zero steps executed` as the signature rather than as a
    failure. Also worth deciding whether cancel-in-progress on feature branches is right for a repo
    whose author pushes ledger commits frequently - it is correct in principle and it is why six
    runs in a row never completed.
  owner_slot: sdlc-implementer-backend
  status: fixed
  resolved_by: sdlc-implementer-backend
  resolved_round: 1
  ruling: >-
    NOT A MERGE BLOCKER FOR THE MERGED TREE, which is verified locally and thoroughly - unit 65,
    integration 21, lint, typecheck, build, and db:check-policies green on a clean database. It IS a
    blocker for treating CI as evidence: F-218 said no run stands behind these commits, and F-219
    explains why none can while the queue is long. Recorded before any push so the state of the
    world is on the record rather than discovered later.
    RESOLVED 2026-08-06. Juano ruled in two parts and the fix landed the same day. (1) TIMEOUT RAISED
    TO 30 on quality and integration, 10 on gate. GitHub offers no separate queue timeout, so the value
    bounds queue AND execution together; observed execution is 56s and 51s, so anything past a few
    minutes of real running is already pathological and the extra budget absorbs queue almost entirely.
    Keep-15-and-accept and raise-to-60 were both offered and declined - 60 stops being a meaningful
    bound and burns an hour of free-tier minutes against GC-3 on a genuine hang. (2) THE SIGNATURE IS
    NOW DOCUMENTED IN THE WORKFLOW ITSELF, which is the half that makes this a finding rather than an
    outage: a queue-cancelled run and a real failure both report failure, and the only discriminator is
    that gh api .../jobs shows ZERO STEPS EXECUTED on the former. That is written where someone
    debugging a red run will find it. (3) cancel-in-progress KEPT unchanged - correct in principle and
    it protects the GC-3 budget; paths-ignore was considered and declined because a required check that
    never runs can block merge under branch protection. ORCHESTRATOR VERIFIED the diff contains ONLY the
    three timeout values outside comments - steps, the needs graph and concurrency byte-identical - and
    re-parsed the workflow independently, since the implementer's stated python-yaml check does not
    reproduce in this workspace. Commit 4c969cf. RESIDUAL, stated rather than hidden: this does not
    prove the new bound survives a real queue. First evidence is the next actual run on main, read
    against the signature now in the file. F-218's residual is unchanged.

