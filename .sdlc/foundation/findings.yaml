- id: F-075
  phase: test
  task: TASK-005
  source: orchestrator
  round: 0
  severity: major
  kind: scope
  file: apps/api/package.json
  line: 1
  summary: >-
    TASK-005 cannot reach a database without the pg driver, which ADR-0002 names and
    drizzle-orm/node-postgres requires, but pg is not a dependency of apps/api and
    apps/api/package.json is outside TASK-005's paths.
  failure_scenario: >-
    ORCHESTRATOR VERIFIED that require.resolve('pg') from apps/api fails MODULE_NOT_FOUND, that
    apps/api's dependencies list contains drizzle-orm 0.45.2 but no pg and no @types/pg, and that
    no TASK's paths contain apps/api/package.json - TASK-001 owned it via apps/api/** and is done.
    This is why the red fixture reaches Postgres by spawning psql rather than importing pg: a
    fixture importing an unresolvable module would have failed all six tests on module resolution,
    which is the failure mode the Test phase forbids and which looks identical whether the tests
    are right or empty. Identical in shape to F-071, where TASK-007 needs zod in the same manifest.
    Both wave-1 backend TASKs are blocked on the same unowned file.
  required_change: >-
    Rule on who adds a runtime dependency to apps/api/package.json now that TASK-001 is done, and
    apply it to pg/@types/pg here and to F-071's zod question together. Widening each consuming
    TASK's paths to its own manifest is one answer; a named owner for manifests is another. A
    general ruling is worth more than two one-off widenings, since every later backend TASK that
    adds a dependency hits this same wall.
  owner_slot: null
  status: fixed
  resolved_by: juano
  ruling: >-
    RULED 2026-08-05 as a GENERAL rule, not a one-off widening: THE CONSUMING TASK OWNS ITS OWN
    WORKSPACE MANIFEST. Each TASK needing a dependency gains that manifest in paths, so the
    dependency lands in the same commit as the code requiring it and passes through the same review.
    The alternatives - a single named manifest owner, and orchestrator-applied manifest edits - were
    both offered and rejected; the second would put dependency choice outside review and the TDD
    loop, which F-069 already shows the cost of. APPLIED HERE: TASK-005 paths += apps/api/package.json
    for pg and @types/pg, pinned exactly per ADR-0018. NOT YET APPLIED to TASK-007: whether it needs
    the manifest at all depends on F-071's ruling, since the contracts-side answer would keep zod out
    of apps/api entirely. CONSEQUENCE Juano flagged in taking the ruling, carried into TASK-005 and
    to be checked before dispatch: if two wave-1 TASKs both hold apps/api/package.json, wave 1 stops
    being parallel-safe on that file and needs worktree isolation.

