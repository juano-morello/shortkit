- id: F-285
  phase: implement
  task: TASK-008
  source: sdlc-security-auditor
  round: 1
  severity: major
  kind: security
  file: apps/web/src/lib/api/client.ts
  line: 88
  summary: >-
    requestUrl concatenates the caller-supplied path RAW - no segment validation, no encoding,
    no guard on ? or # - so a path built from user input escapes the /api/bff prefix or injects
    query parameters into an authenticated call.
  failure_scenario: >-
    ORCHESTRATOR-REPRODUCED against the WHATWG URL parser at origin https://app.shortkit.dev:
    /links/../../auth/token -> /api/auth/token, and /links/%2e%2e/%2e%2e/secret -> /api/secret.
    BOTH ESCAPE /api/bff ENTIRELY, AND THE BROWSER NORMALISES BEFORE THE REQUEST IS SENT - so
    the request never reaches /api/bff/* and the proxy's own normative segment rejection
    (buildUpstreamUrl, this same file :246-259, F-008) NEVER RUNS. That defence guards the
    Vercel-to-Fly hop; this is the browser-to-Vercel hop, and it is bare. Percent-encoding does
    not save a defensive caller - %2e%2e normalises identically.
    Separately, an unescaped ? in an interpolated segment appends attacker-chosen query
    parameters to an authenticated call which the proxy rebuilds from parsed searchParams and
    forwards upstream, and corrupts any query object the caller passed (a second ? becomes part
    of the preceding value).
    Every one of the 13 consumer TASKs will build path by template from a route param or form
    field - that is the only way `path: string` can be used.
    Attacker: an authenticated dashboard user, or anyone who gets a victim to open a crafted
    dashboard URL whose route param is interpolated into path.
    NO ORIGIN ESCAPE IS REACHABLE and that was checked rather than assumed: because the
    concatenation always begins with the literal /api/bff, the result is always path-absolute -
    //evil.example/x becomes /api/bff//evil.example/x, same origin, not protocol-relative.
  required_change: >-
    Validate and encode at THIS boundary rather than the caller's. Reject or encode any path
    whose decoded segments contain .., ., empty, /, \, :, ? or #; or take a template plus a
    params record and encodeURIComponent each value. Then assert the final URL still begins
    with /api/bff/ after normalisation - the browser-side mirror of the origin assertion this
    file already calls load-bearing for the proxy.
  owner_slot: sdlc-implementer-frontend
  status: fixed
  resolved_by: "sdlc-implementer-frontend"
  resolved_round: 1
  resolution: >-
    CLOSED BY THE SAME FIX, AND VERIFIED BY THE ORCHESTRATOR. All four measured escape shapes are now contained: ../../auth/token -> /api/bff/links/..%2F..%2Fauth%2Ftoken, %2e%2e/... double-encoded, a?workspaceId=other -> a%3FworkspaceId%3Dother, x#frag -> x%23frag. Slashes, ? and # are percent-encoded INSIDE the prefix rather than normalising out of it, so the browser can no longer reach a path the proxy's own F-008 defence would never see.
