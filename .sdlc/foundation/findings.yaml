  summary: >-
    SIGNAL_NAMES resolves 134 to "SIGIOT" because os.constants.signals aliases collide, and SIGABRT -
    Node's own JS-heap OOM abort - lands in the generic branch with no OOM hypothesis, though
    F-202's required_change named SIGKILL/SIGABRT.
