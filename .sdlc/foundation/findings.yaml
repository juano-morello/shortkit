    that pinning makes the TWO-CLONE collision unconditional. That reasoning is sound and it
    created this collision, which is a different one: two stacks in ONE directory rather than one
    stack in two directories. The ADR settled the case it was asked about.
  required_change: >-
    Separate the two stacks - distinct project name, distinct service name, or both - without
    reintroducing the two-clone collision ADR-0032 rejected `name:` to avoid. The red step names
    two repairs; either is acceptable and the ADR must say which and why.
