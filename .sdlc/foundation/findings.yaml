- id: F-123
  phase: implement
  task: TASK-005
  source: sdlc-security-auditor, sdlc-reviewer
  round: 1
  severity: major
  kind: behavior
  file: apps/api/src/db/client.ts
  line: 58
  summary: >-
    The pg.Pool has no error listener, no max and no connectionTimeoutMillis. An error on an idle
    pooled connection takes the process down, and pool exhaustion hangs requests forever instead of
    failing them.
  failure_scenario: >-
    ORCHESTRATOR VERIFIED: client.ts sets only allowExitOnIdle - no pool.on('error'), no max, no
    connectionTimeoutMillis. The security auditor verified the upstream half in the resolved
    pg-pool@3.14.0: makeIdleListener ends with pool.emit('error', err, client), Pool extends
    EventEmitter, and no default error listener exists in pg-pool or drizzle's driver. Node throws when
    'error' is emitted with no listener, so it becomes an uncaughtException and the API exits. The
    trigger is routine rather than exotic - ADR-0002 targets Neon, which terminates idle connections on
    scale-to-zero, and any restart, failover or idle_session_timeout does the same. Separately, both
    auditors independently flagged the pool defaults: max 10 and connectionTimeoutMillis 0 means the
    11th concurrent transaction waits forever with no error and no timeout, which ADR-0002's own
    accepted-cost section predicts as the concurrency limit. statement_timeout does not apply because
    no statement has been issued yet. The process looks alive and the platform health check passes
    while requests hang.
  required_change: >-
    Attach pool.on('error', ...) that logs and discards - the client is already removed from the pool
    by the time the event fires, so there is nothing to clean up. Set an explicit max and a finite
    connectionTimeoutMillis, justified against the Neon pooled endpoint ADR-0002 targets, so exhaustion
    produces a bounded observable failure rather than an indefinite wait. The security auditor also
    recommends set_config('idle_in_transaction_session_timeout', ..., true) alongside the existing two
    in withTenantTransaction, which turns the contract's prohibition on third-party I/O inside fn from
    documentation into enforcement.
  owner_slot: sdlc-implementer-backend
  ruling: >-
    LEDGER CORRECTION 2026-08-06. This finding was FIXED IN TASK-005'S FIX ROUND 1 by commits 2ffa011
    (red tests) and 9eb654a (fix), and all three round-1 auditors verdicted it ADDRESSED - the header
