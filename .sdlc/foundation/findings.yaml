- id: F-211
  phase: retro
  task: TASK-002
  source: sdlc-reviewer
  round: 5
  severity: minor
  kind: implementation
  file: .github/scripts/assert-contract-drift.mjs
  line: 1
  summary: >-
    This file's comments assert empirical claims about Node, libuv and pnpm signal behaviour that no
    gate in the repo can falsify, that are timing-dependent, and that carry no runtime consequence
    when wrong. Five rounds of corrections, and the corrections are the defect source.
  failure_scenario: >-
    THE MECHANISM, WHICH IS THE RETRO ITEM RATHER THAN ANY INSTANCE. Every sentence that has needed
    correcting is an empirical claim about a THIRD PARTY'S behaviour, and those claims share three
    properties whose combination generates defects: (1) NOTHING IN THE REPO CAN FALSIFY THEM - the
    file is outside every tsconfig program and no test imports it, so there is no gate between a
    true sentence and a false one; (2) they are TIMING-DEPENDENT, so the honest experiment returns
    different answers on different runs - round 1's SIGINT verification was confounded by GNU
    timeout, and the reviewer's own pnpm run disagreed with itself 2:1; (3) being wrong is
    CONSEQUENCE-FREE PER INSTANCE, so they accumulate rather than surface. THE COMPOUNDING IS THE
    POINT: three of round 4's four documentation findings were created by round 3's corrections, and
    round 4's own rewrite introduced F-210. The file carries ~190 lines of comment against ~130 of
    code, and the comment's job has drifted from "why this decision" to "how Node and pnpm behave
    under signals" - the first is stable and worth writing, the second is a moving unverifiable
    target.
  required_change: >-
    ONE STRUCTURAL CHANGE, NOT A CORRECTION. Strip causal explanations of third-party behaviour,
    keeping the observed shapes, the decision rule and the why-this-decision commentary; or promote
    the load-bearing claims into executable assertions so a gate can falsify them. Fold F-212 in -
    same defect class, crossed into the code.
  owner_slot: null
  status: routed-later
  ruling: >-
    ROUTED TO RETRO rather than to a fix round, on the reviewer's recommendation and my agreement.
    Five rounds is the evidence that another correction is not the answer. Recorded here so the
    Retro phase sees the mechanism rather than six instances of it.

