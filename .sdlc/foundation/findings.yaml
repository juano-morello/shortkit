    because fieldErrors['constructor'] resolves to the Object constructor. The consequence is worse
    than the crash - it throws INSIDE ApiExceptionFilter.catch, which has no last-resort guard, so it
    escapes the one component meant to answer for every throwable. A request that must answer 400
    validation_failed with field errors answers 500 with none. Where the escape reaches finalhandler
    rather than Nest's error layer, the body is HTML carrying err.stack whenever NODE_ENV is not
    production. Unreachable from any schema in the repo today; reachable the first time a contract
    declares z.record over caller-supplied keys, and this function is inherited unmodified by the
    validation_failed path of all fourteen consuming TASKs.
  required_change: >-
