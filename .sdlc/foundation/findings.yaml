  category: load-bearing

- id: F-033
  phase: design
  source: sdlc-security-auditor
  round: 5
  severity: major
  kind: design
  file: design/contracts/rate-limit.md
  line: 95
  summary: An unset BFF_PROXY_SECRET is an unspecified state a naive constant-time comparison resolves as a match, with no failure signal and no validation of the forwarded value.
  failure_scenario: Three gaps. (1) The design chose not to fail at boot, so unset-on-Fly is reachable; the obvious implementation compares the header against process.env.BFF_PROXY_SECRET, and for a direct request that is undefined vs undefined - a match. An anonymous attacker sends X-Shortkit-Client-IP with no secret and has it trusted, minting a fresh bucket per request and voiding every IP-keyed auth limit. (2) No signal, while every other degradation in the design increments a counter. (3) The forwarded value is never validated as an IP, so it flows unbounded into a Redis key and a map key; Node accepts 16 KiB headers, making the 6 MB memory estimate wrong by a factor of a hundred.
  required_change: State that unset or empty BFF_PROXY_SECRET disables the trusted-proxy branch unconditionally and that an absent or empty header never matches - the comparison is never reached, not merely never equal. Require the forwarded value to parse as an IP. Add bff_proxy_auth_mismatch_total plus a once-per-minute warn.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: sdlc-architect-fresh
  resolved_round: 5
  category: load-bearing

