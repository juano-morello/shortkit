- id: F-082
  phase: test
  task: TASK-007
  source: sdlc-architect
  round: 1
  severity: minor
  kind: design
  file: .sdlc/foundation/design/contracts/error-envelope.md
  line: 1
  summary: >-
    ERROR_CODES has no code for a request body over Express's default limit, so a 413 answers 500,
    and it is unverified whether an Express body-parser 413 reaches the Nest exception filter at all.
  failure_scenario: >-
    The architect stated plainly that it could not verify this: middleware errors do not always pass
    through global filters. It does not change ADR-0024's branch 3, which answers 500 for a 413
    either way. But if the 413 never reaches the filter, then error-envelope.md invariant 1 - every
    rejected request answers in the envelope - is already false for that one case, and TASK-007's
    implementer is the first person positioned to find out.
  required_change: >-
    TASK-007's implementer should establish whether a body-parser 413 reaches the filter and record
    the answer. If it does not, invariant 1 needs an explicit stated exception rather than a silent
    one. A 413 code is otherwise deferred: one appended code, one ERROR_CODE_STATUS row and one
    status-table row, in the commit that adds the first route documenting a body size limit.
  owner_slot: sdlc-implementer-backend
  ruling: >-
    CLOSED 2026-08-05. The implementer did NOT address this and sdlc-reviewer flagged that omission
    separately, but the reviewer and sdlc-security-auditor each established the answer INDEPENDENTLY
    while tracing branch 3 and agreed on both mechanism and outcome, so it costs a ledger edit rather
    than another round. Body-parser errors DO reach this filter: Nest 11 registers an Express
    error-layer middleware (routes-resolver.js registerExceptionHandler) built from the same global
    filter set as route handlers, and APP_FILTER filters are in that chain. A malformed JSON
    SyntaxError maps to BadRequestException and takes branch 3's 400 arm. A 413 is a
    PayloadTooLargeError, not an HttpException, so it falls through unmapped to branch 4 and answers
    500 with a VALID ENVELOPE. THEREFORE invariant 1 needs no stated exception and error-envelope.md
    is accurate as written. The security auditor added why this was worth checking at all -
    finalhandler returns err.stack in the response body whenever NODE_ENV is not production, and no
    artifact in this repo yet guarantees NODE_ENV=production, so keeping that fallback out of reach
    is load-bearing. The deferred 413 code itself stays deferred as originally written.
  status: fixed
  resolved_by: sdlc-reviewer, sdlc-security-auditor
  resolved_round: 1
  note: deferred-observation

