    MEANINGFUL. TENANTS_DECLINES_REPARENT says the statement "is refused by the primary key index
    with 23505 before any policy is evaluated, so it could never distinguish a correct policy from
    a wide-open one". THE ORDERING IS BACKWARDS: the policy is evaluated FIRST and is what
    prevents the collision.
  failure_scenario: >-
    Measured by the auditor on the production table, `UPDATE tenants SET id = '<A>'` as tenant A:
      correct USING (id = ctx)          -> UPDATE 1, NO ERROR - the USING admits only the actor's
                                            own row, so it is an identity update and the key is
                                            never contended
      USING (true), WITH CHECK correct  -> 23505 duplicate key
      USING (true) WITH CHECK (true)    -> 23505
    So the shape DISTINGUISHES THE CASES CLEANLY - pass versus unrecognised -> unverified -> red -
    on the one migrated production table this repository has. The decline removes the only
    owner-column write attempt on that table.
    AND THE FALSE REASON IS PUBLISHED VERBATIM INTO report.json, so the artifact SC-1 points at
    carries an incorrect statement about PostgreSQL's evaluation order. F-334's accounting
    sentence inherits it, which makes it a consequence of the decline rather than of the table.
    THIS IS `declinedShapes` BEING EXACTLY THE HAZARD I FLAGGED WHEN IT SHIPPED: an absence of
    evidence recorded as a fact, and coverage shrinking quietly, which is F-296's shape.
  required_change: >-
    Remove the decline and attempt reparentAll on tenants, or replace the premise with one that is
    true. Whichever, report.json must stop publishing the false ordering claim.
  owner_slot: sdlc-test-architect
  status: fixed
  resolved_by: "sdlc-test-architect"
  resolved_round: 4
  reaudit_r5: >-
