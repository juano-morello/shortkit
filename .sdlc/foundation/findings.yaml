    SET the contract specifies, so a template with a DUPLICATED placeholder passes the guard while
    a param key is silently dropped.
  failure_scenario: >-
    ORCHESTRATOR-REPRODUCED BY IMPORTING THE SHIPPED MODULE, not by transcription - the auditor
    measured it on a transcribed copy and I re-ran it against apps/web/src/lib/api/client.ts
    itself under node with type stripping:
      buildRequestUrl({ method: 'DELETE', path: '/members/:id/workspace/:id',
                        params: { id: 'm1', workspaceId: 'w9' } })
        -> '/api/bff/members/m1/workspace/m1'   NO THROW
    `DELETE /api/members/:id/workspace/:workspaceId` is a real endpoint in the design and `:id`
    copied twice is the typo that endpoint invites. placeholdersOf returns ['id','id'], length 2;
    Object.keys(params) has length 2; and every placeholder satisfies Object.hasOwn(params,'id').
    So the member id is substituted into the WORKSPACE segment and workspaceId is dropped without
    a word - a delete aimed at the wrong resource from a call site that reads as correct.
    AND ONE SHAPE WIDER THAN FILED, also reproduced by me: the duplicate makes the count check
    satisfiable by ANY extra key, so
      buildRequestUrl({ method: 'GET', path: '/a/:x/b/:x', params: { x: 'V', totallyIgnored: 'SECRET' } })
        -> '/api/bff/a/V/b/V'                   NO THROW
    An arbitrary unrelated param is accepted and discarded. The auditor filed the dropped-value
    half; the accepted-junk half is the same defect seen from the other side, and it matters
    because ADR-0029 makes params the channel that carries credentials.
    web-api-client.md:93-95 states the rule as a SET comparison. Under the contract both calls
    throw. The rework report claims "A duplicated placeholder (`/a/:x/:x`) therefore also rejects"
    - TRUE ONLY WHEN ONE KEY IS SUPPLIED, which I confirmed does throw.
    Not exploitable today: apiClient has no callers. That is the same reason F-284 and F-285 were
    cheap to fix now - this is the frozen boundary thirteen TASKs build paths against, and the
    guard exists for no purpose other than catching caller mistakes.
  required_change: >-
    Step 2 rejects whenever the placeholder SET and the param key set differ, including when the
    template repeats a placeholder name. A duplicated placeholder is rejected regardless of what
    params carries. If duplicates are instead meant to be legal, the contract says so and the
    report's claim is corrected - but code and contract agree afterwards.
  owner_slot: sdlc-implementer-frontend
  status: fixed
  resolved_by: "sdlc-implementer-frontend"
  resolved_round: 2
  resolution: >-
    CLOSED IN FIX ROUND 2 AND ORCHESTRATOR-VERIFIED BY IMPORTING THE SHIPPED MODULE, not by reading the report. Step 2 now rejects on three clauses - the template repeats a placeholder, the sizes differ, or a supplied key is not a placeholder. All three measured cases throw: the dup-with-two-keys case, the dup-with-junk-key case I added, and the dup-with-one-key case; the control /members/:id/workspace/:workspaceId still builds correctly. That is mutation M-E, the required change verbatim, NOT the plain new Set comparison the red step had already killed with M-A. Commits 31b03af (red) and 97b9b8d (green). Re-verified at the round-3 re-review.
  independent_convergence: >-
    THE SECURITY AUDITOR FOUND THIS INDEPENDENTLY IN THE SAME ROUND, running concurrently and
    blind to the reviewer, and filed it as its own F-309 (renumbered away; not re-filed here).
    FOURTH INDEPENDENT CONVERGENCE ON THIS INITIATIVE. It measured all four cases and adds one the
    reviewer did not: `/a/:x/:x/:x` with {x, b1, b2} is also accepted, and `/a/:x` with {x, extra}
    correctly rejects - THE HOLE ONLY OPENS WHEN A PLACEHOLDER REPEATS.
    IT DISSENTS ON SEVERITY AND THE DISSENT IS RECORDED RATHER THAN AVERAGED AWAY. It graded the
    same mechanism a nit, declaring explicitly that it is not a security defect: templates are
    source literals, a repeated placeholder is an authoring choice, and the failure direction is a
    param being DROPPED, which is fail-safe. It routed the call to sdlc-reviewer as not its own.
    ORCHESTRATOR RULING: MAJOR STANDS, and the split is about which failure you look at. Fail-safe
    describes the dropped key; it does not describe the SUBSTITUTED one. The reviewer's case puts a
    member id into the workspace segment of a real DELETE endpoint - a request aimed at the wrong
    resource, not a request that fails. Both auditors are right about what they measured.
    What neither raised, and I did when reproducing it: the accepted-junk direction means an
