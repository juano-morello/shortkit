    auto_start_machines interaction the finding required in the same round. Reachability now retries
    with backoff over a 20s budget, separated from the RLS verdict, with boot_precondition on the
    refusal line; auto_start_machines flipped false to true and grace_period 10s to 30s. Transcript: an
