- id: F-178
  phase: implement
  task: TASK-004
  source: orchestrator
  round: 6
  severity: major
  kind: behavior
  file: vercel.json
  line: 3
  summary: >-
    vercel.json does not deploy. With Root Directory unset, Vercel resolves framework: "nextjs"
    against the REPO-ROOT package.json, which has no `next` dependency, and the build aborts before
    buildCommand ever runs.
  failure_scenario: >-
    OBSERVED ON A REAL DEPLOY, 2026-08-06, the first one ever attempted. `vercel deploy --prod`
    against github.com/juano-morello/shortkit on the hobby plan: the filtered install succeeded
    exactly as the auditors predicted - 269 packages, apps/api absent, esbuild the only postinstall
    - and then Vercel emitted "Warning: Could not identify Next.js version, ensure it is defined as
    a project dependency" followed by "Error: No Next.js version detected. Make sure your
    package.json has next in either dependencies or devDependencies. Also check your Root Directory
    setting matches the directory of your package.json file." Status deploy_failed. THE BUILD NEVER
    REACHED buildCommand, so assert:no-secrets never ran and none of the five rounds of work on it
    was exercised. THIS IS THE EXACT RISK BOTH AUDITORS NAMED AND NEITHER COULD TEST.
    sdlc-reviewer r1 wrote that repo-root-relative keys with Root Directory unset "is a documented,
    valid Vercel monorepo pattern" but that it "cannot confirm it against an actual Vercel build
    environment ... first real deploy is the actual test". The implementer's own r1 report flagged
    it as "the first thing to check if the first deploy 404s or 500s". Both were right to flag it;
    the pattern does not hold for framework detection, which happens BEFORE and INDEPENDENTLY of
    installCommand and buildCommand.
  required_change: >-
    Make framework detection find apps/web. The conventional fix is Root Directory = apps/web in
    project settings, but note that Vercel then reads vercel.json FROM the Root Directory, so the
    file must move to apps/web/vercel.json and its buildCommand, installCommand and outputDirectory
    must be re-expressed relative to that - which also changes whether --filter is still needed.
    The alternative is to keep the file at the repo root and drop `framework`, letting the build be
    driven entirely by the explicit commands, at the cost of losing Next-specific optimisations.
    IMPLEMENTER DECIDES AND JUSTIFIES; the orchestrator applies whatever project-settings change is
    named, since that is outside the repository.
  owner_slot: sdlc-implementer-frontend
  status: routed
  resolved_by: null
