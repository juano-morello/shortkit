- id: F-341
  phase: implement
  task: TASK-006
  source: sdlc-test-architect
  round: 3
  severity: minor
  kind: test-coverage
  file: apps/api/test/isolation/registrations.ts
  line: 1
  summary: >-
    FIVE STATEMENT SHAPES THE HARNESS STILL DOES NOT ISSUE, NAMED BY THE AGENT THAT FIXED THE
    THIRD BLOCKER RATHER THAN FOUND BY A FOURTH AUDIT. I asked it to name a structurally adjacent
    shape if it saw one, on the reasoning that the list is worth more than another round. It
    named five.
  failure_scenario: >-
    1. `INSERT ... ON CONFLICT DO UPDATE`. PostgreSQL applies the INSERT WITH CHECK and, on
    conflict, THE UPDATE POLICY'S USING to the conflicting row. So a table with a correct INSERT
    policy and a wide-open UPDATE USING is reachable through one statement no shape here issues -
    AND THE ORM IDIOM save()/upsert() COMPILES TO EXACTLY IT. Same defect class as F-330 arriving
    through a third policy path.
    2. `MERGE` (PG 15+). Each WHEN branch applies a different policy and no shape produces the
    combination.
    3. EVICTION RATHER THAN THEFT: `UPDATE <t> SET <owner> = <a tenant the fixture never seeds>`.
    The count rule DETECTS it but the digest cannot NAME the recipient, because a third tenant
    appears in no census line. Detected but not attributed; attribution is worth a third fixture
    tenant when someone next touches censusRows().
    4. Cascade and trigger effects on a SIBLING table. censusRows() reads only the attempted
    table, so a write whose FK cascade or trigger touches a different registered table is outside
    the per-attempt comparison. Bounded today ONLY because tenants has no ordinary DELETE policy,
    so no cascade can fire - it goes live the day one lands, which is F-329's table.
    5. `SELECT ... FOR UPDATE` / `FOR SHARE`. A locking read applies the UPDATE policy's USING in
    addition to the SELECT policy, so on a table with a wide-open UPDATE USING a tenant can take
    row locks on rows it CANNOT READ - an existence side channel and a denial of service on
    another tenant's writes.
    THE AGENT'S OWN CONCLUSION, AND IT IS THE ARGUMENT FOR THE ROADMAP ITEM: all three blockers so
    far have been "a statement shape nobody thought of", and items 1 and 2 are simply the next two
    nobody thought of.
  required_change: >-
    None this round, by Juano's ruling of 2026-08-11: this round ships the two concrete gaps and
    the generative approach becomes a roadmap item. These five are the worked evidence for that
    item and are recorded on it. Shape 3's attribution gap and shape 4's cascade gap should be
    re-read the day a DELETE policy lands on tenants.
  auditor_ranking_2026_08_11: >-
    THE ROUND-4 AUDITOR RANKED THEM AND ADDED A SIXTH, ASKED FOR ITS JUDGEMENT RATHER THAN A
    RE-FILING. It agrees ON CONFLICT DO UPDATE is first BY A CLEAR MARGIN. It PROMOTES
    `SELECT ... FOR UPDATE` TO SECOND, ABOVE MERGE, on two grounds: its consequence is a different
    CLASS - an existence side channel plus a cross-tenant denial of service on another tenant's
    writes - and the idiom that produces it is ORDINARY READ-MODIFY-WRITE CODE, whereas MERGE
    requires a deliberate authoring choice nothing here makes. Cascade and trigger effects rank
    third because their trigger is SCHEDULED: F-329's DELETE policy on tenants.
    AND THE SIXTH, WHICH NOBODY HAD: POLICY COMPOSITION. Every control here is a table with ONE
    policy set, but a carve-out lands in production as a SECOND PERMISSIVE POLICY rather than an
    OR arm inside the first - and permissive policies are OR-ed, so a second one can only widen.
    A generative approach must derive from the COMPOSED set, not from each policy in isolation.
  owner_slot: null
  status: open
  resolved_by: null
  resolved_round: null

