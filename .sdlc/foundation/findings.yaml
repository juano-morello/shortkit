    suite no pipeline runs - the exact failure shape F-039 was filed to prevent.
  required_change: >-
    The flag must not survive past the first real .int-spec.ts. Remove it and give the
    command something to match, or make its removal a named obligation on TASK-005, and
    have the CI integration job assert a non-zero test count.
  owner_slot: sdlc-implementer-backend
  status: fixed
  resolved_by: sdlc-implementer-backend
  resolved_round: 1
