    response from a 100 KB request, about 30x amplification, unauthenticated, with the whole structure
    held in memory during the throw path. Separately a z.strictObject body of unknown keys returns every
    submitted key name verbatim in one unrecognized_keys message, echoing at roughly 1:1. No route parses
    a body today, which is what keeps this minor; TASK-007 is the moment the cap is cheap, before
    fourteen TASKs inherit the uncapped version.
  required_change: >-
    Cap the issue count and the per-key message count with a truncation marker, and state the cap in
    error-envelope.md beside the ValidationDetails shape. The contract half routes to sdlc-architect
    alongside F-094; the code half is here.
  owner_slot: sdlc-implementer-backend
  ruling: >-
    FIXED in fix round 1, ADDRESSED by both auditors, and the security auditor MEASURED the result rather
    than inspecting it: z.array(z.string()) against 50,000 bad elements now produces a 564-BYTE response,
    where round 1 costed the same input at 2-3 MB. Ceiling is 101 messages regardless of input. The
    truncation notice is a fixed constant carrying no count, key names or schema shape, so it leaks
    nothing. The reviewer checked the two boundaries that matter and found both right - the over-cap flag
    is computed from issues.length BEFORE the slice, and the per-key check makes exactly 10 not-truncated
    and 11 truncated. Two nits deferred: _form can reach 11 messages when the notice is appended past its
