    because the check could not be ANSWERED. Either a bounded retry with backoff on the reachability
    half, or a connect timeout distinct from the per-request one - and the two conditions must be
    distinguishable in the log line. F-116 ruled on the unsafe-answer case only. Settle the
    interaction with auto_start_machines = false at the same time. Leave precondition 1 alone; it does
