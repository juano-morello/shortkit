# ---- TASK-008 round 3, security half. IDS RENUMBERED 335-336 -> 339-340 BY THE ORCHESTRATOR.
# SECOND ID COLLISION TODAY AND THE SAME CAUSE: I dispatched the reviewer and the security
# auditor concurrently without giving either an id range, exactly as I did in round 2, having
# already written that up as my defect. Recording the repeat rather than the incident.

- id: F-339
  phase: implement
  task: TASK-008
  source: sdlc-security-auditor
  round: 3
  severity: minor
  kind: contract
  file: .sdlc/foundation/design/adr-0029-credentials-are-never-constructible-into-error-text.md
  line: 1
  summary: >-
    THE MEASUREMENT DISCIPLINE ADR-0029 JUST ADOPTED HAS THE DEFECT IT WAS WRITTEN TO FIX.
    "util.inspect(err, {depth: 5}) or it is not measured" replaces one blind single-channel check
    with another. TEN EVASION SHAPES TRIED; THE MANDATED CHECK CAUGHT ONE.
  failure_scenario: >-
    Measured on Node 24.19.0 against pino-std-serializers@7.1.0 - the version this repo resolves,
    and the sink the rule CITES AS ITS OWN JUSTIFICATION. Four shapes report clean under the
    mandated check while pino's `err` serialiser emits the secret: an enumerable GETTER
    (inspect's `getters: false` default), a string past maxStringLength's default 10000, an array
    property past maxArrayLength's default 100, and AggregateError.errors past the same limit. A
    fifth, toJSON, is inspect-clean and leaks via JSON.stringify.
    AND IT IS NOT EVEN A SUPERSET OF WHAT IT REPLACED: the getter and toJSON rows ARE caught by
    the spread and JSON.stringify - the checks the amendment calls inadequate. So the amendment
    traded one partial view for a different partial view and described it as a fix.
    REACHABLE TODAY, not hypothetical: the real apiClient driven into a ContractViolationError
    with 150 zod issues renders as `... 50 more items` under the mandated check. Nothing leaks
    through it only because zod 4 does not echo received values - A PROPERTY OF A DEPENDENCY,
    NOT OF THE RULE. That is the architect's own deferred question about
    ContractViolationError.issues, and it would be measured with a truncating check.
    THE RULE IS ALREADY QUOTED IN THREE PLACES including client.spec.ts's deepErrorSurface, so
    every `expect(deepErrorSurface(err)).not.toContain(SECRET)` inherits the blind spot.
    THIS IS THE FINDING THE DISPATCH ASKED FOR. I told the auditor to audit the new rule as a
    control and not only the code, on the reasoning that if the new rule can be defeated the way
    the old one was, that is worth more than anything in the diff. It can be, and it is.
  required_change: >-
    Replace the single mandated check with the union the auditor's report specifies, which caught
    10 of 10 - and state WHY a single channel cannot be sufficient, so the next amendment does not
    repeat the shape a third time. The auditor's own words on scope: closing TASK-008 and routing
    this separately is defensible; shipping the discipline as written and citing it next round is
    not.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: "sdlc-architect"
  resolved_round: 3
  resolution: >-
    CLOSED, CONCEDED WITHOUT HEDGING, AND THE ARCHITECT IMPROVED ON THE FIX THAT WAS SPECIFIED FOR IT. Its own words: it diagnosed 'cleared a claim with channels sharing a blind spot, then generalised', then wrote a rule that cleared claims with ONE channel having a DIFFERENT blind spot - same mechanism, same document, four hours apart. ADR-0029 gained a normative section, The measurement discipline, with the old bullet struck through and pointed at it. It answers WHY A SINGLE CHANNEL CAN NEVER BE SUFFICIENT, which is the part meant to survive the next amendment: every serialiser is a POLICY over an object graph, differing on five axes - which keys it walks, how deep, how much of each value, whether it runs the object's own code, and how it renders what it declines to walk. A check is a claim about one policy; a guarantee is a claim about every sink, and sinks get chosen later by people not reading the document. AND IT MEASURED THE UNION BEFORE MANDATING IT, which corrected two things in the version it was handed: JSON.stringify({...err}) does NOT bypass an OWN toJSON - the spread copies it and stringify calls the copy - it bypasses a PROTOTYPE-level one, which is the class shape; and AggregateError.errors is caught by the getOwnPropertyNames member too, not by inspect alone. THREE OF THE FOUR MEMBERS THROW on ordinary shapes - circular own property, BigInt, throwing getter, null-prototype object - so unwrapped, ONE THROW KILLS THE CHECK and the cheapest fix is deleting a member. Each is wrapped now and `<member threw> INCONCLUSIVE` is never a clean result. That correction came from RUNNING it rather than reading it. It also kept a member that caught nothing the others missed and SAID SO PLAINLY, because it makes the union a strict superset of the round-1 checks - half of this finding's own complaint - and because it runs in jsdom. Residual named: a floor modelling today's sinks, every number from Node with the browser leg inferred.

