  reaudit_r2: >-
    ADDRESSED, direction endorsed by both auditors. sdlc-reviewer added a reason neither had: @types/node@22.x would make the compiler BLIND to APIs the runtime has, so implementers would work around it with casts - raising the floor makes the types honest in the direction that produces correct code. Dropping Node 22 costs nothing verifiable: no .nvmrc, no Dockerfile, no CI workflow, and no dependency constrains to Node 22 (strictest new engines is sucrase at >=16).

