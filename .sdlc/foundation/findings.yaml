- id: F-127
  phase: implement
  task: TASK-005
  source: sdlc-reviewer, sdlc-security-auditor
  round: 1
  severity: minor
  kind: behavior
  file: docker-compose.test.yml
  line: 45
  summary: >-
    The healthcheck does not gate on the init script. pg_isready reports success regardless of whether
    the role, the database or TCP listening exist yet, so up -d --wait can return before the roles are
    created - and the file's own comment claims the opposite.
  failure_scenario: >-
    Raised by both auditors. pg_isready does not authenticate - the -U and -d values only affect what
    the server logs - and with no -h it uses the unix socket. The postgres entrypoint runs initdb,
    starts a TEMPORARY socket-only server, runs the init script, then stops it and starts the real
    server. A probe landing in that window returns 0 and marks the container healthy, so --wait returns
    and the next command gets ECONNREFUSED or "role shortkit_app does not exist". With interval 1s and
    initdb on tmpfs finishing in 1-2s, the probe lands there on a slow or loaded machine. The comment
    at :43-45 says the container only reports healthy once the init script has run, so the next person
    debugging a flaky start will trust it. THIS IS ALSO THE FAILURE I HIT MYSELF while verifying,
    though mine was a wrong DSN rather than a race.
  required_change: >-
    The healthcheck must be false until the init script has completed and the real server accepts TCP -
    a probe that executes a statement as shortkit_app against shortkit_test over 127.0.0.1, not
    pg_isready over the socket. The comment must describe whatever it actually gates on.
  owner_slot: sdlc-implementer-backend
  status: open
  resolved_by: null
  resolved_round: null

