    owns top-level err including its non-error case, and the formatter owns every other key at every
    depth including a nested err. serializers.error and serializers.cause were correctly not added,
    since that is the enumeration F-244 rejected and it would have left the nested shape open anyway.
    
    DEPTH BOUND 4, argued from today's call sites rather than picked: every log record in apps/api/src
    is flat, and the deepest shape named anywhere is req.headers.authorization at 3. It MEASURED the
    cost against the shipped instance - 40ns flat, 115ns five deep, 500ns with an error present, against
    5.8-9 microseconds for a whole log call, so under 2 percent of a line against GC-1's 25ms budget.
    The residual is written into the source rather than left implicit: an error at depth 5 or deeper is
    not replaced, reproduced deliberately. The bound also makes a self-referential record terminate.
    
    err.cause did NOT start being walked - cause is non-enumerable and the scan descends into nothing it
