    INSTANCE in the repository of the call shape no mechanism in the logger can reach - msg is
    built by the call site, before pino, so neither formatters.log nor hooks.logMethod nor the
    wrappers see it.
  failure_scenario: >-
    A driver or Postgres error whose message carries a value - a DSN fragment, a constraint
    body, a parameter - is interpolated into msg by the call site and written verbatim. Every
    control TASK-003 built acts on the RECORD or on the arguments pino formats; a string the
    caller has already assembled arrives as an opaque literal. GC-9 says no PII in log bodies,
    and this is the shape that walks past all six doors.
  required_change: >-
    Move the error onto the record under err, where serializers.err owns it, and leave msg a
    fixed string. Same fix F-260 applied to the message position. Do NOT interpolate.
  owner_slot: sdlc-implementer-backend
