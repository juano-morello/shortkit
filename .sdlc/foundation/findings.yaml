- id: F-195
  phase: implement
  task: TASK-002
  source: sdlc-security-auditor
  round: 2
  severity: major
  kind: implementation
  file: .github/scripts/assert-contract-drift.mjs
  line: 143
  summary: >-
    The SIGINT/SIGTERM handlers cannot run until the fully synchronous body finishes, so what actually
    restores the file on Ctrl-C is the finally. SIGHUP is unhandled, and the escalation that
    Ctrl-C-appearing-to-do-nothing invites is what leaves the tree dirty.
  failure_scenario: >-
    A GENUINELY SUBTLE CORRECTION TO A FIX THE SAME AUDITOR ASKED FOR. After the F-189 rewrite there
    is no await left in the module - readFileSync, writeFileSync, spawnSync - so the whole run is one
    synchronous block, and Node cannot deliver a signal to a JS listener until the event loop gets a
    turn. Registering the listener DOES replace the default disposition, which is why the interrupted
    run came back byte-identical - but by way of the finally, not the handler. The visible behaviour
    is a script that ignores Ctrl-C and keeps running the second mutation and second recursive
    typecheck. The developer response to that is closing the terminal (SIGHUP, unhandled, default
    disposition terminates, no finally) or kill -9 (unhandleable) - and either lands the original
    F-189 outcome. The docblock says the signals "are handled and restore SYNCHRONOUSLY before
    re-exiting", which reads as prompt interruption.
  required_change: >-
    Add SIGHUP to the handled list and correct the docblock to say what holds: the restore comes from
    the finally on the ordinary path and the handler is the backstop. Prompt interruption would need
    the handler to kill the in-flight child and the body to yield - not worth it for a dev-invoked
    probe, but the doc should not promise it.
  owner_slot: sdlc-implementer-backend
  status: routed
  ruling: >-
    RAISED FROM NIT TO MAJOR 2026-08-06 AND UN-DEFERRED. sdlc-security-auditor filed this as a nit
    on ergonomics. sdlc-reviewer then REPRODUCED IT against a byte-for-byte copy of the shipped
    script and found the consequence is worse than either of us understood: an interrupted run does
    not exit 130, it runs the ENTIRE second mutation and second typecheck to completion and then
    exits 1 with "FAIL: 2 contract-drift mutation(s) did not break the build the way AC-14 requires"
    - INDISTINGUISHABLE FROM A GENUINE AC-14 REGRESSION. So the implementer's stated mitigation
    ("cosmetic: the exit code is 130 and an interrupted run is not a verdict") is wrong on both
    clauses, and its closing exit-130 evidence is not reproducible. The reviewer proved the root
    cause separately: a control script with an await after the same spawnSync exits 130; the
    identical script without it exits 0 or 1 with the handler never invoked. What still holds is
    that the file IS restored on every signal path exercised, by the finally rather than the
    handler. The SUBSTANTIVE half of F-189 remains genuinely closed - exit 0 implies byte-for-byte
    restore, verified by reading the file back before the success path returns.

