- id: F-248
  phase: implement
  task: TASK-003
  source: sdlc-test-architect
  round: 2
  severity: major
  kind: security
  file: apps/api/src/observability/logger.ts
  line: 120
  summary: >-
    F-244's fix is keyed by FIELD NAME, so only `err` is guarded. The raw request body still leaks
    under `error`, `cause`, or any nested key - which is the same enumeration weakness F-244 rejected,
    one level up.
  failure_scenario: >-
    ORCHESTRATOR REPRODUCED all three shapes against the shipped serializer configuration: under `err`
    the marker is absent; under `error` and under `ctx.err` it leaks verbatim. `message` and `stack`
    are non-enumerable and do not survive pino's ordinary object path, but body-parser ASSIGNS `body`,
    so it is own and enumerable and travels under any key. Why this is a finding rather than a
    footnote, in the test architect's framing: logger.ts claims the misuse is IMPOSSIBLE, which is
    true for `err` and false for `error`; `{ error: e }` is as idiomatic as `{ err: e }` and nothing
    distinguishes them; and it survives the exact reasoning the serializer was chosen for - "a path
    list defends the one property already found by name" applies verbatim to a serializer keyed by one
    field name. Only `err.cause` is safe, because pino never walks it.
  required_change: >-
    `formatters.log(record)` runs AFTER serializers and sees the merged record, so replacing every
    Error it finds at any key closes all three shapes at once. Adding serializers.error and
    serializers.cause is the enumeration F-244 already rejected and should not be taken. The test
    architect deliberately did NOT write a red test for this - it would fail against current source
    with no implementer assigned and break the round's definition of done - and says it is a
    three-line addition to the existing emitter once a fix lands.
  correction: >-
    CORRECTED 2026-08-09, ruled by Juano, after the first end-to-end measurement anyone in this
    chain performed. THE STATED ATTACKER PATH DOES NOT OCCUR. body-parser 2.3.0 read.js does
    attach the raw body - createError(400, err, { body: str, type }), own and enumerable, exactly
    as claimed - BUT @nestjs/core routes-resolver.js:94-101 mapExternalException replaces every
    SyntaxError with new BadRequestException(err.message) before any filter sees it, so the error
    carrying `body` never reaches application code. What the shipped filter receives has ownKeys
    stack, response, status, options, message, name; body and cause are undefined. No application
    seam observes the original - an express error middleware before init() sits ahead of the
    parsers, one after sits behind Nest's handler, and both were tried. THE REMEDY STANDS AND THE
    CONTROL IS STILL NEEDED: the leak shapes are reachable without body-parser at all (F-260 and
    F-263 both leak with none involved), and the real framework-400 exposure is the MESSAGE, into
    which V8 quotes the first ten characters of the body. That is F-108, now confirmed live. Only
    the failure_scenario above was wrong; it is kept verbatim rather than rewritten so the record
    shows what was believed and when it was disproven.
  owner_slot: sdlc-implementer-backend
  ruling: >-
    FIXED in fix round 2, AND THE IMPLEMENTER CORRECTED THE FINDING'S MECHANISM. Both this finding and
    the test architect's report say formatters.log runs AFTER serializers. It runs BEFORE - measured in
    pino 10.3.1 lib/tools.js _asJson, where the formatters.log call precedes the per-key serializer
    loop. That is load-bearing rather than pedantic: had the scan also replaced the top-level err,
    serializers.err would have received a plain object and emitted 'non-error throwable (object)', and
    FROZEN TESTS 4 AND 6 WOULD HAVE GONE RED. So the two mechanisms PARTITION the record - serializers.err
    owns top-level err including its non-error case, and the formatter owns every other key at every
    depth including a nested err. serializers.error and serializers.cause were correctly not added,
    since that is the enumeration F-244 rejected and it would have left the nested shape open anyway.
    
    DEPTH BOUND 4, argued from today's call sites rather than picked: every log record in apps/api/src
    is flat, and the deepest shape named anywhere is req.headers.authorization at 3. It MEASURED the
    cost against the shipped instance - 40ns flat, 115ns five deep, 500ns with an error present, against
    5.8-9 microseconds for a whole log call, so under 2 percent of a line against GC-1's 25ms budget.
    The residual is written into the source rather than left implicit: an error at depth 5 or deeper is
    not replaced, reproduced deliberately. The bound also makes a self-referential record terminate.
    
    err.cause did NOT start being walked - cause is non-enumerable and the scan descends into nothing it
    replaces, because an Error becomes errorLogFields output which is never a container. Locked by a
    test that is green before AND after by design, guarding a property that already held.
    
    ORCHESTRATOR VERIFIED: 11 tests pass, the nine frozen ones untouched with a sorted name diff showing
    nothing removed, unit 79 passed with the same 6 TASK-008 reds, and typecheck, lint, build and the
