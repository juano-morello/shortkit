    configured branch protection requiring `gate` on the strength of it an hour before this audit
    ran. So pnpm audit, db:check-policies, the AC-113 inlined-secret guard, lint, typecheck, test
    and build currently block nothing. The defect is not that the guard is weak; it is that a false
    claim in a comment propagated into a repository setting that a human then trusted.
  required_change: >-
    `if: always()` on gate plus explicit assertions on needs.quality.result and
    needs.integration.result. Fold in `permissions: {}`, which is exact for this job rather than
    the inherited contents: read. AND CORRECT THE COMMENT - it is the reason the wrong
    configuration looked right to both the implementer and the orchestrator.
