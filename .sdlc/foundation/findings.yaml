- id: F-231
  phase: test
  task: TASK-009
  source: sdlc-architect
  round: 1
  severity: minor
  kind: design
  file: .sdlc/foundation/design/adr-0013-better-auth-in-nestjs.md
  line: 1
  summary: >-
    F-227's fix keys revocation on `jti: session.id`, and rests on an assumption the architect states
    it did not prove - that better-auth does not rotate a session row's id on an updateAge refresh.
  failure_scenario: >-
    The architect traced the delete paths but not the update path, and said so rather than implying
    coverage. If a refresh replaced the session id, a pre-rotation token would carry a stale jti and
    SURVIVE A LOGOUT - which is precisely the failure F-227 exists to close, reintroduced through a
    different door. It also made a call the ruling left open and flagged that it had: "definePayload
    returns a jti" is satisfied by a per-token random, which would leave revocation just as broken,
    because sign-out holds no token (dist/api/routes/sign-out.mjs:20-22). Choosing session.id is what
    makes revocation reachable at all; the RFC 7519 4.1.7 cost of a non-unique jti is recorded.
  required_change: >-
    TASK-009's constraint text already requires a test asserting two tokens across a refresh carry the
    same jti - that is the right mechanism and it must actually be written rather than assumed. If the
    id does rotate, revocation moves onto a `sid` claim and TASK-011's step 5 changes with it, which
    the architect named as the fallback. Verify before TASK-009's tests are written, not after.
  owner_slot: sdlc-test-architect
  ruling: >-
    RESOLVED IN THE DESIGN'S FAVOUR 2026-08-06 by sdlc-test-architect, verified THREE independent ways
    rather than one: better-auth 1.6.26's updateSession matches on token and writes only expiresAt and
    updatedAt, confirmed in source; a memory-adapter probe; and a Postgres probe using the exact refresh
    path the test uses under default session config. The session row id does NOT rotate on an updateAge
    refresh, so jti: session.id is safe and ADR-0013, auth-tokens.md invariant 5a and TASK-011 step 5
    all stand unchanged. The architect's stated assumption was correct; what it flagged as unproven is
    now proven. Test 9 asserts jti equal ACROSS the refresh AND equal to the session row id - the second
    clause is what stops it being vacuous, since an omitted jti yields two undefineds that satisfy
    equality on their own. Confirmed by mutation: omitting jti and substituting a per-token random each
    fail exactly that test.
  status: fixed
  resolved_by: sdlc-test-architect
  resolved_round: 1

