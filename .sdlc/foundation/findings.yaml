    a project dependency" followed by "Error: No Next.js version detected. Make sure your
    package.json has next in either dependencies or devDependencies. Also check your Root Directory
    setting matches the directory of your package.json file." Status deploy_failed. THE BUILD NEVER
    REACHED buildCommand, so assert:no-secrets never ran and none of the five rounds of work on it
    was exercised. THIS IS THE EXACT RISK BOTH AUDITORS NAMED AND NEITHER COULD TEST.
    sdlc-reviewer r1 wrote that repo-root-relative keys with Root Directory unset "is a documented,
    valid Vercel monorepo pattern" but that it "cannot confirm it against an actual Vercel build
    environment ... first real deploy is the actual test". The implementer's own r1 report flagged
    it as "the first thing to check if the first deploy 404s or 500s". Both were right to flag it;
