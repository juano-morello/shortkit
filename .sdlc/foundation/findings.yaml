# --- Round 2. Introduced by round 1's fixes; found by the scoped re-review. ---
# All 17 round-1 findings verdicted ADDRESSED at source. These are new.

- id: F-018
  phase: design
  source: sdlc-security-auditor
  round: 2
  severity: major
  kind: design
  file: design/contracts/rate-limit.md
  line: 42
  summary: The two new @Public() invitation routes are covered by no limiter, and ADR-0021 names a mitigation that does not reach them.
  failure_scenario: RateLimitGuard does not apply to @Public() routes and authRateLimit is mounted only on /api/auth/*. An attacker loops POST /api/invitations/<uuid>.<garbage>/accept; each request opens a Postgres transaction on the pooled connection set shared with the redirect hot path that GC-1 constrains and GC-8 forbids 5xx on. rate-limit.md invariant 7 ("no unthrottled unauthenticated write surface") is false as written.
  required_change: Give the capability-token routes an IP-keyed limit and add the Scope row, or state which limiter covers @Public() routes under /api. Correct invariant 7 or make it true, and correct ADR-0021's Negative section.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: sdlc-architect
  resolved_round: 2
  reopened_2026_08_11: >-
    REOPENED IN EVERY ENVIRONMENT THAT EXISTS TODAY, BY A DECISION RATHER THAN A REGRESSION, and
    recorded here because this record said `fixed` and a reader would have stopped there.
    ADR-0040 makes the trusted client address a DECLARED property of the deployment, so where no
    declaration exists there is no principal - and Juano ruled 2026-08-11 that a no-principal
    @Public() request FAILS OPEN rather than sharing one unidentified bucket. So the IP-keyed limit
    that closed this finding DOES NOT BIND in compose, CI or local dev.
    THE REASONING, WHICH IS THE PART THAT MATTERS: the rejected alternative bounds total anonymous
    transactions - exactly the harm this finding named - but hands a single caller a PRODUCT-WIDE
    429 LEVER on the invitation routes. Trading a pool-exhaustion risk for a guaranteed
    denial-of-service primitive is the worse trade, and the architect chose the option that does not
    relitigate F-033's fail-open-with-signal ruling.
    WHERE IT IS STILL CLOSED: production, once TASK-009 lands the boot assertion that makes the
    no-declaration state impossible. TASK-009 is DEFERRED with EPIC-002, so that is a promise rather
    than a fact today.
    STATUS LEFT AS `fixed` DELIBERATELY, with this note, because the fix it describes was real and
    was correct against the design of the day. What changed is the design underneath it. Flipping it
    to `open` would lose that distinction; leaving it unannotated would repeat F-142, where a record
    said one thing and the system did another for six days.

- id: F-019
  phase: design
  source: sdlc-security-auditor
  round: 2
  severity: major
  kind: design
  file: design/adr-0013-better-auth-in-nestjs.md
  line: 78
  summary: The email-keyed pre-auth limit requires parsing the request body that the same ADR forbids consuming.
  failure_scenario: The sign-in bucket keys on sha256(email), which lives in the JSON body, but authRateLimit is registered ahead of toNodeHandler and reading that body consumes the stream Better Auth needs — the stated reason authBodyCap must not parse. TASK-051's implementer meets a contradiction; dropping the email bucket leaves only the IP bucket, so an attacker across 1,000 IPs gets 10,000 password guesses per 5 minutes against one named account.
  required_change: State the mechanism normatively — buffer up to AUTH_BODY_MAX_BYTES, key on the parsed email, re-emit the buffered bytes downstream — or explicitly drop the email bucket and record what is lost.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: sdlc-architect
  resolved_round: 2

- id: F-020
  phase: design
  source: sdlc-security-auditor
  round: 2
  severity: major
  kind: design
  file: design/contracts/tenant-context.md
  line: 99
  summary: "@NoTenantTransaction removes the transaction WorkspaceGuard is required to run inside, on the one route that erases a tenant."
  failure_scenario: workspace-authorization.md is normative that WorkspaceGuard runs inside the tenant transaction so its membership lookup is under RLS. POST /api/gdpr/delete requires tenant owner and now carries @NoTenantTransaction. With no ambient context the guard throws or reads zero rows; the cheapest green fix is to make WorkspaceGuard tolerate a missing context, which removes the owner check from the only irreversible-destruction route and lets any tenant member erase the whole tenant.
