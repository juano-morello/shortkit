- id: F-315
  phase: design
  task: TASK-059
  source: sdlc-security-auditor
  round: 1
  severity: major
  kind: security
  file: .sdlc/foundation/design/adr-0031-compose-roles-and-credentials.md
  line: 78
  summary: >-
    COMPOSE INTERPOLATES `configs.*.content`, so the roles init script's "$POSTGRES_USER",
    "$SHORTKIT_MIGRATOR_PASSWORD" and "$SHORTKIT_APP_PASSWORD" resolve against the HOST
    environment at parse time - unset on AC-115's clean machine. ADR-0031:203-206 says
    "interpolation is not used here, deliberately"; it is on by default.
  failure_scenario: >-
    AUDITOR-VERIFIED BY EXECUTION and ORCHESTRATOR-REPRODUCED INDEPENDENTLY on a throwaway
    compose file in a scratchpad: `docker compose config` emits `The "POSTGRES_USER" variable is
    not set. Defaulting to a blank string.` for names that appear NOWHERE in the file except
    inside `configs.*.content`. Interpolation of that block is proven, not inferred.
    The container therefore receives `--username "" -v migrator_password="" -v app_password=""`.
    libpq treats an empty user as unset and connects as `postgres`, so THE SCRIPT DOES NOT FAIL:
    both roles are created with an empty password and ON_ERROR_STOP=1 never fires, because
    PostgreSQL answers an empty password with a NOTICE. The stack then cannot authenticate
    anywhere, and the failure is far from its cause.
    SECOND CONSEQUENCE, AND THE REASON THIS IS A SECURITY FINDING RATHER THAN A BUG: ADR-0031
    rejected the copy-the-test-file alternative BECAUSE `PASSWORD '${VAR}'` has no escaping, and
    the adopted shape reintroduces exactly that into a worse target. With
    SHORTKIT_APP_PASSWORD=a"$(id)"b the stored content is `-v app_password="a"$(id)"b"` -
    command substitution in a script the postgres entrypoint runs as root.
  required_change: >-
    Escape the shell forms compose must not touch ($$), or stop passing credentials through
    `configs.*.content` at all. Whichever is chosen, ADR-0031:203-206's claim is corrected rather
    than left standing, and the escaping is demonstrated in the ADR rather than asserted.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: "sdlc-architect"
  resolved_round: 1
  reaudit_2026_08_11: "ADDRESSED at the scoped design re-review by the auditor that raised it. Verdict clear overall; round 2 of the design cap stays UNSPENT."

