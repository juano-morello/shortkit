- id: F-199
  phase: implement
  task: TASK-002
  source: sdlc-reviewer
  round: 3
  severity: major
  kind: behavior
  file: .github/scripts/assert-contract-drift.mjs
  line: 273
  summary: >-
    The no-verdict guard is gated on the absence of diagnostics ANYWHERE, but mutation 1 breaks TWO
    workspaces - so an interrupt arriving after the first has emitted leaves diagnostics in the
    output, skips exitWithoutVerdict, and reports the interrupt as an AC-14 regression. F-195's
    exact failure mode, in the window the fix does not cover.
  failure_scenario: >-
    REPRODUCED against pnpm 11.20.0, the pinned version, with the real reporter and in a throwaway
    workspace so the repo was untouched. Captured: status null, signal 'SIGINT', hasAnyDiagnostic
    TRUE, and the finished workspace's line present in full. Traced through the shipped script: the
    guard needs !hasAnyDiagnostic and gets false, status === 0 is false, the consumer pattern does
    not match, so it pushes a failure, CONTINUES TO MUTATION 2 and runs a second full typecheck
    after the user pressed Ctrl-C, then exits 1 with a FAIL indistinguishable from a real
    regression. THE WINDOW IS NOT EXOTIC: the docblock's own reason for --no-bail is that the
    mutation breaks apps/api as well as apps/web, and apps/web's typecheck is `next typegen && tsc`
    against apps/api's plain `tsc`, so they finish at different times BY CONSTRUCTION and the gap is
    the window. Both discriminators were in the data and both were ignored - result.signal was
    'SIGINT' and INTERRUPT_BY_NAME matched pnpm's summary - because they are read only INSIDE
    exitWithoutVerdict, which the diagnostics test had already excluded. It also falsifies the
    docblock's absolute that "an interrupted run leaves signal === null": true when only node is
    signalled, false when the GROUP is, and Ctrl-C signals the group.
  required_change: >-
    Make signal evidence a no-verdict condition IN ITS OWN RIGHT, unioned with the
    absent-diagnostics condition rather than nested behind it. A missing consumer diagnostic in a
    run that was signalled cannot be recorded as a drift failure. Add the process-group case to the
    docblock, since it is the case a human produces.
  owner_slot: sdlc-implementer-backend
  status: routed
  resolved_by: null
  resolved_round: null

