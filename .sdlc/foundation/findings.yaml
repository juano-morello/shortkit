- id: F-392
  phase: ship
  task: null
  source: sdlc-integrator
  round: 1
  severity: major
  kind: design
  file: .sdlc/foundation/design/adr-0004-schema-layout-and-migrations.md
  line: 1
  summary: >-
    NO DOWN-MIGRATION MECHANISM EXISTS AND NO ADR ACCEPTS ITS ABSENCE. `drizzle-kit` has no `down`;
    its `drop` removes a journal file and never touches a database. NEITHER ADR-0004 NOR
    migrations.md USES THE WORDS rollback, revert OR reversible.
  failure_scenario: >-
    Ship step 4 requires a rollback plan stated EXPLICITLY - feature flag, revert, or
    migration-down - and this initiative has none of the three written down. The gap is not that
    rollback is impossible; it is that nobody decided, so the answer lives in a tool's absence
    rather than in a decision.
    Mitigated today only by ADR-0030: there is no production database to roll back. That is a
    circumstance, not an acceptance.
    Found by the integrator because Ship asked it to verify the rollback path, which is exactly
    the kind of question per-TASK verification never poses.
  required_change: >-
    One ADR-0004 clause: state the rollback posture and why. `revert the commit and re-migrate
    forward` is a legitimate answer for an additive-only schema with no production database - it
    just has to be the written one.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: "sdlc-architect under Juano's ruling"
  resolved_round: 1
  resolution: >-
    CLOSED. ADR-0004 gains a Rollback subsection carrying all four items, and migrations.md gets a
    POINTER rather than a copy - matching the precedent already in that file, where the six deploy
    constraints are named once and pointed at ADR-0030.
    IT CHECKED drizzle-kit AGAINST THE INSTALLED BUNDLE RATHER THAN THE DOCS, and found something
    worse than `no down exists`. Nine CLI commands, no `down`. And `drop` READS meta/_journal.json,
    rmSyncs THE .sql AND THE SNAPSHOT, REWRITES THE JOURNAL, AND OPENS NO CONNECTION - so on a
    migrated database it leaves the table AND the __drizzle_migrations row while REMOVING THE ONLY
    FILE THAT DESCRIBES THEM. The command a reader would reach for actively creates an inconsistent
    state; it does not merely fail to help.
    ADDITIVE-ONLY CONFIRMED RATHER THAN INHERITED FROM MY DISPATCH: one migration, one journal entry
    at idx 0, one schema file; every statement creates something new, and a grep for destructive
    keywords returns three hits that are all false positives - the FOR UPDATE and FOR DELETE clauses
    inside policies, plus a comment. It recorded the one judgement call: ENABLE and FORCE ROW LEVEL
    SECURITY are state changes, but they target a table created three statements earlier, so a
    commit revert removes both together.
    The rejected down-migration mechanism is recorded INSIDE the section with its reasoning, so the
    absence reads as a decision rather than as a gap.

