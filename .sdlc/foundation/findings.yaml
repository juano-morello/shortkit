- id: F-310
  phase: implement
  task: TASK-008
  source: sdlc-security-auditor
  round: 2
  severity: minor
  kind: security
  file: apps/web/src/lib/api/client.ts
  line: 410
  summary: >-
    `cause` IS THE THIRD CHANNEL AND IT IS NOT REDACTED. The credential does not survive in
    message, path, the spread or the stack - the auditor measured all four - but under Node's
    fetch the platform rejection handed to `{ cause }` carries the RESOLVED URL, and
    util.inspect prints it. ADR-0029's decision text says caller values reach "the URL, the
    wire, and NOTHING ELSE"; that sentence is measurably false through `cause`.
  failure_scenario: >-
    MEASURED BY THE AUDITOR, not reasoned. apiClient with path '/invitations/:token' and a real
    token in params, against Node 24's global fetch: NetworkError.message is the clean template,
    and util.inspect(err, {depth:5}) prints `[cause]: [TypeError: Failed to parse URL from
    /api/bff/invitations/<full token>`. util.inspect is what console.error(err) calls and what
    pino's err serialiser walks, so this is GC-9's "no PII in log bodies" on the platform-log side.
    THE BROWSER LEG IS CLEAN AND IT CHECKED RATHER THAN ASSUMING: a browser-shaped
    TypeError('Failed to fetch') carries no URL. The leak needs a Node runtime - apiClient
    executing during SSR or reused from a route handler - which is plausible PRECISELY BECAUSE
    serverApiClient is a throwing stub, so the natural workaround for a developer needing a
    server-side call today is to reach for apiClient. Attacker: whoever reads the platform log
    or the SSR console, replaying the invitation before expiry.
    SECOND SITE, NEW IN THIS DIFF: RequestAbortedError also takes { cause }, and abort(reason)
    puts a caller-constructed value there.
    NOT A REGRESSION. { cause } predates this diff and the fix strictly reduced the exposed
    surface. It is filed because the round-1 finding asked for the credential to be kept off the
    error, and THE FIX'S OWN ADR STATES A STRONGER GUARANTEE THAN IT DELIVERS.
  required_change: >-
    Decide one of two, and write it where a reader of the class will find it. Either the guarantee
    covers `cause` - drop it on NetworkError, or wrap it in a value the client constructed - or
    ADR-0029's Decision paragraph is amended to carve `cause` out for ALL four classes, not only
    RequestAbortedError, and the class docblocks say "do not log `cause`". The ADR's existing
    carve-out at :169-171 names only RequestAbortedError.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: "verdicted at the round-3 re-review"
  resolved_round: 3
  resolution: >-
    ADDRESSED, AND THE HEADLINE WAS RE-MEASURED IN THE CHANNEL IT WAS FILED ON. The auditor executed the shipped apiClient across 8 paths with a real token: NetworkError on both legs and ContractViolationError on both arms carry own props stack,message,path,name with hasOwnProperty(cause) FALSE, clean under inspect(depth:10), String, .stack, spread-JSON and getOwnPropertyNames. Exactly two `{ cause` sites remain, both abort branches. The carve-out is as narrow as it reads: cause is the only channel signal.reason reaches, and nothing platform-supplied can put a URL there - abort() no-arg gives DOMException [AbortError], AbortSignal.timeout gives [TimeoutError]. ORCHESTRATOR-CONFIRMED separately by emitting util.inspect and finding no token. THE DISCIPLINE THE AMENDMENT ADOPTED IS ITSELF DEFECTIVE - see F-339 - which does not reopen this finding but does mean the rule protecting it needs replacing.
  orchestrator_note: >-
    ADR-0029 IS AN APPROVED ARTIFACT AND ITS DECISION TEXT IS NOW KNOWN FALSE. Under
    phases/design.md a kind: contract finding during Implement escalates rather than being quietly
    patched. Held for Juano's ruling at the wave-2 gate alongside F-305 and F-311: the three of
    them are one question - what ADR-0029 and web-api-client.md actually promise - and answering
    them separately is how two individually-sound amendments contradict.

- id: F-311
  phase: implement
  task: TASK-008
  source: sdlc-security-auditor
  round: 2
  severity: minor
  kind: security
  file: apps/web/src/lib/api/client.ts
  line: 594
  summary: >-
    isMutatingMethod COMPARES CASE-SENSITIVELY AND FAILS OPEN. It is the predicate deciding
    whether the proxy REQUIRES Origin to equal the deployment origin, so an unrecognised spelling
    skips the CSRF check rather than refusing the request.
  failure_scenario: >-
    MEASURED: isMutatingMethod('patch') === false, ('post') === false, ('PoSt') === false. AND THE
    CASE DIFFERENCE IS REACHABLE FROM A BROWSER, which is the non-obvious part and was measured
    against a real Fetch implementation: new Request(u,{method:'post'}).method NORMALISES to
    'POST', but new Request(u,{method:'patch'}).method STAYS 'patch', because PATCH is absent from
    the Fetch spec's normalise list. PATCH is one of the four methods ApiRequest.method allows.
    Consequence in the deferred proxy: the CSRF check does not run and Origin is not forwarded -
    both directions F-233 documents, the permissive one and F-233's own 403.
    HONEST REACHABILITY, AND IT IS WHY THIS IS MINOR. A cross-origin `patch` with a JSON
    content-type is not a simple request, so it triggers a preflight the BFF route will not
    answer, and the browser blocks it before the proxy sees anything. CORS is the control that
    actually holds. What is left is a security predicate that FAILS OPEN on unexpected input, in a
    file no non-deferred TASK can write after TASK-008 closes - the exact trap F-288 was about.
    The implementer disclosed the case sensitivity in its rework report and correctly called the
    uppercase-normalisation argument an inference about TASK-012's call site. It is one, and the
    inference is wrong for PATCH specifically.
  required_change: >-
    Fold into F-305's resolution - same three lines, same architect. Either normalise before
    comparing, or state normatively in the docblock that the proxy must uppercase request.method
    before calling this and fail closed on anything outside the union. Whichever is chosen, one
    test discriminates it; today none does, because the spec exercises only the six spellings both
    readings agree on.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: "verdicted at the round-3 re-review"
  resolved_round: 3
  resolution: >-
    ADDRESSED and measured across the space rather than the example: GET/get/gEt/HEAD/head false; POST/patch/OPTIONS/TRACE/CONNECT/empty-string true; and `GET `, ` GET`, `GET\n` and fullwidth `GET` all TRUE, so whitespace and Unicode lookalikes FAIL CLOSED. A non-string throws TypeError - fails loud rather than open.

