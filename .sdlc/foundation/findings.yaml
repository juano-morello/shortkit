- id: F-137
  phase: implement
  task: TASK-005
  source: sdlc-architect
  round: 1
  severity: major
  kind: behavior
  file: apps/api/src/db/client.ts
  line: 58
  summary: >-
    A pg client that errors while CHECKED OUT has no error listener at all, so a connection killed
    mid-transaction becomes an uncaughtException. F-123's pool.on('error') covers the idle-in-pool
    half only.
  failure_scenario: >-
    Raised by sdlc-architect while settling A4, and it explicitly declined to write to findings.yaml
    because that file is the orchestrator's - so this entry is mine, not a copy of its wording. The
    mechanism: pg-pool removes its own idleListener in _acquireClient, and drizzle's
    NodePgSession.transaction attaches none, so between checkout and release the client has zero
    'error' listeners. Node throws on an EventEmitter 'error' with no listener, so the process exits.
    F-123's fix attached the listener to the POOL, which does not fire for a checked-out client.
    The trigger is not exotic and does not depend on the idle timeout being added: ADR-0002 targets
    Neon, and scale-to-zero, a failover or a restart killing a connection mid-transaction all land
    here. Adding set_config('idle_in_transaction_session_timeout') WITHOUT the listener makes it
    worse rather than better, because it introduces a new routine path onto the same emit - which is
    why the architect refused to let the timeout land alone.
  required_change: >-
    Attach pool.on('connect', (client) => client.on('error', handler)) in client(). 'connect' rather
    than 'acquire': pg-pool emits 'connect' once per new client and never removes a listener it did
    not add, while 'acquire' fires per checkout and would stack one listener per use. Handler logs
    name and SQLSTATE only, per the contract's rule 2. Dispatched to sdlc-implementer-backend in the
    round 1 follow-up, bundled with the idle timeout so neither lands alone.
  owner_slot: sdlc-implementer-backend
  status: routed
  resolved_by: null
  resolved_round: null

