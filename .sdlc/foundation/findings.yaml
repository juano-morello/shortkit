- id: F-233
  phase: test
  task: TASK-012
  source: sdlc-test-architect
  round: 1
  severity: major
  kind: design
  file: .sdlc/foundation/design/adr-0014-bff-topology.md
  line: 1
  summary: >-
    better-auth 1.6.26 answers 403 MISSING_OR_NULL_ORIGIN to a state-changing auth request carrying no
    Origin header - and a server-side BFF fetch sends none. Neither ADR-0014 nor web-api-client.md
    mentions it.
  failure_scenario: >-
    Found by probe against the pinned release. Under ADR-0014's topology the browser never reaches the
    API directly; the Next.js BFF proxies. A server-side fetch does not set Origin, so every signup,
    sign-in and sign-out routed through the BFF would answer 403 with a code no artifact predicts. It
    is not reachable today because TASK-012 builds the auth pages in wave 3, which is precisely why it
    is worth settling now rather than as a wave-3 debugging session - the symptom points at auth while
    the cause is the proxy.
  required_change: >-
    ADR-0014 or web-api-client.md must say what the BFF sends as Origin for auth routes, or how
    better-auth is configured to accept the proxied origin - trustedOrigins is the likely mechanism but
    the architect should confirm against 1.6.26 rather than assume. Settle before TASK-012.
  owner_slot: sdlc-architect
  ruling: >-
    FIXED by sdlc-architect, AND IT CORRECTED THE FINDING'S MECHANISM rather than only fixing it.
    My text said the 403 fires because a server-side fetch sends no Origin. The architect ran the
    package and established the real trigger: sec-fetch-mode: cors, which UNDICI SETS ON EVERY fetch
    with no client involvement, is what makes origin-check.mjs:137 call validateOrigin with
    forceValidate, reaching the throw at :107. A Cookie header triggers it independently. Its words:
    the incomplete version yields a fix that works by accident. THE DECISION: the proxy forwards the
    inbound Origin verbatim on MUTATING METHODS ONLY, and the API sets trustedOrigins from a new
    server-only WEB_APP_ORIGINS. Verified against the installed 1.6.26: GET is exempt; a
    trustedOrigins array EXTENDS the baseURL default rather than replacing it; and the wildcard
    shortkit-*.vercel.app matches previews but NOT bare shortkit.vercel.app, so production and preview
    need two entries while *.vercel.app would trust every app on the platform and is ruled out.
    THE SHARPEST FINDING WAS ONE NOBODY ASKED FOR: POST sign-out with bearer and no Origin returns 200
    TODAY, by a coincidence of middleware coverage and the bearer plugin writing its cookie to
    ctx.headers rather than ctx.request.headers - which is why the rule covers all mutating auth
    routes rather than the two that visibly 403. Inferred and stated as inferred: that a Vercel route
    handler sends sec-fetch-mode the way local Node 24 undici does.
  status: fixed
  resolved_by: sdlc-architect
  resolved_round: 1

