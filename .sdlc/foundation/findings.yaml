- id: F-357
  phase: test
  task: TASK-059
  source: sdlc-test-architect
  round: 1
  severity: major
  kind: security
  file: .sdlc/foundation/design/adr-0036-compose-health-and-ordering.md
  line: 71
  summary: >-
    THE POSTGRES HEALTH PROBE DOES NOT AUTHENTICATE, AND TWO ACCEPTED ADRs REST ON THE CLAIM THAT
    IT DOES. `postgres:17-alpine` ships `host all all 127.0.0.1/32 trust` AHEAD of the scram line
    the entrypoint appends, so a probe over loopback never uses its password.
  failure_scenario: >-
    ORCHESTRATOR-REPRODUCED against the running container, both directions:
      wrong password over 127.0.0.1   -> ACCEPTED
      wrong password over 172.18.0.2  -> FATAL: password authentication failed
    CONSEQUENCE, AND IT INVERTS THE STATED FAILURE MODE: ADR-0031 and ADR-0036 both claim the
    F-315 empty-credential defect makes Postgres UNHEALTHY in about 40 seconds on the first `up`.
    IT DOES NOT. The red step reproduced it: `up -d --wait` returned 0 with `postgres` HEALTHY over
    two passwordless roles. So F-315 fails SILENTLY GREEN rather than loudly - which is the exact
    property the design pass believed protected it, and it is why the check's guards connect to the
    bridge address rather than to loopback.
    THIS ALSO WEAKENS THE EXISTING TEST STACK. docker-compose.test.yml's probe carries a long
    comment explaining why it is better than pg_isready - "Executes a statement AS shortkit_app,
    over TCP on 127.0.0.1... all three halves are load-bearing". Two of the three hold: the roles
    exist and the real server is accepting TCP. The third does not: it never proves the password
    is right, because the trust line answers first.
  required_change: >-
    The probe stays - it is still the right shape and it still beats pg_isready. What must change
    is the CLAIM attached to it in ADR-0031 and ADR-0036, and the reasoning that treated F-315 as
    self-announcing. If a probe that proves credentials is wanted, it connects to the container's
    own address rather than loopback. docker-compose.test.yml's comment needs the same correction.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: "sdlc-architect"
  resolved_round: 1
  resolution: >-
    DISCHARGED at 9191072 and CONFIRMED ON THE SHIPPED STACK. ADR-0036 moves the probe to `-h postgres`; the security auditor reproduced the four trust lines ahead of the appended scram line and both directions - wrong password to 127.0.0.1 inside the container ACCEPTED, same password from the host through the published port REFUSED. Its class hunt found one other instance, docker-compose.test.yml:104, already corrected in the same commit with a do-not-copy comment. And the check's GUARD-1 and GUARD-2 now prove the roles authenticate on every run, which is the part the probe alone never did.

