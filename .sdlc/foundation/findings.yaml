    is outside TASK-007's paths ["packages/contracts/**", "apps/api/src/common/errors/**"].
  failure_scenario: >-
    The red tests boot AppModule and assert on real HTTP responses precisely because calling
    catch() on a filter instance would still pass if the filter were never registered - the
    likeliest way to get this wrong. So the tests cannot go green without the app.module.ts
    edit. TASK-007's implementer hits a file outside its whitelist and either commits an
    ownership violation or returns BLOCKED. AC-13 cannot be satisfied either way.
  required_change: >-
    Add apps/api/src/app.module.ts to TASK-007's paths. It is already a declared structural
    serialisation point in plan.md's wave table, shared by every TASK registering a Nest module.
  owner_slot: null
  status: fixed
  resolved_by: juano
  ruling: >-
    RULED 2026-08-05. APPROVED, narrow glob. apps/api/src/app.module.ts added to TASK-007's
    paths - the single file, not a directory. Juano was offered the whole-directory and
    re-cut-the-boundaries alternatives and took the narrow one. VERIFIED before applying that
    no other wave-1 TASK (002, 004, 005) names app.module.ts, so wave 1 remains parallel-safe;
    later waves already merge this file deliberately per plan.md's wave table. Recorded in
