- id: F-051
  phase: test
  task: TASK-001
  source: sdlc-reviewer + sdlc-security-auditor
  round: 1
  severity: nit
  kind: implementation
  file: apps/api/src/main.ts
  line: 19
  summary: >-
    process.env.PORT ?? DEFAULT_PORT treats an empty PORT as valid, and a failed bootstrap
    surfaces only as a bare unhandled rejection. Raised independently by both auditors.
  failure_scenario: >-
    ?? falls back only on null/undefined. PORT="" - common when an unset var is expanded
    into an env file or compose config - makes the app listen on '' rather than 3001;
    Express treats an empty string as a path/pipe, so the process comes up unreachable
    instead of falling back and the health check on the documented port fails against an
    otherwise healthy process.
  required_change: >-
    Validate as an integer in 1-65535 and fall back otherwise, or defer entirely to
    TASK-004's env schema, and attach a failure handler to bootstrap() that logs before exit.
  owner_slot: sdlc-implementer-backend
  status: fixed
  resolved_by: sdlc-implementer-backend
  resolved_round: 1
  ruling: >-
    Fixed in round 1. resolvePort validates an integer in 1-65535 and falls back otherwise;
    bootstrap().catch() logs through the shared error envelope and exits 1 rather than surfacing a
    bare unhandled rejection. ORCHESTRATOR VERIFIED the predicate across PORT="" -> 3001, PORT=0
    -> 3001, PORT=70000 -> 3001, PORT=abc -> 3001, PORT=8080 -> 8080.
  reaudit_r2: >-
    ADDRESSED by both auditors. sdlc-reviewer constructed its own cases: undefined, "", "   ", "abc", "0", "65536" all fall back to 3001 and "3000" passes. It noted "0x1f" -> 31 and "3e3" -> 3000 are Number() being permissive rather than a defect. The bootstrap handler exists; its EXIT PATH has a separate defect, F-059.

- id: F-052
  phase: test
  task: TASK-001
  source: sdlc-reviewer + sdlc-security-auditor
  round: 1
  severity: nit
  kind: implementation
  file: package.json
  line: 7
  summary: >-
    engines.node ">=22.12.0" while @types/node is 24.13.3, so the compiler advertises a Node
    API surface wider than the minimum supported runtime. Raised independently by both.
  failure_scenario: >-
    Code typechecks against a Node 24-only API and fails at runtime on the 22.12 floor the
    repo claims to support. engines is also advisory here - no .npmrc, no engine-strict - so
    a contributor or runner on EOL Node installs and runs without error. The deploy image is
    TASK-042's, so exposure is local and CI only.
  required_change: >-
    Align the two: raise the engines floor to the Node major actually targeted for deploy,
    or pin @types/node to the 22.x line. Optionally add .npmrc with engine-strict=true.
  owner_slot: sdlc-implementer-backend
  status: fixed
  resolved_by: sdlc-implementer-backend
  resolved_round: 1
  ruling: >-
    Fixed in round 1 by raising engines.node to >=24.13.0 rather than pinning @types/node down to
    the 22.x line. Compiler and declared runtime floor now agree. FLAGGED FOR JUANO: this DROPS
    Node 22 support, which is a deployment-floor decision rather than a type alignment.
    Defensible - Node 24 is active LTS and no deploy has happened yet, TASK-003 and TASK-042 own
