  summary: >-
    THE TWO COMPOSE STACKS DO NOT COEXIST, AND THE COLLISION DESTROYS THE INTEGRATION SUITE'S
    DATABASE. docker-compose.test.yml runs in Compose project `shortkit` with service `postgres`;
