- id: F-244
  phase: implement
  task: TASK-003
  source: sdlc-security-auditor
  round: 1
  severity: major
  kind: security
  file: apps/api/src/observability/logger.ts
  line: 64
  summary: >-
    The shared logger leaves pino's default `err` serializer active and no REDACT_PATHS entry reaches
    it, so one idiomatic log.error({ err }, ...) writes every own enumerable property of the error -
    including body-parser's `err.body`, the RAW REQUEST BODY.
  failure_scenario: >-
    ORCHESTRATOR REPRODUCED IT against the repo's own installed pino 10.3.1: an error carrying
    body = '{"password":"hunter2","token":"sk_live_DEADBEEF"' emitted through log.error({err}) leaks
    hunter2 verbatim. Confirmed the shipped logger sets redact at :66 and NO serializers override.
    body-parser 2.3.0 attaches the verbatim request body to the 400 it raises, so the attacker path is
    an unauthenticated POST to any /api route with a malformed JSON body carrying a credential. THIS
    IS F-108 IN A WORSE FORM - the full body rather than a quoted fragment - and it is the one field
    shape the new policy does not defend, because the policy is a CONVENTION inside errorLogFields
    while the serializer is CONFIGURATION on the logger every later TASK imports. No current call site
    does it; the distance is one line, and this diff decides the surface for every later TASK. The
    auditor also measured that on Node 24.19 JSON.parse no longer quotes the offending bytes at all,
    so TASK-003.md:108's stated mechanism no longer reproduces - the chosen remedy is nonetheless
    stronger because it does not depend on a V8 message format, and the raw body was always on
    err.body rather than in the message.
  required_change: >-
    Close it at the logger rather than by comment. Override serializers: { err: (e) => errorLogFields(e,
    { includeMessage: false }) } so the err key routes through the same policy - the durable option,
    because it makes the misuse impossible instead of enumerating the fields it leaks. Appending
    err.body, err.message, err.stack and err.raw to REDACT_PATHS is the weaker alternative.
  correction: >-
    CORRECTED 2026-08-09, ruled by Juano, after the first end-to-end measurement anyone in this
    chain performed. THE STATED ATTACKER PATH DOES NOT OCCUR. body-parser 2.3.0 read.js does
    attach the raw body - createError(400, err, { body: str, type }), own and enumerable, exactly
    as claimed - BUT @nestjs/core routes-resolver.js:94-101 mapExternalException replaces every
    SyntaxError with new BadRequestException(err.message) before any filter sees it, so the error
    carrying `body` never reaches application code. What the shipped filter receives has ownKeys
    stack, response, status, options, message, name; body and cause are undefined. No application
    seam observes the original - an express error middleware before init() sits ahead of the
    parsers, one after sits behind Nest's handler, and both were tried. THE REMEDY STANDS AND THE
    CONTROL IS STILL NEEDED: the leak shapes are reachable without body-parser at all (F-260 and
    F-263 both leak with none involved), and the real framework-400 exposure is the MESSAGE, into
    which V8 quotes the first ten characters of the body. That is F-108, now confirmed live. Only
    the failure_scenario above was wrong; it is kept verbatim rather than rewritten so the record
    shows what was believed and when it was disproven.
  owner_slot: sdlc-implementer-backend
  ruling: >-
    PARTIALLY ADDRESSED in fix round 1 and REOPENED AS F-248 for the half the fix does not reach. The
    err key is genuinely closed - serializers.err routes through errorLogFields, and a hooks.logMethod
