- id: F-094
  phase: implement
  task: TASK-007
  source: sdlc-security-auditor
  round: 1
  severity: minor
  kind: contract
  file: .sdlc/foundation/design/contracts/error-envelope.md
  line: 192
  summary: >-
    Branch 3's 400 arm copies an HttpException's message into the body verbatim, and for the
    framework's own 400 that message contains a fragment of the raw request body - which the contract
    mandates, so the code is compliant and the contract is what needs changing.
  failure_scenario: >-
    ORCHESTRATOR REPRODUCED the reflection on Node 24.19 - JSON.parse of
    '{"password":"hunter2","token":"eyJhbGciOi","x":}' produces the message
    `Unexpected token '}', ..."ciOi","x":}" is not valid JSON`, carrying a fragment of the token into
    details.fieldErrors._form. Nest maps a body-parser SyntaxError to BadRequestException(err.message),
    so an unauthenticated POST with a malformed JSON body reflects roughly 15-30 raw bytes of that body.
    The bytes are the sender's own so no privilege boundary is crossed, but error-envelope.md invariant
    8 says flatly that no error body contains a password or a token, and this path can put a fragment
    of one there. It is also inconsistent with the 404 arm three lines above, where the implementer
    introduced a fixed NOT_FOUND_MESSAGE for precisely this reason.
  required_change: >-
    Amend error-envelope.md so the framework-400 arm gets the same treatment as the 404 arm - a fixed
    _form message, or a hard truncation with the raw fragment dropped - then the code half follows.
    Filed against the contract rather than the code because the code implements the contract as
    written. Routing rule 0 - design/** belongs to sdlc-architect.
  owner_slot: sdlc-architect
  ruling: >-
    FIXED in fix round 1 - contract half by sdlc-architect, code half by sdlc-implementer-backend - and
    ADDRESSED by both auditors. Resolving it as a CONTRACT AMENDMENT rather than a code-only fix was
    correct: the code implemented the contract as written, so a code-only fix would have left the
    contract instructing the leak. The shipped constant matches the pinned value exactly and the
    HttpException message no longer reaches the body on any arm. Keeping it module-private is right -
    the frozen spec hand-copies the literal, and exporting it would invite a test asserting the code
    against itself. SEC-10 records that the bytes moved to the LOG, which is a narrower audience but not
    a GC-9 fix; deferred to TASK-003, which owns this file and the logging policy.
  status: fixed
  resolved_by: sdlc-architect
  resolved_round: 1

- id: F-095
  phase: implement
  task: TASK-007
  source: sdlc-security-auditor
  round: 1
  severity: minor
  kind: behavior
  file: packages/contracts/src/errors.ts
  line: 125
  summary: >-
    toValidationDetails caps neither the issue count nor the messages per key, so a small request body
