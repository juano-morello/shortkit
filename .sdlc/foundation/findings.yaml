  reaudit_r2: >-
    ADDRESSED by sdlc-reviewer r2. It confirmed the artifact independently: _ts_decorate appears 4x and __decorateClass 0x in dist/main.js, i.e. the swc helper not esbuild's, so tsup's swc path really ran and emitDecoratorMetadata survives the build. It called that the single highest risk in moving off tsc and judged it discharged. The rootDir scatter failure is now structurally impossible (tsup has one outDir).

