  severity: major
  kind: implementation
  file: apps/api/tsconfig.build.json
  line: 6
  summary: >-
    apps/api has no working build or runtime path to @shortkit/contracts. The first
    apps/api/src file that imports it makes `pnpm build` exit non-zero, and the emitted
    CommonJS would require TypeScript source the declared minimum Node cannot load.
  failure_scenario: >-
    REPRODUCED IN-REPO by the orchestrator, not accepted on the auditor's scratch project.
    Adding apps/api/src/probe-contracts.ts importing ERROR_CODE_STATUS from
    @shortkit/contracts gives pnpm typecheck EXIT=0, pnpm test EXIT=0, pnpm build EXIT=2
    with two TS6059 "not under rootDir" errors. Two gates green, one red. ADR-0005 and
    errors.ts's own header say the API exception filter reads this table, so the import is
    certain, not hypothetical - it lands in wave 1 or 2. Relaxing rootDir does not fix it:
    tsc never rewrites module specifiers, so dist/main.js would resolve the package to a
    .ts file. Node 22.12-22.17 (inside the declared engines floor of >=22.12.0) has no
    default type stripping and dies with ERR_UNKNOWN_FILE_EXTENSION. Type stripping is
    erasable-syntax-only regardless, so an enum or decorator in contracts breaks the
    production API at require time on any Node version. SECOND OBSERVATION the auditor did
    not report: the failed build emitted errors.js, errors.js.map, index.js and
    index.js.map into packages/contracts/src/, and none is gitignored, so `git add -A`
    after a failed build commits compiler output into the contracts package.
  required_change: >-
    apps/api needs a proven compile-and-run path for the contracts package before any
    wave-1 TASK imports it. Options: (a) build packages/contracts to dist JS + .d.ts and
    point exports there for the API while keeping source for the bundler-based web app;
    (b) build apps/api with swc/tsup so workspace source is inlined, rather than bare tsc
    with rootDir src; (c) widen rootDir and add specifier rewriting. Acceptance evidence
    must include pnpm build exiting 0 AND node apps/api/dist/main.js starting, with a real
    apps/api/src -> @shortkit/contracts import present. Also gitignore the emitted JS.
    ADR-0005's alternatives table rules out (a) on TYPECHECK grounds only and never
    addresses the API's runtime, so this needs a design ruling before an implementation.
  owner_slot: null
  status: fixed
  escalated_to: juano
  resolved_by: sdlc-implementer-backend
  resolved_round: 1
  ruling: >-
