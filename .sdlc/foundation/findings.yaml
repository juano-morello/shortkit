- id: F-352
  phase: implement
  task: TASK-006
  source: sdlc-security-auditor
  round: 5
  severity: major
  kind: test-coverage
  file: apps/api/test/isolation/registrations.ts
  line: 1
  summary: >-
    `unqualifiedWritesAlsoSet` TAKES A FREE `SQL` FRAGMENT, AND A COLUMN REFERENCE IN IT SILENTLY
    DISARMS BOTH UNQUALIFIED UPDATES. The field's own safety claim - "it cannot hide a leak: the
    statement still carries no WHERE clause, so it still sweeps every row the USING clause admits"
    - IS MEASURABLY FALSE.
  failure_scenario: >-
    Measured on the F-302 canary shape:
      set label = <const>                    -> UPDATE 2   leak, 2 > 1 fires
      set label = <const>, status = status   -> UPDATE 1   SILENT, digest sees nothing
      set tenant_id = <A>                    -> UPDATE 2
      set tenant_id = <A>, status = status   -> UPDATE 1
    THE WHERE CLAUSE IS NOT WHAT KEEPS SELECT POLICIES OUT - THE COLUMN REFERENCE IS, and
    isolation-coverage.md:569 ALREADY STATES THAT NORMATIVELY. F-345 derives the WHERE invariant
    from the compiled SQL and throws at registration; this invariant is enforced by nothing.
    Worse, the F-344 control asserts `rowsAffected: 1`, WHICH IS PRECISELY THE DISARMED SIGNATURE.
    NOT A BLOCKER: the one shipped use is `status = 'active'`, a bound literal, correctly armed.
    But `version = version + 1` is THE IDIOMATIC FRAGMENT for an optimistic-lock guard, and the
    author has no signal that the two categories differ.
    THIS IS THE SAFETY CLAIM F-344's FIX MADE, DISPROVED. That fix was itself the correct rejection
    of a remedy I relayed - so the agent was right about the remedy and wrong about its own
    guarantee, which is why an adversarial check of one's own fix has to be adversarial about the
    right thing.
  required_change: >-
    Make the field `{ column, value }[]` so a column reference is UNEXPRESSIBLE. Not a validation
    that rejects one - a shape in which the mistake cannot be written, which is what F-345 achieved
    for the WHERE invariant and what the ContractViolationError split achieved on TASK-008.
  reaudit_r6: >-
    VERDICTED ADDRESSED AT THE FINAL RE-REVIEW, CONFIRMED AT THE DATABASE LEVEL RATHER THAN FROM
    THE TYPE. On the leak canary's exact shape as shortkit_app in a tenant-A transaction:
    `lock_token = lock_token || 'x'` (the r4 idiom) -> UPDATE 1, the silent disarm;
    `lock_token = $1 <- 'held'` (r5 primary) -> UPDATE 2, armed;
    `lock_token = $1 <- 'lock_token'` (r5 adversarial) -> UPDATE 2, armed. reparentAll identical.
    AND THE MITIGATION IS BROADER THAN THE ONE MUTATION THE FIX NAMED, which the auditor found by
    looking for a neighbour rather than checking the named case: sql.identifier(String(value))
    gives `lock_token = "lock_token"` -> UPDATE 1, the same signature as sql.raw, and the control
    catches it too. THAT NEIGHBOUR MATTERS MORE THAN THE NAMED ONE - sql.identifier is the function
    already used one token to the left for `column`, so "make the value work like the column does"
    is the plausible edit rather than the contrived one.
    It also confirmed the new control fails for ITS OWN reason and not through registry drift - the
    F-347 trap - and that the rowsAffected: 1 pairing carries the weight the single assertion no
    longer does, because the only way to get 1 over a wide-open USING is a column reference,
    measured three ways, and that is now unexpressible.
  owner_slot: sdlc-test-architect
  status: fixed
  resolved_by: "sdlc-test-architect"
  resolved_round: 5
  resolution: >-
    CLOSED BY A SHAPE CHANGE RATHER THAN A VALIDATION. unqualifiedWritesAlsoSet is now RequiredAssignment[] - { column, value } with a scalar value - and the HARNESS builds the fragment, so every value binds as $N. The two disarming rows are now UNEXPRESSIBLE at TS2322 rather than rejected at runtime, and what the harness emits instead measures UPDATE 2, still armed. CONFIRMED FROM THE POSTGRES SERVER LOG rather than from the source: with log_statement='all' a full run sends `set "label" = $1, "lock_token" = $2` and `set "tenant_id" = $1::uuid, "status" = $2` - no column on any right-hand side.
    RED CAME FIRST AND IT WAS REAL: a new control registered with the IDIOMATIC `lock_token = lock_token || 'x'` made the harness report ZERO failing attempts over a policy admitting every row of every tenant. The disarming demonstrated live rather than argued.
    AND IT FALSIFIED ITS OWN GUARANTEE, PUBLISHING THE ONE ATTACK THAT WORKS. Six fail at the type level - SQL as value, sql`version + 1`, SQL as column, sql.raw, a value of 'status' which binds and stays armed, and identifier injection which Postgres answers 42703 loudly. THE SEVENTH SUCCEEDS: the type constrains the CALLER, NOT THE BUILDER, so mutating the builder to sql.raw(String(value)) breaks it - which is why the adversarial control ships, being the only test that then fails SILENTLY rather than erroring out.
    ORCHESTRATOR-VERIFIED: integration 62 passed exit 0; under the F-330 mutation exit 1 with UNVERIFIED x4 and report.json verdict=fail; database restored and its four original predicates confirmed.

