- id: F-379
  phase: implement
  task: TASK-059
  source: sdlc-security-auditor
  round: 1
  severity: major
  kind: security
  file: scripts/check-compose-stack.sh
  line: 207
  summary: >-
    THE NOTICE LOOP PRINTS THE VALUE OF POSTGRES_SUPERUSER_PASSWORD TO STDERR - and the correct
    pattern, name only, already exists TWENTY LINES UP IN THE SAME FILE.
  failure_scenario: >-
    ORCHESTRATOR-CONFIRMED at :207: `printf 'note: $%s is exported (%s)...' "$noisy" "${!noisy}"`.
    The auditor reproduced it verbatim - `note: $POSTGRES_SUPERUSER_PASSWORD is exported
    (hunter2-real-prod-password).` The loop runs before any Docker call.
    THE ATTACKER IS NOT AT THE KEYBOARD. The path is that the new .env.example invites overriding
    that variable BY NAME, and this repository's convention is to paste check output verbatim into a
    committed report in a public repo. Lines 180-189 handle the same class correctly - name, no
    value - so the fix is to match the pattern already in the file.
  required_change: Print the name, not the value. One line.
  owner_slot: sdlc-test-architect
  status: fixed
  resolved_by: "sdlc-test-architect"
  resolved_round: 1
  resolution: >-
    CLOSED, AND THE FIX IS A GUARD RATHER THAN A REDACTION. Notices now accumulate into a variable instead of printing as produced - the agent's reason is the good part: `nothing can be asserted about a line already on the terminal`. Two passes then inspect that text before emission; credential-shaped names FAIL CLOSED at exit 2 if a value turns up inside, and other names drop the notices with a reason, because COMPOSE_PROJECT_NAME=check legitimately collides with the word `check` in the message. Shape-matched rather than a second hand-written list, so a credential name added to the list later gets the strict half for free.
    IT VERIFIED THE GUARD BY PUTTING THE EXACT DEFECT BACK - (%s) and "${!noisy}" restored, diff-confirmed as the only change - and that copy exits 2 and leaks nothing.
    ORCHESTRATOR-VERIFIED LIVE: fifteen clauses pass exit 0; with POSTGRES_SUPERUSER_PASSWORD='hunter2-canary' exported the run exits 0 with ZERO occurrences of the value across both streams and the NAME printed. Integration container untouched at three hours up.
    AND IT ARGUED THE NAME-PRINTING CALL RATHER THAN ASSUMING IT: a name is not a secret - .env.example commits POSTGRES_SUPERUSER_PASSWORD - the name is the entire actionable content of a message whose only claim is `this check does not assert it`, and refuse already prints names, so a second convention in one file would be worse than either choice.

- id: F-380
  phase: implement
  task: TASK-059
  source: sdlc-security-auditor
  round: 1
  severity: major
  kind: design
  file: .sdlc/foundation/design/adr-0040-trusted-client-address-is-declared-and-may-be-absent.md
  line: 167
  summary: >-
    ADR-0040 GATES ITS BOOT ASSERTION ON `NODE_ENV === 'production'` AND SAYS "there is no
    production". `Dockerfile:83` IS `ENV NODE_ENV=production`, IN THE IMAGE COMPOSE RUNS.
  failure_scenario: >-
    ORCHESTRATOR-CONFIRMED both halves. Nothing is exploitable today - the assertion is unwritten
    and TASK-009 is deferred - but the ADR's two supporting claims are false against the artifact
    shipped in the same window, and it was accepted TODAY.
    WHEN TASK-009 LANDS, `docker compose up` REFUSES TO BOOT `api`, and the three cheapest repairs
    are all bad: declare a header in a stack with no stripping hop; set NODE_ENV=development, WHICH
    SILENTLY DISABLES EVERY PRODUCTION-GATED ASSERTION INCLUDING assertBffProxySecretConfigured; or
    widen the gate. The middle one is the one a developer reaches for at 6pm.
    Found in design mode on an ADR accepted inside the diff under review - the auditor was auditing
    TASK-059 and read the ADR its own compose file depends on.
  required_change: >-
    ESCALATED TO JUANO - the gate choice is his, not the architect's. The question is what the
    assertion is gated on, given that the local stack legitimately runs the production image.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: "sdlc-architect under Juano's ruling"
  resolved_round: 1
  resolution: >-
    APPLIED under Juano's ruling. The trigger is now CLIENT_TRUST_BOUNDARY = proxy | direct, with unset read as direct: `proxy` requires the header and fails boot without it; `direct` and unset assert nothing, so no principal and fail-open-with-signal, which is what was already ruled. AND ANY OTHER VALUE FAILS BOOT UNCONDITIONALLY - a typo must not silently mean the permissive thing, so `Proxy` or `true` is caught in tests and CI rather than only where nobody looks yet. The one check that CAN be unconditional now is.
    THE READ IS UNTOUCHED: readTrustedClientAddress's four rules key on TRUSTED_CLIENT_IP_HEADER alone, so the boundary governs whether FORGETTING the header is an error and never governs what is read. Blast radius is the assertion. :167 struck in place with Dockerfile:83 as the disproof.
    RE-PRICED HONESTLY, WITH TWO NEW COSTS. The gate is now OPT-IN, so an operator who forgets BOTH variables in a real deployment boots cleanly with no limit and no complaint - weaker than a refusal, and the stated price of not letting a build flag decide a trust question; trusted_client_ip_unresolved_total is promoted from decorative to load-bearing as the mitigation. And two variables can now disagree: `proxy` plus a header the hop does not set boots, asserts clean, trusts nothing, AND READS LIKE A WORKING DEPLOYMENT.

