- id: F-046
  phase: test
  task: TASK-001
  source: sdlc-reviewer
  round: 1
  severity: minor
  kind: implementation
  file: apps/api/tsconfig.json
  line: 5
  summary: apps/api uses moduleResolution "Node" (node10), which ignores package exports maps.
  failure_scenario: >-
    node10 finds types only via main/typings and real directories. Every dependency the
    roadmap adds that publishes subpath types exclusively through "exports" - better-auth
    (ADR-0013 mounts better-auth/node), several @upstash/redis and pino transport subpaths
    - resolves to TS2307, and the cheapest green fix is a declare-module shim or any, which
    silently discards the types the design relies on. Auditor's stated limit: none of those
    packages are installed yet, so it could not demonstrate the failure; everything
    currently in apps/api does resolve under node10, which is why typecheck is green today.
  required_change: >-
    Move apps/api to moduleResolution node16 (or nodenext with the matching module setting)
    now, while the workspace has four dependencies, rather than after fifty TASKs are
    written against node10 semantics. If node10 is deliberate, record why - it constrains
    every backend dependency choice that follows.
  owner_slot: sdlc-implementer-backend
  status: fixed
  resolved_by: sdlc-implementer-backend
  resolved_round: 1
  ruling: >-
    FIXED, remedy PARTIALLY DISPUTED and the dispute ACCEPTED on evidence. The implementer moved
    apps/api to module Preserve / moduleResolution Bundler rather than the nodenext the reviewer
    proposed, arguing nodenext forces .js extensions in the ESM contracts source, which makes
    Turbopack fail to resolve ./errors.js -> errors.ts and turns pnpm build red for apps/web, and
    that it contradicts the frozen TASK-007 stub. ORCHESTRATOR VERIFIED THE UNDERLYING DEFECT IS
    FIXED rather than accepting the argument: importing reflect-metadata/lite, an exports-only
    subpath, gives typecheck exit 2 TS2307 under node10 and exit 0 under Bundler. Reading exports
    maps is the property F-046 was about. Bundler is also the semantically correct mode now that
    Juano ruled apps/api is built by tsup, which is a bundler.
  reaudit_r2: >-
    ADDRESSED. sdlc-reviewer WITHDREW node16/nodenext and accepted Bundler. Asked to name a concrete residual gap, it gave one: Bundler does not enforce Node ESM/CJS interop, so an ESM-only dep can typecheck while dist/main.js emits require(). But F-052 raised the floor to Node 24 in the same round, and Node 24 supports require() of ESM, so the residual narrows to an ESM-only dep containing top-level await - ERR_REQUIRE_ASYNC_MODULE, rare and loud at boot, unlike the node10 failure whose danger was silence.

- id: F-047
  phase: test
  task: TASK-001
  source: sdlc-security-auditor
  round: 1
  severity: minor
  kind: security
  file: package.json
  line: 6
  summary: packageManager pins pnpm@11.20.0 with no integrity hash.
  failure_scenario: >-
    Whoever can serve a tampered pnpm tarball to a CI runner - pnpm publisher account
    compromise, or a registry proxy/mirror - gets code execution as the build user on every
    job, and those jobs will hold Fly, Neon and Upstash credentials. Corepack runs before
    any lockfile integrity check, because pnpm is what performs those checks. All 470
    locked packages carry a sha512; the package manager itself is the only unverified fetch.
  required_change: >-
    Use pnpm@11.20.0+sha512.<hash> from `corepack use pnpm@11.20.0`, and have TASK-002 use a
    setup step that reads packageManager rather than hardcoding a bare version.
  owner_slot: sdlc-implementer-backend
  status: fixed
  resolved_by: sdlc-implementer-backend
  resolved_round: 1
  ruling: >-
    Fixed in round 1 via `corepack use pnpm@11.20.0`. VERIFIED: packageManager reads
    pnpm@11.20.0+sha512.9a6f330a..., and pnpm install --frozen-lockfile exits 0 from a clean
    install. The one unverified fetch in a 470-package sha512 tree is closed.
  reaudit_r2: >-
    PARTIALLY ADDRESSED. sdlc-security-auditor VERIFIED THE HASH AGAINST THE NPM REGISTRY - it fetched pnpm@11.20.0 metadata and converted dist.integrity from base64 to hex, byte-identical to the packageManager value. The hash is real. The second half of its round-1 required_change was dropped: no CI setup step resolves pnpm from packageManager, so the hash is decorative. Orchestrator confirmed zero hits for packageManager or corepack across tasks/ and design/. Tracked as F-064.

