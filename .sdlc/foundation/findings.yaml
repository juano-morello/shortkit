- id: F-213
  phase: ship
  task: TASK-005
  source: sdlc-integrator
  round: 1
  severity: major
  kind: security
  file: apps/api/scripts/check-policies.mts
  line: 1
  summary: >-
    F-147's exemption cross-check queries information_schema.columns, WHICH POSTGRES FILTERS BY
    PRIVILEGE. A table the app role cannot see returns zero rows, so the gate prints "confirmed: no
    tenant_id column" and exits 0 on a tenant-bearing table with row security off.
  failure_scenario: >-
    REPRODUCED BY THE INTEGRATOR AND INDEPENDENTLY BY THE ORCHESTRATOR. Created `session` with a
    tenant_id column and no RLS, then REVOKE ALL ON session FROM shortkit_app. As the app role,
    information_schema.columns returns 0 rows for that column while pg_attribute returns 1 -
    information_schema is privilege-filtered, pg_attribute is not. The gate then printed
    "skip session - exempt: Better Auth. No tenant_id (ADR-0003, ADR-0015) (confirmed: no tenant_id
    column)" and "OK: 2 table(s) in schema public, all protected or exempt", EXIT 0. THE WORD
    "confirmed" IS A FALSE CLAIM. This is precisely the scenario F-147's hardening was written to
    prevent - an auth table that lands WITH a tenant_id being waved through - and the hardening
    introduced the blind spot by choosing a privilege-filtered view and running as the constrained
    role. The check connects as the runtime role deliberately, per F-122, because checking as the
    migrator would prove nothing about the DSN the API uses; that decision is right and it is what
    makes information_schema the wrong catalog.
  required_change: >-
    Query pg_attribute rather than information_schema.columns for the exemption cross-check.
    Verified by both parties in the same session: pg_attribute is not privilege-filtered and
    returns the column where information_schema returns nothing. Keep the runtime-role connection.
  owner_slot: sdlc-implementer-backend
  status: fixed
  resolved_by: sdlc-implementer-backend
  resolved_round: 1
  ruling: >-
    NOT A MERGE BLOCKER, and the integrator's reasoning is the one I am taking: the four exempt
    tables DO NOT EXIST YET, so the blind spot has nothing to hide behind today - the gate reported
    three of them as "not evaluated" in my own run. FIX BEFORE TASK-009, which creates exactly those
    four tables and is the moment the defect becomes reachable. Recorded on TASK-009's card rather
    than left in the ledger.

    FIXED 2026-08-06 by sdlc-implementer-backend, AND THE BLINDNESS WAS DEMONSTRATED rather than the fix
    asserted. It built this finding's exact scenario - a table named session, an exempt name, carrying
    tenant_id, with row security OFF and all privilege revoked from shortkit_app - then queried both
    sources on the same connection at the same instant: information_schema.columns returned ZERO ROWS,
    pg_attribute returned ONE. The old script printed 'confirmed: no tenant_id column' and exited 0 over
    a tenant-bearing unprotected table; the fixed script fails it and exits 1. ORCHESTRATOR VERIFIED no
    live query remains - the three surviving information_schema.columns mentions are all commentary
    explaining why it is NOT used. The output wording changed too, from 'confirmed' to 'confirmed
    against pg_attribute, which is not privilege-filtered', so the claim the gate makes is now the claim
    it can support.

