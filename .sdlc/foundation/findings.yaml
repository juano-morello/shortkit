- id: F-244
  phase: implement
  task: TASK-003
  source: sdlc-security-auditor
  round: 1
  severity: major
  kind: security
  file: apps/api/src/observability/logger.ts
  line: 64
  summary: >-
    The shared logger leaves pino's default `err` serializer active and no REDACT_PATHS entry reaches
    it, so one idiomatic log.error({ err }, ...) writes every own enumerable property of the error -
    including body-parser's `err.body`, the RAW REQUEST BODY.
  failure_scenario: >-
    ORCHESTRATOR REPRODUCED IT against the repo's own installed pino 10.3.1: an error carrying
    body = '{"password":"hunter2","token":"sk_live_DEADBEEF"' emitted through log.error({err}) leaks
    hunter2 verbatim. Confirmed the shipped logger sets redact at :66 and NO serializers override.
    body-parser 2.3.0 attaches the verbatim request body to the 400 it raises, so the attacker path is
    an unauthenticated POST to any /api route with a malformed JSON body carrying a credential. THIS
    IS F-108 IN A WORSE FORM - the full body rather than a quoted fragment - and it is the one field
    shape the new policy does not defend, because the policy is a CONVENTION inside errorLogFields
    while the serializer is CONFIGURATION on the logger every later TASK imports. No current call site
    does it; the distance is one line, and this diff decides the surface for every later TASK. The
    auditor also measured that on Node 24.19 JSON.parse no longer quotes the offending bytes at all,
    so TASK-003.md:108's stated mechanism no longer reproduces - the chosen remedy is nonetheless
    stronger because it does not depend on a V8 message format, and the raw body was always on
    err.body rather than in the message.
  required_change: >-
    Close it at the logger rather than by comment. Override serializers: { err: (e) => errorLogFields(e,
    { includeMessage: false }) } so the err key routes through the same policy - the durable option,
    because it makes the misuse impossible instead of enumerating the fields it leaks. Appending
    err.body, err.message, err.stack and err.raw to REDACT_PATHS is the weaker alternative.
  correction: >-
    CORRECTED 2026-08-09, ruled by Juano, after the first end-to-end measurement anyone in this
    chain performed. THE STATED ATTACKER PATH DOES NOT OCCUR. body-parser 2.3.0 read.js does
    attach the raw body - createError(400, err, { body: str, type }), own and enumerable, exactly
    as claimed - BUT @nestjs/core routes-resolver.js:94-101 mapExternalException replaces every
    SyntaxError with new BadRequestException(err.message) before any filter sees it, so the error
    carrying `body` never reaches application code. What the shipped filter receives has ownKeys
    stack, response, status, options, message, name; body and cause are undefined. No application
    seam observes the original - an express error middleware before init() sits ahead of the
    parsers, one after sits behind Nest's handler, and both were tried. THE REMEDY STANDS AND THE
    CONTROL IS STILL NEEDED: the leak shapes are reachable without body-parser at all (F-260 and
    F-263 both leak with none involved), and the real framework-400 exposure is the MESSAGE, into
    which V8 quotes the first ten characters of the body. That is F-108, now confirmed live. Only
    the failure_scenario above was wrong; it is kept verbatim rather than rewritten so the record
    shows what was believed and when it was disproven.
  owner_slot: sdlc-implementer-backend
  ruling: >-
    PARTIALLY ADDRESSED in fix round 1 and REOPENED AS F-248 for the half the fix does not reach. The
    err key is genuinely closed - serializers.err routes through errorLogFields, and a hooks.logMethod
    block closes the positional log.error(err) door that the serializer alone left open, which the
    implementer measured and sdlc-test-architect independently reproduced as mutation M2. sdlc-reviewer
    judged the hook EARNS ITS PLACE rather than being scope creep: the serializer alone leaves msg,
    which is the one field no redact path can censor without censoring every line, and msg carries the
    exact field the message policy makes default-deny everywhere else. NINE TESTS NOW DEFEND IT, each
    proven by a mutation that fails exactly it and reverted with a sha256 check. But the fix is keyed by
    FIELD NAME, so { error: e } and { ctx: { err: e } } still leak the raw body - reproduced by me. That
    is F-248, and it is the same enumeration weakness this finding rejected, one level up.
  status: fixed
  resolved_by: sdlc-implementer-backend
  resolved_round: 1

- id: F-245
  phase: implement
  task: TASK-003
  source: sdlc-reviewer, sdlc-security-auditor
  round: 1
  severity: major
  kind: behavior
  file: apps/api/src/main.ts
  line: 74
  summary: >-
    assertBootPreconditions treats "the database could not be reached" identically to "the runtime
    role can bypass RLS", so transient Postgres unavailability at boot makes the process refuse to
    start, with no retry and no distinction.
  failure_scenario: >-
    RAISED BY BOTH AUDITORS INDEPENDENTLY. VERIFIED at main.ts:71-75 - it awaits
    assertRuntimeRoleCannotBypassRls(), which rejects for every reason pg can reject. db/client.ts
    sets connectionTimeoutMillis 2000 and F-149 establishes pg-pool applies that to ESTABLISHMENT, not
    only queue wait. GC-3 pins Neon's free tier, which scales to zero, so a cold wake exceeding 2s
    exits 1 and /health never binds. THE RESTART CASE IS THE ONE THAT WAS NEVER ANALYSED: the
    architect's "a failed deploy leaves the old version serving" holds for a deploy, where deploy.sh
    has just migrated so the database is warm, and does NOT hold for a restart, where there is no
    previous version. VERIFIED fly.toml:49 auto_start_machines = false, so once Fly's restart budget
    is spent nothing brings the machine back on an incoming request - recovery needs a human even
    after the database is healthy. Before this diff main.ts opened no database connection at boot at
    all, so the same outage left the process up with /health answering 200 and it self-recovered. Not
    a literal GC-8 violation - a process that never binds returns no 5xx - but it removes the branded
    404 path's only survival mode during a database outage. Both auditors confirmed nothing
    attacker-controlled reaches either precondition.
  required_change: >-
    Boot must refuse when the check ANSWERS and the answer is unsafe, and must not refuse merely
    because the check could not be ANSWERED. Either a bounded retry with backoff on the reachability
    half, or a connect timeout distinct from the per-request one - and the two conditions must be
    distinguishable in the log line. F-116 ruled on the unsafe-answer case only. Settle the
    interaction with auto_start_machines = false at the same time. Leave precondition 1 alone; it does
    no I/O and cannot flake.
  owner_slot: sdlc-implementer-backend
  ruling: >-
    ADDRESSED in fix round 1, verdicted by sdlc-reviewer (r2, APPROVED). The implementer DECIDED rather
    than escalating and the reviewer judged that its call to make - the dispatch said decide-and-record
    or escalate, the decision sits inside this finding's own option set, and it settles the
    auto_start_machines interaction the finding required in the same round. Reachability now retries
    with backoff over a 20s budget, separated from the RLS verdict, with boot_precondition on the
    refusal line; auto_start_machines flipped false to true and grace_period 10s to 30s. Transcript: an
    unsafe role refuses in 1s, an unreachable one retries nine times then exits, and a paused Postgres
    unpaused at t+7s now BOOTS AND SERVES where it previously exited on attempt 1. THE PROPERTY THE
    REVIEWER CHECKED HARDEST: structurally the loop can only return on a clean answer, so no
    classification error in either direction can boot with RLS unverified - which is F-116's actual
    requirement and holds independent of string drift. FOUR RESIDUALS, all minor or nit, none extending
    the loop: an unset DATABASE_URL is misclassified as unreachable and retried 20s under the wrong
    precondition (VERIFIED by me); the budget bounds waits between attempts rather than a single hung
    attempt; the Fly recovery semantic is asserted as settled fact in fly.toml and main.ts when it is
    inferred; and the classifier reads error.message unguarded in the same round that hardened that
    read three files away.
  status: fixed
  resolved_by: sdlc-implementer-backend
  resolved_round: 1

- id: F-246
  phase: implement
  task: TASK-003
  source: sdlc-reviewer, sdlc-security-auditor
  round: 1
  severity: major
  kind: behavior
  file: infra/deploy.sh
  line: 25
  summary: >-
    deploy.sh migrates BEFORE it deploys, and accepts any non-empty DATABASE_MIGRATION_URL - so a
    failed image build leaves the schema ahead of the code, and a shell left over from the integration
    suite migrates localhost then ships code to production.
  failure_scenario: >-
    TWO MAJORS THAT SHARE A LINE, raised separately by the two auditors. VERIFIED: db:migrate at :37,
    exec fly deploy at :39, no build or test between. (a) ORDERING - the Dockerfile COPYs an explicit
    file list, so a commit adding a file it does not name builds green locally and fails inside docker
    build, leaving the DDL applied and the OLD image serving against a schema that no longer matches.
    ADR-0004's release_command could not do this because Fly builds first and runs the command inside
    the built image; build-before-migrate was a THIRD property, dropped rather than argued, while
    fly.toml:35-37 claims "ADR-0004's two actual requirements survive". (b) TARGET - docker-compose.
    test.yml:9 and rls-fixture.ts:107 both instruct the operator to export DATABASE_MIGRATION_URL
    pointing at localhost for the integration suite. Running deploy.sh from that shell migrates the
    local container, set -e sees success, and fly deploy ships to production against an UNMIGRATED
    schema - and /health answers 200 without touching the database, so Fly's check passes while every
    DB-backed request 500s, which on the redirect path is GC-8. The dirty-tree guard exists to stop
    exactly this class of silent-wrong-target deploy for the SHA; the more privileged input got no
    equivalent. Third, smaller: the script never anchors to the repo root, and git and pnpm walk up
    while flyctl does not - so running it from a subdirectory migrates and then fails at fly deploy,
