    gained an observed-input table, an unknown -> string | null signature and a fourth required test.
    IT DISPUTED THE FINDING'S BLAST RADIUS AND WAS RIGHT TO. My text said the whole before-hook chain
    goes and the limiter stops existing; the architect established that the chain which dies serves
    THAT REQUEST ONLY, limiter state is untouched, and other callers are unaffected - so the real
    damage is an unmetered 500 generator rather than a disabled limiter. It also corrected the
    attribution: the registry that short-circuits on throw is OURS at ADR-0013:227, not better-auth's,
    which rethrows at dispatch.mjs:88. The fix is unchanged; the reasoning behind it is now accurate.
  status: fixed
  resolved_by: sdlc-architect
  resolved_round: 1

