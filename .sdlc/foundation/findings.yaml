- id: F-236
  phase: test
  task: TASK-054
  source: sdlc-test-architect
  round: 1
  severity: major
  kind: design
  file: .sdlc/foundation/design/contracts/rls-policy-template.md
  line: 1
  summary: >-
    `PrivilegedTenantEraser.erase` written the obvious way erases NOTHING and reports success.
    Postgres applies SELECT policies to any DELETE that references a column, and the erase policy
    grants no read - so a WHERE clause silently matches zero rows.
  failure_scenario: >-
    MEASURED by sdlc-test-architect, not reasoned: DELETE FROM <t> WHERE tenant_id = A under
    app.privileged_erase gives DELETE 0, while the same statement with NO WHERE clause gives DELETE 1.
    The template states the erase policy "grants no read", and that is exactly what makes the WHERE
    unusable. So a GDPR erasure implemented the natural way - scope the delete to the tenant being
    erased - deletes nothing, returns success, and passes any assertion that checks for absence of an
    error. THIS IS F-002'S CLASS RETURNING BY A DIFFERENT ROUTE. F-002 was the design-phase blocker
    where the erasure sequence was denied by its own policy set and reported success over an empty
    set; that was fixed, and this is the same silent-success shape reappearing at the statement level
    rather than the policy level. SC-6 and the GDPR erasure ACs rest on this working.
  required_change: >-
    Decide how the eraser scopes its deletes given that it cannot read. The candidates the architect
    should weigh: a policy that grants read under the privileged flag; collecting ids in a prior
    read-capable transaction; or an unqualified DELETE inside a transaction whose tenant context makes
    the scope implicit. State it in rls-policy-template.md with the measurement above, because the
    natural implementation is the broken one and nothing about it looks wrong. Must land before
    TASK-054.
  owner_slot: sdlc-architect
  status: open
  resolved_by: null
  resolved_round: null

