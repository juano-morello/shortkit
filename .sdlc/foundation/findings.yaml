    29 -> SIGPOLL rather than SIGIO. A tsc that exhausts the V8 heap aborts with SIGABRT, pnpm
    reports Exit status 134, and the operator is told "A child was terminated by SIGIOT". That is a
    runner memory problem - THE CASE F-202 EXISTS TO SURFACE - reported under a name almost nobody
    uses and with the memory hypothesis absent, because oomLikely is SIGKILL-only. The kernel-OOM
    half at 137 is correct and verified.
  required_change: Prefer the canonical name on alias collisions, and keep the out-of-memory hypothesis visible for SIGABRT as well as SIGKILL.
  owner_slot: sdlc-implementer-backend
