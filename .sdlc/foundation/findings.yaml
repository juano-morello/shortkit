  round: 0
  severity: major
  kind: design
  file: apps/api/package.json
  line: 1
  summary: >-
    The exception filter must recognise a ZodError to satisfy the error contract's
    validation_failed path, but apps/api has no zod dependency (verified unresolvable) and
    apps/api/package.json is outside TASK-007's paths.
  failure_scenario: >-
    zod reaches apps/api today only by being inlined into the bundle through
    @shortkit/contracts; it is not a resolvable import in apps/api source. The filter cannot
    instanceof-check a type it cannot import. TASK-007's implementer either adds a dependency in
    a manifest it does not own, or invents a duck-type check on error shape that silently stops
    matching when zod changes its internals.
  required_change: >-
    The test architect's proposal is the cleaner one and avoids the paths problem entirely:
    export isZodError and toValidationDetails from packages/contracts/src/errors.ts, which IS in
    TASK-007's paths and already owns the error vocabulary. That keeps zod's identity on the side
    of the boundary that declares it. Needs a design ruling, since it adds surface to the
    contracts package.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: sdlc-architect
  ruling: >-
    ACCEPTED in ADR-0025 - isZodError, toValidationDetails and FORM_ERROR_KEY are exported from
    packages/contracts/src/errors.ts, which TASK-007 already owns. **TASK-007 therefore does NOT
    need apps/api/package.json**, which answers the half of F-075's ruling that was deliberately
    held pending this decision, and means WAVE 1 REMAINS PARALLEL-SAFE: TASK-005 stays the only
    holder of that manifest and no worktree isolation is needed.
    The architect accepted the remedy while CORRECTING THE FINDING'S PREMISE rather than taking
    it as given. The finding argued from identity - that a duck-type check would break and that
    instanceof needs one copy of zod. That is false for zod 4: ZodError carries its own
    Symbol.hasInstance, so instanceof is a trait check that survives a second copy.
    ORCHESTRATOR VERIFIED against the installed zod 4.4.3 - the own-property symbol is present.
    The real argument is ownership, and the ADR makes it on those terms. It also found that
    err.flatten(), which the contract previously mandated, silently drops root-level .refine()
    failures; toValidationDetails puts them under a _form key.

- id: F-072
  phase: test
  source: sdlc-test-architect
  round: 0
  severity: major
  kind: design
  file: .sdlc/foundation/design/contracts/error-envelope.md
  line: 1
  summary: >-
    Nothing specifies how a domain error carries its ErrorCode to the exception filter. Roughly
    15 downstream TASKs will throw domain errors expecting the filter to map them.
  failure_scenario: >-
    The filter has to answer "what code is this error?" for every error the app throws. No ADR,
    contract or TASK defines the mechanism - a base DomainError class, a code property, a symbol,
    a registry. TASK-007's implementer will invent one, and because it is the first, all ~15
    later TASKs inherit the invention without it ever having been a decision. If it turns out
    wrong, the correction touches every one of them.
  required_change: >-
    Specify the mechanism in error-envelope.md before TASK-007 dispatches. This is exactly the
    class of decision Design exists to fix once rather than have an implementer settle by
    accident.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: sdlc-architect
  ruling: >-
    FIXED by ADR-0024 plus four new normative sections in error-envelope.md. A DomainError class
    in apps/api/src/common/errors/domain-error.ts carries the code, derives status from
    ERROR_CODE_STATUS rather than taking it as an argument, and is recognised by a REGISTERED
    SYMBOL (Symbol.for) instead of instanceof - because apps/api is one bundle today but not
    always: TASK-056's isolation suite and the integration config load the same sources under a
    second vitest project, where a class identity check silently stops matching. Subclasses live
    in the throwing feature's own directory, so none of the fourteen TASKs that throw a coded
    error edits a shared file and no wave conflict is created. Anything without a code answers
    500 with a fixed message and nothing of the original in the body.
    Two gaps the finding did not name were closed with it: a headers field, because rate-limit.md
    invariant 7 requires Retry-After and no mechanism carried a header; and the HttpException
    branch. Tests assert on the constructed error and on one HTTP round trip, never on the
    filter's internals.

