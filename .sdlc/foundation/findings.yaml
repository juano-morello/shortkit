- id: F-162
  phase: implement
  task: TASK-004
  source: sdlc-reviewer
  round: 2
  severity: nit
  kind: implementation
  file: apps/web/scripts/assert-no-inlined-secrets.mjs
  line: 166
  summary: >-
    The widened scan reads every file under both roots as UTF-8 with no extension filter. Correct
    today, wasteful once .next/static/media holds binary assets that can never contain a text
    match.
  failure_scenario: >-
    NOT A CORRECTNESS DEFECT and the reviewer was explicit about that: reading a binary file as
    utf8 cannot throw and cannot produce a false match - it decodes to replacement characters that
    .includes() never matches. The cost is that once real static assets land (favicon, webfonts,
    OG images) the scan reads their full bytes on every CI run and every deploy for no benefit. At
