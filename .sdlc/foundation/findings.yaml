- id: F-032
  phase: design
  source: sdlc-security-auditor
  round: 5
  severity: major
  kind: design
  file: design/contracts/logging-and-headers.md
  line: 14
  summary: The two new headers carry a raw client IP and a shared secret, and neither is in the redact list the same contract declares append-only with a same-commit rule.
  failure_scenario: REDACT_PATHS enumerates fly-client-ip and x-forwarded-for precisely because GC-9 forbids a raw IP in any field from any header. x-shortkit-client-ip is a raw IP on every browser-originated API request; x-shortkit-proxy-auth carries BFF_PROXY_SECRET verbatim. The '*.secret' wildcard matches a property one level deep and does not reach a header key. TASK-003 writes logger.ts in wave 1, before TASK-009 introduces the headers, so nobody holds the pen. A leaked log export then lets anyone forge X-Shortkit-Client-IP against Fly directly and defeat every IP-keyed auth bucket.
  required_change: Add both header paths to REDACT_PATHS in the contract, ADR-0022's Decision block and the logger stub, in this diff, and name the owning TASK. State in web-api-client.md that BFF_PROXY_SECRET is never logged on the Vercel side either.
