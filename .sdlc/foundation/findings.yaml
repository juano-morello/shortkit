- id: F-385
  phase: implement
  task: TASK-059
  source: sdlc-architect
  round: 1
  severity: major
  kind: design
  file: .sdlc/foundation/design/contracts/rate-limit.md
  line: 1
  summary: >-
    `assertBffProxySecretConfigured` HAS THE SAME DEFECT AS F-380 AND IT IS NOT COLLATERAL - IT IS
    THE SAME LIVE BREAK IN THE SAME STACK, INDEPENDENTLY. It is specified as
    `NODE_ENV === 'production'` in rate-limit.md and in the stub; Dockerfile:83 sets that NODE_ENV;
    ADR-0035 records that compose DOES NOT SET BFF_PROXY_SECRET.
  failure_scenario: >-
    SO REPAIRING ADR-0040 ALONE DOES NOT UNBREAK `docker compose up`. The sibling still refuses to
    boot `api` the day TASK-009 lands. I framed this as collateral of a rejected repair when I
    dispatched F-380; the architect corrected me and said plainly it is worse than that framing.
    THE ARCHITECT ALSO BOUNDED IT RATHER THAN LEAVING THE SET OPEN: readBuildCommitSha() and
    assertRuntimeRoleCannotBypassRls() both run UNCONDITIONALLY inside assertBootPreconditions() at
    main.ts:158 and read no NODE_ENV, and a grep across non-test source returns ONE NODE_ENV hit -
    logger.ts:154, a log base field, not a gate. The defect is confined to the two unwritten
    assertions specified for TASK-009.
    Not exploitable today: both assertions are unwritten and TASK-009 is deferred.
  required_change: >-
    Juano's call, and it is the same question one variable over. rate-limit.md's two-assertion table
    is where BOTH triggers are written down, and it also still says
    assertTrustedClientIpHeaderConfigured() "fails boot in production when..." which F-380 just made
    stale - so both belong in ONE edit.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: "sdlc-architect under Juano's ruling"
  resolved_round: 1
  resolution: >-
    APPLIED, AND IT REJECTED ADR-0040's OWN RECOMMENDATION - AND MY DISPATCH'S FRAMING - WITH TWO
    CONCRETE DEPLOYMENTS RATHER THAN AN ARGUMENT. I asked whether the two assertions share one
    declared property. THE ANSWER IS TWO, because they are two facts about two hops with two trust
    mechanisms that vary independently: CLIENT_TRUST_BOUNDARY is about a hop that STRIPS a header,
    so trust rests on the stripping; BFF_TRUST_BOUNDARY is about our own frontend FORWARDING an
    address it AUTHENTICATES with a shared secret, so trust rests on the secret - which works with
    or without a stripping hop, and that is F-033's whole point.
    THE TWO DEPLOYMENTS THAT BREAK THE COLLAPSE, NEITHER HYPOTHETICAL AFTER ADR-0014 AND ADR-0030:
    an API at its own origin with Vercel proxying browser traffic is `direct` for the header and
    BFF-fronted for the secret - and it is the deployment where THE SECRET IS THE ONLY SOURCE OF A
    RATE-LIMIT PRINCIPAL, so gating on `proxy` asserts nothing exactly where it matters most. And
    an API behind a CDN serving redirects with no web app is `proxy` with no BFF, where gating on
    `proxy` refuses boot until the operator INVENTS A SECRET NOTHING READS - teaching `set the
    variable to silence the error`, which is the fixture alternative Juano rejected, reached by a
    longer road.
    So BFF_TRUST_BOUNDARY = bff | direct, THE SAME SHAPE AS ITS SIBLING DELIBERATELY. Juano's `one
    reader learns one rule` is served by the SHAPE being shared rather than by one variable standing
    for two things - which is the substitution NODE_ENV was already making.
    THE UNCONDITIONAL-INVALID-VALUE RULE CARRIES OVER, CONSIDERED RATHER THAN COPIED: `direct` is
    the permissive branch and what unset means, so a typo must not reach it silently. It named the
    one honest difference - a mis-set boundary here has a second signal, bff_proxy_auth_mismatch_total
    - and kept the refusal anyway, because a counter nobody watches yet is not a substitute for one.
    AND IT PRICED THIS AS A WORSE TRADE THAN F-380's, IN ITS OWN WORDS: what F-380 gave up catching
    was an absent limit; this gives up catching A PRODUCT OUTAGE - forget both variables in a real
    BFF deployment and every browser request falls through to one product-wide address, 3 signups
    an hour and 10 sign-ins per 5 minutes for everyone, which is the F-031 outage by configuration.
    Both cells of rate-limit.md's two-assertion table were wrong - its own and the one F-380 left
    stale - and both are rebuilt. The stub typechecks under the repo's pinned TypeScript, verified
    on a scratchpad copy.

