    Invalidate the context when the transaction ends. Add a mutable settled flag to
    ActiveTenantContext, set it in a finally around the databaseTransaction call, and have
    activeContext() - and therefore tenantDb(), currentTenantId() and the nesting branch - throw when
    it is set. Do not rely on the handle itself: fn holds db directly, so the check must live on the
    path everything else uses, and the nesting branch at :126 is the one that currently degrades
    silently rather than loudly.
