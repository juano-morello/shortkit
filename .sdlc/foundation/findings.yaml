    result exactly: 1 failed / 88 passed of 89, the single failure being the F-273 body guard,
    and nothing else in the repository catching it. exception-filter.ts restored and confirmed
    byte-identical, sha256 76f97edbb343abc7 before and after, git diff empty. Suite green at
    89/89, typecheck and lint exit 0.
    LIMITATION, RECORDED RATHER THAN BURIED: the array-message shape is Nest's ValidationPipe
    shape and NO route in apps/api/src produces it today. If a reviewer restricts the guard to
    live paths, the log half collapses into F-244 and only the body half stands alone. Flagged
    by the test architect itself as blocking-if-disputed.
