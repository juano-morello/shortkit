    serialises through res.json, AMENDED 2026-08-05 by sdlc-test-architect and VERIFIED by the
    orchestrator against installed zod 4.4.3: the reviewer's __proto__ clause is UNREACHABLE through
    real zod - z.record over a body containing __proto__, constructor and toString emits issues for
    constructor and toString and NONE for __proto__, and z.object({'__proto__': z.string()}) parses
    {"__proto__": 3} as a success. Asserting it needs a hand-rolled issue array, which tests the
    author's idea of zod rather than zod. constructor and toString are the tested surface; __proto__ is
    defensive-with-no-test, and a null-prototype or drained-Map accumulator makes it correct by
    construction anyway. A RAW MAP IS NOT AN OPTION - verified that it fails validationDetailsContract
    AND that JSON.stringify turns it into {"fieldErrors":{}}, an empty object with no exception and no
    signal, on the validation path all fourteen consuming TASKs use. sdlc-reviewer wrote "a Map DRAINED
    at the end" and was precise; sdlc-security-auditor's SEC-3 wrote "or a Map" without the drain, and
    that phrasing is the one that ships an empty body. Paired with F-087 (the same defect in the approved
    design stub) and F-088 (no direct test). Fixing only this one leaves the stub to restore it.
  owner_slot: sdlc-implementer-backend
  ruling: >-
