# Recorded as a block because the three interact: F-154's ruling unblocks F-156's positive
# control, and F-157's ruling is what lets TASK-004 state a ceiling instead of overclaiming.
#
# F-153 RULED: widen TASK-002's paths to [".github/**", "apps/api/scripts/**", "docs/**"].
#   TASK-002 is genuinely the right owner of all three orphaned items - it wires
#   check-policies into CI, it is the reader migrations.md misleads, and it builds the weekly
#   audit job known-advisories.md serves. Applied to the card; its warning block rewritten
#   from "do not widen your own paths" to a record of why the paths are what they are.
#
# F-154 RULED: DROP API_BASE_URL from the checked list; AC-113 amended on TASK-004's card.
#   API_BASE_URL is not confidential - public Fly hostname, cleartext in .env.example,
#   discoverable from any redirect. Checking it buys no confidentiality and costs the guard's
#   credibility. BFF_PROXY_SECRET has no legitimate public counterpart and does not share the
#   problem. Sent to the in-flight implementer mid-work, because it removes the contradiction
#   between F-156's positive control and F-154 that I had told it not to resolve.
#
# F-157 RULED: the render-time control lands in TASK-012 with an ADR-0014 amendment.
#   experimental_taintUniqueValue on BFF_PROXY_SECRET and the sk_at cookie at their single read
#   sites, throwing at render time on any route type. TASK-004 owns the CEILING STATEMENT only.
#   Written onto TASK-012's card in full, not left as a ledger line.

