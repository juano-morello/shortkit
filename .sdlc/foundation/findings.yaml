- id: F-292
  phase: implement
  task: TASK-008
  source: sdlc-reviewer
  round: 1
  severity: major
  kind: behavior
  file: apps/web/src/lib/api/client.ts
  line: 182
  summary: >-
    A caller-initiated abort is classified as a transport failure and raised as NetworkError.
  failure_scenario: >-
    signal?: AbortSignal is in the frozen ApiRequest, so cancellation is an anticipated path.
    On abort fetch rejects with AbortError, the catch-all swallows the distinction, and the
    caller gets NetworkError. A search or filter screen that aborts the in-flight request on
    each keystroke renders a network-failure state for a cancellation IT INITIATED, and any
    retry wrapper keyed on NetworkError re-issues a request the caller deliberately cancelled.
    The original is preserved on .cause, so a caller who knows to look CAN discriminate - which
    is exactly the "distinguishable without inspecting internals" property AC-15 exists to
    establish for the other three cases.
  required_change: >-
    An aborted request is distinguishable from a transport failure without unwrapping cause.
    web-api-client.md step 6 is silent on abort, so this needs a contract line as well as code
    - decided once here rather than by thirteen consumer TASKs.
  owner_slot: sdlc-implementer-frontend
  status: fixed
  resolved_by: "sdlc-implementer-frontend"
  resolved_round: 1
  resolution: >-
    CLOSED. RequestAbortedError extends Error, NOT NetworkError, per the contract's new step 7. The discriminator is req.signal?.aborted in both catch blocks and NOT cause.name, because abort(reason) makes fetch reject with the caller's own value. Proved by mutation: flipping both discriminators to req.signal !== undefined fails exactly the falsifier test and nothing else, then restored byte-identically.
