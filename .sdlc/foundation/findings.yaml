# Wave-1 red tests, STORY-002 (TASK-002, TASK-004). Raised by sdlc-test-architect while
# establishing that AC-5 and AC-7 are not testable in-process. Both are ACs that do not exist:
# a real obligation is written in a TASK file with no acceptance criterion to carry it, so an
# auditor verifying the STORY verbatim signs off the defect. Same shape as F-050, which Juano
# resolved by minting AC-112.

- id: F-078
  phase: test
  task: TASK-004
  source: sdlc-test-architect
  round: 0
  severity: major
  kind: scope
  file: .sdlc/foundation/stories/STORY-002.md
  line: 18
  summary: >-
    TASK-004 must register BFF_PROXY_SECRET and API_BASE_URL as server-only variables and is
    forbidden from giving either the NEXT_PUBLIC_ prefix, but no AC in STORY-002 mentions
    environment variables at all. Shipping the proxy secret into the client bundle passes AC-7
    and every other check in the STORY.
  failure_scenario: >-
    ORCHESTRATOR VERIFIED both halves. TASK-004's Produces block, amended in Design round 5,
    states "Neither may carry the NEXT_PUBLIC_ prefix - that prefix inlines a value into the
    client bundle, which would publish the secret", and design/contracts/web-api-client.md:140
    calls BFF_PROXY_SECRET "a required, server-only environment variable on Vercel". STORY-002
    contains ZERO occurrences of env, NEXT_PUBLIC or secret across all three of its ACs; AC-7
    asks only for 200 and HTML. So the one thing that would leak the shared secret to every
    browser is invisible to the acceptance criteria, and sdlc-product-auditor verifies ACs
    verbatim. The secret is what the API's constant-time match trusts before honouring a
    forwarded client IP, so publishing it collapses all four IP-keyed rate-limit buckets.
  required_change: >-
    Mint an AC on STORY-002 requiring that no server-only variable appears in the built client
    bundle - checkable as a build-output assertion that the value of BFF_PROXY_SECRET is absent
    from .next/static/**, which belongs in CI rather than in vitest. Alternatively an explicit
    sdlc-product-auditor instruction, but an AC is what F-050 established as the mechanism that
    actually holds.
  owner_slot: null
  status: fixed
  resolved_by: juano
  ruling: >-
    RULED 2026-08-05. AC-113 MINTED on STORY-002, per the F-050 precedent Juano set when he
    minted AC-112 for this exact shape: an obligation with no acceptance criterion is one
    sdlc-product-auditor never checks, because it verifies ACs verbatim. AC-113 requires that
    the values of BFF_PROXY_SECRET and API_BASE_URL be absent from the built client bundle
    under .next/static/**, failing CI if either appears. The auditor-instruction alternative
    was offered and declined - an obligation living outside a TASK or AC file is the failure
    F-064 named three times over. Ids appended, nothing renumbered; STORY-002 goes 3 ACs -> 5.
    TASK-004 acceptance is now [AC-7, AC-113].

