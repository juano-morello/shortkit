  summary: >-
    F-302's SIBLING IS STILL GREEN AND IT IS THE WORSE HALF. The round-2 fix catches
    `USING (true) WITH CHECK (true)`. Tighten the WITH CHECK to the correct predicate - ONE TOKEN
    from tenantScopedPolicies() - and the unqualified write is refused with 42501, which
