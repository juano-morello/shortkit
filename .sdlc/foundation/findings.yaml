  file: apps/api/src/tenancy/tenant-context.ts
  line: 154
  summary: >-
    The TenantDb handle and the AsyncLocalStorage store outlive the transaction, so a detached
    continuation can issue queries on a connection already returned to the pool - potentially inside
    another tenant's open transaction.
  failure_scenario: >-
    ORCHESTRATOR VERIFIED THE CODE SHAPE: tenantStorage.run(...) at :154 is bound INSIDE the
    databaseTransaction callback opened at :144, so Node's ALS keeps that store visible to every
    continuation descended from inside the callback, including ones resolving after run() returns.
    drizzle's node-postgres session commits and then releases the client in its finally, and pg's
    PoolClient.query is not disabled by release. So a fire-and-forget inside fn - void this.warmCache(),
    or any unawaited promise chain, which is the ordinary way this bug gets written - runs after COMMIT,
    calls tenantDb(), gets the stale handle, and queues a query onto a physical connection another
    request has since checked out. That query then executes inside a DIFFERENT TENANT'S open
    transaction: it reads under that tenant's app.tenant_id, and any write it makes commits or rolls
    back with that tenant's transaction. The same stale store makes a nested withTenantTransaction take
    the reuse branch at :126, running fn against a released handle with no BEGIN and no set_config at
    all. Nothing reaches this today because no route touches the database, but this file is where the
    guard belongs and every consuming TASK inherits its absence.
