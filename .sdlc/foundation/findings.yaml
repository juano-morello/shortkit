- id: F-320
  phase: design
  task: TASK-059
  source: sdlc-security-auditor
  round: 1
  severity: major
  kind: security
  file: .sdlc/foundation/design/adr-0030-no-deploy-target.md
  line: 1
  summary: >-
    DELETING FLY ORPHANS THE CLIENT-IP TRUST MODEL, and ADR-0030's precondition list does not
    mention it. `resolveRateLimitPrincipal`'s "otherwise return Fly-Client-IP" and
    click-events.md:51's unspoofable premise are what discharge F-009 for `ip_hash` and for every
    IP-keyed rate-limit bucket. Remove the platform that made the header trustworthy and the
    premise is gone while the code and the contract still assert it.
  failure_scenario: >-
    A trusted-header model is only ever as good as the proxy that strips it. With no deploy
    target, nothing strips Fly-Client-IP, so whatever eventually fronts this must either
    reproduce that property or the design has to change - and today no artifact says so. The
    routing list also omits `design/stubs/**`, WHICH IS WHAT IMPLEMENTERS COMPILE AGAINST.
  required_change: >-
    ADR-0030's preconditions for choosing a deploy target gain the client-IP trust property
    explicitly, and its routing list names design/stubs/**. Whether the rate-limit design itself
    must change is not the architect's call alone.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: "sdlc-architect under Juano's ruling"
  resolved_round: 1
  resolution: >-
    RULED BY JUANO 2026-08-11 and implemented in design: ADR-0040 plus a new contract, design/contracts/trusted-client-address.md, consumed by TASK-009, TASK-033, TASK-034 and TASK-051. A deployment DECLARES TRUSTED_CLIENT_IP_HEADER, the API asserts at boot in production that a declaration exists, reads that header and no other, and where no address is established the result is NO PRINCIPAL. Worded against the PROPERTY rather than the header name.
    THE ONE-COPY RULE APPLIED HARD: the rule wanted nine homes and has ONE. The contract holds the declaration format, the four read rules, the three exact boot-assertion error strings, the counter policy and what null means per bucket; rate-limit.md keeps only the BFF branch, click-events.md keeps only `never honour X-Shortkit-Client-IP`, and ADR-0010, ADR-0012, ADR-0014, web-api-client.md and ADR-0030 each got one corrected sentence and a pointer.
    IT ALSO FOUND THREE SURFACES BEYOND MY LIST, having been told to verify rather than trust it - most importantly the click-event.types.ts stub, which carried TRUSTED_PROXY_HOPS, the rightmost-XFF fallback and `prefer Fly-Client-IP`: the same defect in the artifact an implementer compiles against, and a kept stub under ADR-0039.
    THE STRONGEST REJECTED ALTERNATIVE IS WORTH KEEPING: falling back to req.socket.remoteAddress is GENUINELY THE CORRECT VALUE in the compose stack, and it lost because behind a proxy it silently becomes the collapsed-bucket outage - converting a DETECTABLE no-principal state into an UNDETECTABLE wrong-principal one.
    ONE JUDGEMENT IS ESCALATED RATHER THAN SETTLED - see the null-bucket question put to Juano.
  orchestrator_note: >-
    ESCALATES TO JUANO. ADR-0030 is ACCEPTED as of today's ruling, and phases/design.md says a
    finding against an approved artifact is never fixed by the architect. It is also NOT a
    blocker for TASK-059's dispatch: every consumer of the client-IP model - rate limiting, click
    events - left with EPIC-002..006, so nothing reachable depends on it today. The decision is
    whether the precondition is recorded now or when a deploy target is chosen.

