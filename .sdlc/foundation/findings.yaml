- id: F-227
  phase: test
  task: TASK-009
  source: sdlc-implementer-backend
  round: 1
  severity: major
  kind: design
  file: .sdlc/foundation/design/adr-0013-better-auth-in-nestjs.md
  line: 1
  summary: >-
    The JWT better-auth 1.6.26 issues carries no `jti`, and ADR-0013's revocation mechanism keys on
    exactly that claim - so TASK-011's revocation check would silently no-op.
  failure_scenario: >-
    Found by probe against the pinned release using ADR-0013's own jwt config, which produced claims
    aud, email, ev, exp, iat, iss, sub, tid - no jti. Source located at
    better-auth/dist/plugins/jwt/sign.mjs:49: `if (payload.jti) jwt.setJti(payload.jti)`, so the claim
    is set only when definePayload returns one, and ADR-0013's config does not. The consequence is the
    dangerous kind rather than the loud kind: ADR-0013 revokes by writing `revoked:jti:<jti>`, so with
    no jti to key on, a logout would appear to succeed while the prior credential kept working until
    natural expiry. AC-21 asserts exactly that a prior credential is rejected after logout, so this is
    a live AC at risk and not a distant one. The same probe found a second, harmless drift: sign.mjs
    lines 53-61 overwrite definePayload's `sub` with getSubject() ?? session.user.id, so ADR-0013's
    `sub: user.id` line is inert - same value, no effect.
  required_change: >-
    ADR-0013's mount config must return a jti from definePayload, or the revocation mechanism must key
    on something the release actually issues. This is design rather than implementation - TASK-009
    writes the mount but the revocation contract is ADR-0013's, and TASK-011 consumes it. Settle it
    before TASK-009 implements, because the mount is where the claim would be added.
  owner_slot: sdlc-architect
  ruling: >-
    RULED by Juano 2026-08-06 - definePayload returns a jti. FIXED by sdlc-architect, which then made
    a call the ruling left open AND FLAGGED THAT IT HAD, which is the behaviour worth recording. A
    per-token random satisfies the ruling as worded and would leave revocation just as broken, because
    sign-out holds no token (sign-out.mjs:20-22) - so it chose jti: session.id, which is what makes
    revocation reachable at all, and recorded the RFC 7519 4.1.7 cost of a non-unique jti. It also
    removed ADR-0013's inert 'sub: user.id' line, which sign.mjs:53-61 overwrites, so it no longer
    reads as load-bearing while doing nothing. Revocation, the claim table, auth-tokens.md and the
    auth-claims stub all moved together. RESIDUAL SPLIT OUT AS F-231: the fix rests on session ids not
    rotating across an updateAge refresh, which the architect traced only in the delete paths and said
    plainly it had not proven.
  status: fixed
  resolved_by: sdlc-architect
  resolved_round: 1

- id: F-228
  phase: test
