- id: F-004
  phase: design
  source: sdlc-security-auditor
  round: 1
  severity: major
  kind: design
  file: design/adr-0013-better-auth-in-nestjs.md
  line: 39
  summary: Mounting Better Auth ahead of Nest leaves the unauthenticated credential surface with no rate limit and no body size cap.
  failure_scenario: Unlimited credential stuffing and signup; Resend's 100/day cap exhausted in seconds so every legitimate signup and invitation silently fails; a multi-gigabyte body read into memory on the machine that must never return 5xx.
