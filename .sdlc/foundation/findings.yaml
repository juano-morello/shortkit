  source: sdlc-implementer-backend
  round: 1
  severity: major
  kind: security
  file: docker-compose.test.yml
  line: 111
  summary: >-
    ALTER DEFAULT PRIVILEGES grants shortkit_app full DML on every table the migrator creates - so the
