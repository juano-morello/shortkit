# Roadmap item 1, opened 2026-08-12 after `foundation` closed and its retro residue was
# repaired. The roadmap words it: "An agency operator signs up, structures the agency into
# client workspaces, and invites a teammate scoped to specific workspaces."
#
# TRACK IS FORCED, NOT CHOSEN. config.yaml's force_full_paths covers apps/api/src/auth/**,
# apps/api/src/invitations/tokens/**, packages/contracts/src/auth/**, apps/api/drizzle/** and
# apps/api/src/tenancy/**. Any honest reading of item 1 touches at least three of those, so
# `full` is stated at the gate rather than offered as an option.
#
# SCOPE CUT AT THE REFINE GATE, not before it. Juano ruled 2026-08-12 to start from the whole
# of item 1 and let the one-shippable-increment check do the work, because `foundation` was
# re-scoped mid-flight after a pre-decided scope proved too big. The cut: THIS IS ITEM 1a -
# signup, session and workspaces. Invitations, capability tokens and mail are item 1b and keep
# the four carried obligations that belong to them.

gates:
  refine: { status: approved, approved_at: 2026-08-12, note: "Track full, FORCED by force_full_paths, stated rather than offered. Shippability check passes: built alone and stopped, an operator signs up and structures their agency, which is roadmap item 1s own first clause. Interview stopped at ~95% confidence after five questions; rollout, blast radius and data sensitivity were skipped because ADR-0030 and ADR-0028 already answer them. No blocking open questions." }
