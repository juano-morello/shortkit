  severity: minor
  kind: design
  file: .sdlc/identity-membership/design/adr-0053-revocation-store-is-process-local.md
  line: 161
  summary: >-
    REVOCATION EVICTION IS ATTACKER-INFLUENCED AND ITS STATED REASONING IS BACKWARDS. Insertion-
    order eviction drops the most recently RE-revoked session first.
  failure_scenario: >-
    (a) "Above 10,000 live entries the oldest is dropped" reads as a load condition, but every
    session deletion writes an entry and sign-in/sign-out is an attacker-reachable path: an
    attacker holding a stolen token whose session was just revoked can drive 10,000 deletions
    inside the 300-second window and have it honoured again. TASK-004's IP-keyed limiter is what
    makes that expensive, which is why it is minor - but the cost is set by a limiter in ANOTHER
    CARD and the ADR should say so. (b) "The oldest is closest to expiry" is FALSE for a re-revoked
    session: Map.set on an existing key keeps the original position, and invariant 4 makes revoke
    idempotent with a refreshed TTL, so the newest expiry sits at the oldest position.
  required_change: >-
    Name the attacker-reachable write path and its coupling to TASK-004's limiter. Require `delete`
    before `set` in revoke so insertion order tracks current expiry, and assert a re-revoked entry
    is not evicted first.
  owner_slot: sdlc-architect
  status: routed
  resolved_by: null
  resolved_round: null

