- id: F-003
  phase: design
  wave: 1
  task: TASK-002
  source: sdlc-reviewer
  round: 1
  severity: blocker
  kind: behavior
  file: .sdlc/identity-membership/design/adr-0045-token-mint-membership-lookup.md
  line: 74
  summary: >-
    ON ANY POOLED CONNECTION THAT HAS ALREADY SERVED A TENANT TRANSACTION, THE MINT-TIME READ
    RAISES 22P02 INSTEAD OF RETURNING A ROW. After a transaction-local set_config, the
    app.tenant_id GUC reverts to the EMPTY STRING, not NULL, so tenantScopedPolicies'
    `current_setting('app.tenant_id', true)::uuid` is still ORed into the SELECT and `''::uuid`
    raises. The ADR's premise - "with the flag unset current_setting returns NULL" - holds only
    on a backend where the placeholder has NEVER been created.
  failure_scenario: >-
    REPRODUCED THROUGH THE REAL pg.Pool with client.ts's own settings against a scratch database
    carrying the ADR's policy verbatim: mint #1 on a cold pool returned the tenant id, one
    ordinary tenant transaction ran, and mints #2 and #3 both failed
    `22P02 invalid input syntax for type uuid: ""`. Confirmed at statement level in psql:
    after a committed set_config, `current_setting('app.tenant_id', true)` is `''` and not NULL.
    Not avoidable by narrowing the statement - the bare select, the UNIQUE-index form, the
    no-membership path and a structurally identical EMPTY table all raise, because the
    isolation policy's cast is evaluated whatever the membership arm returns.
    Production consequence: definePayload cannot mint `tid`. The first mint after process start
    succeeds; every mint borrowing a connection that has served one authenticated request fails.
    At POOL_MAX 10 that is every connection within seconds of taking traffic - sign-in and token
    refresh break for all users. The thrown value is a pg.DatabaseError, NOT
    NoTenantMembershipError, so tenantIdForUser's declared contract is violated and the mint
    path has no branch for it.
  required_change: >-
    A tenant-scoped table's isolation predicate must RETURN ZERO ROWS, not raise, when
    app.tenant_id holds the empty string - the state of every pooled backend that has served one
    tenant transaction. On a pooled connection the NULL case is the exceptional one. The
    reviewer verified the property is reachable: with the predicate made empty-string tolerant
    the same warm-connection lookup returns 0 rows. WHICH PREDICATE CARRIES IT IS THE
    ARCHITECT'S CALL - see F-005, which is the same defect on shipped code.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: "ADR-0049: the empty-string tolerance goes in tenantScopedPolicies() (the template), not in the new policy. Reproduced independently at statement level and repaired with nullif(current_setting(...), ''); verified warm out-of-context read returns 0 rows and warm mint returns the tenant id. rls-policy-template.md amended."
  resolved_round: 1

- id: F-004
  phase: design
  wave: 1
  task: TASK-002
