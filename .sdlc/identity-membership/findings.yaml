- id: F-009
  phase: design
  wave: 1
  task: TASK-002
  source: sdlc-architect
  round: 1
  severity: major
  kind: test-coverage
  file: apps/api/test/isolation/controls.ts
  line: 131
  summary: >-
    THE ISOLATION HARNESS HAND-WRITES THE PRODUCTION PREDICATE UNDER A COMMENT CLAIMING IT COMES
    FROM THE PRODUCTION CONSTANT. controls.ts:131 declares its own
    `current_setting('app.tenant_id', true)::uuid` and the docblock on the very next line reads
    "The same shape every tenant-scoped table has, from the same production constant." IT IS NOT
    IMPORTED FROM ANYWHERE.
  failure_scenario: >-
    ADR-0049 changes the production predicate to wrap every flag cast in `nullif(<flag>, '')`.
    The harness's copy does not change with it, so THE SUITE GOES ON PROVING ISOLATION AGAINST
    THE OLD, DEFECTIVE PREDICATE while production runs the new one - and it goes green, because
    the old predicate isolates correctly on a cold connection, which is the only state the
    fixture creates. The harness that exists to catch this class would be measuring a shape the
    product no longer has.
    F-288's CLASS, FOUND AND NOT FIXED: a normative-looking artifact carrying a rule the source
    of truth has replaced, with a comment asserting a provenance it does not have. Verified by
    reading controls.ts:131-132 directly.
  required_change: >-
    Either import the predicate from the production constant so the claim becomes true, or
    correct the comment to say it is a hand-written copy and add a check that the two agree.
    The architect named it and did not fix it; controls.ts is not in TASK-002's paths - see
    F-010.
  owner_slot: sdlc-implementer-backend
  status: open
  resolved_by: null
  resolved_round: null

