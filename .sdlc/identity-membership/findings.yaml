# F-020..F-027 from the design-mode security audit, round 2 of 2 (full-track cap).
# Full detail, attacker paths and executed statements: audits/design-sdlc-security-auditor-r1.md

- id: F-020
  phase: design
  wave: 1
  task: TASK-003
  source: sdlc-security-auditor
  round: 2
  severity: blocker
  kind: security
  file: .sdlc/identity-membership/design/adr-0043-better-auth-schema-is-hand-written-and-pinned.md
  line: 1
  summary: >-
    BETTER_AUTH_SECRET IS BOUND NOWHERE, AND 1.6.26 FALLS BACK TO A PUBLISHED CONSTANT WITHOUT
    THROWING OUTSIDE PRODUCTION. Seven ADRs, three contracts and seventeen TASK cards mention
    the variable descriptively and nothing binds it.
  failure_scenario: >-
    EXECUTED BY THE AUDITOR, then verified independently by me at
    node_modules/.pnpm/better-auth@1.6.26/.../dist/context/create-context.mjs:38-45.
    validateSecret returns immediately under isTest() and throws on the default ONLY under
    isProduction, so the two environments that actually exist are the two it does not cover.
    With NODE_ENV=development and the variable unset the secret in use is the shipped constant
    `better-auth-secret-12345678901234567890` and nothing throws.
    That constant is the symmetric key for jwks.privateKey, so ONE `jwks` ROW PLUS A VALUE
    EVERYONE ALREADY HAS IS THE JWT SIGNING KEY, and every control this initiative builds hangs
    off a forgeable `tid`.
    MITIGATION, MEASURED: Dockerfile:83 sets NODE_ENV=production unconditionally (GC-B), so the
    compose stack WOULD refuse to boot. The live exposure is local `pnpm dev`.
    AND THE SHAPE IS GC-B's OWN HAZARD ARRIVING FROM INSIDE A DEPENDENCY - a behavioural choice
    keyed on NODE_ENV, in a library, where the rule this project wrote for itself cannot reach.
  required_change: >-
    A declared binding for BETTER_AUTH_SECRET with a boot assertion that does not depend on
    NODE_ENV, per GC-B's pattern. The alternative of passing `secret` in the config still needs
    a source for the value.
  owner_slot: sdlc-architect
  status: open
  resolved_by: null
  resolved_round: null

