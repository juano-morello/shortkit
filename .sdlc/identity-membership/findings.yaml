  summary: >-
    NEITHER INTEGRATION CONTROL THE ADR SPECIFIES CAN OBSERVE F-003, because both are written
    without reference to connection state and both pass on a cold pool.
  failure_scenario: >-
    The ADR specifies "with the flag set to user A the table shows A's row and not B's; with no
    flag set it shows zero rows". Both are TRUE on a backend that has never run set_config for
    app.tenant_id and both are FALSE on one that has - the second raises rather than returning
    zero. A fixture seeding through the migrator DSN, which is what test/support/rls-fixture.ts
    does via querySql(migrationDsn()), LEAVES THE APPLICATION POOL COLD, so both controls go
    green over the blocker.
  required_change: >-
    At least one control issues the mint-time read on a pooled connection that has ALREADY
    committed a withTenantTransaction in the same process and pool, and asserts the row comes
    back. The zero-rows assertion moves into that same state, since that is the state in which
    it is currently untrue.
  owner_slot: sdlc-architect
  status: open
  resolved_by: null
  resolved_round: null

- id: F-005
  phase: design
  wave: 1
  task: TASK-002
  source: sdlc-reviewer
  round: 1
  severity: major
  kind: behavior
  file: apps/api/src/db/rls.ts
  line: 70
  summary: >-
    THE SAME 22P02 FAILURE REPRODUCES ON THE SHIPPED REDIRECT-READ ESCAPE, so this is a property
    of tenantScopedPolicies()'s predicate - MERGED CODE - and ADR-0045 is the first caller to
    reach it rather than its cause.
  failure_scenario: >-
    Built `links` with tenantScopedPolicies('links') plus redirectReadPolicy('links') verbatim.
    On a cold backend the redirect read returned its row; after one ordinary tenant transaction
    on the same session the identical read raised `invalid input syntax for type uuid: ""`.
    EVERY PUBLIC REDIRECT SERVED ON A CONNECTION THAT HAD PREVIOUSLY SERVED AN AUTHENTICATED
    REQUEST WOULD FAIL - and the redirect path is the one thing in this product that must never
    return 5xx to a visitor.
    Nothing reaches it today: `links` and `domains` do not exist (TASK-024, TASK-028) and
    withRedirectRead is TASK-029's, all deferred. It is latent, not live. IT MATTERS NOW BECAUSE
    IT DECIDES WHERE F-003's FIX BELONGS - repairing only the new policy leaves this one armed,
    and by the same argument the privileged eraser (TASK-054) too.
    THIS IS F-236's CLASS A THIRD TIME: a policy verified against the policy set and never
    against a statement issued under it, with connection state as the variable nobody varied.
  required_change: >-
    Whatever makes the mint-time lookup fail closed rather than raise must hold for EVERY escape
    reading a table that carries tenantScopedPolicies() without setting app.tenant_id.
    TASK-002's paths now reach rls.ts, so the repair is in scope for this wave.
  owner_slot: sdlc-architect
  status: open
  resolved_by: null
  resolved_round: null

