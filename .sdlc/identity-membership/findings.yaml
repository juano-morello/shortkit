- id: F-187
  phase: design
  wave: 2
  task: TASK-003
  source: sdlc-security-auditor
  round: 3
  severity: major
  kind: design
  file: .sdlc/identity-membership/design/stubs/apps/api/src/auth/boot-assertions.ts
  line: 84
  summary: >-
    betterAuthUrl ACCEPTS http:// FOR ANY HOST, so the binding that exists to stop a non-Secure
    session cookie permits one - and the compose default teaches the scheme that produces it.
  failure_scenario: >-
    EXECUTED: BETTER_AUTH_URL=http://api.example.com yields better-auth.session_token with
    secure: false and no __Secure- prefix - IDENTICAL TO THE ROUND-1 FINDING THIS ADR WAS WRITTEN
    TO CLOSE - while https:// yields the prefixed secure cookie. EVERY ASSERTION PASSES IN BOTH
    CASES, because a value is set. useSecureCookies is derived from this one string, so nothing
    else can catch it. The compose default http://localhost:3001 is right for the local stack and
    is also what teaches the value's shape: an operator who copies it to a real host keeps the
    scheme, and the session credential travels in the clear with the boot assertion green, the
    unit test green and the compose job green.
  required_change: >-
    One rule, in the accessor and the assertion: `http:` only for a loopback host - localhost, a
    127.0.0.0/8 address, or [::1] - and `https:` for any host. Reads no NODE_ENV, so GC-B holds;
    leaves the compose default and every local flow unchanged; turns http://api.example.com into
    a boot refusal naming the rule.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: sdlc-architect
  resolved_round: 3
  ruling: >-
    CLOSED IN ROUND 3 AND VERIFIED BY RE-EXECUTION. `http:` is permitted only for localhost,
    127.0.0.0/8 or [::1]; https: for any host; no NODE_ENV read, so GC-B holds. Two residuals
    volunteered rather than discovered: it is a string test and not a resolution test, and it
    refuses a TLS-terminating proxy's internal address. THE AUDITOR RULED THAT SECOND RESIDUAL
    ACCEPTABLE RATHER THAN A TRAP - that topology must use the public https: origin anyway for
    iss, aud and the cookie flag, so the rule refuses a value that was already wrong, and the
    refusal message naming the public origin is what stops an operator reaching for
    useSecureCookies: false.

- id: F-188
  phase: design
  wave: 2
  task: TASK-003
  source: sdlc-security-auditor
  round: 3
  severity: major
  kind: design
  file: .sdlc/identity-membership/design/adr-0061-signup-is-an-enumeration-oracle.md
  line: 44
  summary: >-
    autoSignIn: false CLOSES THE STATUS-CODE ORACLE AND LEAVES A RESPONSE-SHAPE ONE, so the
    decision Juano took on 2026-08-15 delivers less than it claims.
  failure_scenario: >-
    EXECUTED. A duplicate address now answers 200 rather than 422 - that half works. But the two
    200s are not the same shape: an existing address returns user keys including `image`, a fresh
    one returns the same set WITHOUT it. THE `image` KEY IS PRESENT IF AND ONLY IF THE ADDRESS
    EXISTS, deterministically, every request, no timing analysis. An attacker walks an address
    list and reads one JSON key. The disclosure is existence only - `name` is the attacker's own
    value and `id` is fresh, both checked - WHICH IS THE SAME DISCLOSURE THE 422 MADE AND THE ONE
    ADR-0061 SAYS IS CLOSED. Adapter-independent: one branch serialises a row read back from the
    store, the other serialises the object it just built, and user.image is nullable in migration
    0001 so a stored row always has the key.
    THE RESIDUE HALF OF THE RULING IS VERIFIED REAL - no Set-Cookie, session=0 - so the ruling
    stands on that alone.
  required_change: >-
    Do NOT reopen the ruling. Correct ADR-0061's claim to what it actually buys - the status
    code, not the oracle - and either close the shape gap or accept it explicitly in the same
    sentence. The deciding test belongs in the integration tier against the real adapter:
    signup-creates-tenant.int-spec.ts asserts a duplicate-address and a fresh-address response
    are BYTE-IDENTICAL after normalising id, createdAt and updatedAt.
  owner_slot: sdlc-architect
  status: wont-fix
  resolved_by: sdlc-security-auditor
  resolved_round: 4
  ruling: >-
    WITHDRAWN BY ITS AUTHOR AFTER MEASUREMENT DISPROVED IT, 2026-08-16. The architect refused to
    absorb it and said why: the divergence was measured on better-auth's IN-MEMORY adapter, while
    the stated reason for adapter-independence - user.image is a nullable column, so a stored row
    always carries the key - implies the opposite under the real adapter. Rather than claim
    either, it wrote the question undetermined and pre-committed both outcomes to a byte-identity
    test.
    MEASURED AGAINST THE REAL drizzleAdapter over a pool authenticating as shortkit_auth, on a
    scratch database with both migrations applied and the role's grants verified first: THE TWO
    RESPONSES CONVERGE. Identical key sets including `image`; the duplicate carries a FRESH id
    and createdAt rather than the existing account's; token: null in both; no row created; the
    only differing field is `email`, the attacker's own input. Timing 45.0 ms against 46.3 ms
    median of 12 over loopback, pointing the wrong way for an attacker.
    NO ENUMERATION ORACLE EXISTS IN THIS DESIGN. `wont-fix` is the closest terminal status the
    ledger has and it is the wrong word - THERE IS NO STATUS FOR `DISPROVED`, which is a gap
    worth the retro: a finding that was measured false reads here as one that was real and
    declined.

