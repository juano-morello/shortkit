    silent; the fix moved the build onto a second instance of it carrying no assertion.
  required_change: >-
    Minimum: name the @swc/core coupling in tsup.config.ts so a dependency cleanup cannot silently
    remove it. Better: a TASK-002 CI step that runs the built artifact to a successful listen, so
    a bundle Nest cannot boot fails the pipeline rather than the deploy.
