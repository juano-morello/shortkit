    rateLimit.enabled unit test. So the ADR is the only place the obligation exists and it
    points at a TASK that cannot discharge it. The parsed-body assertion is the acceptance
    signal for TASK-009's own mount, so if it silently migrates to TASK-058 the mount ships one
    wave unverified - which is the actual cost, not the file placement.
  required_change: >-
    Two candidate resolutions, and the choice has a wave-ordering consequence rather than being
    mechanical. (a) Add apps/api/test/auth/** to TASK-009's paths and keep the test with the
    mount it verifies, which means TASK-009 and TASK-058 share that directory as they already
    share auth.config.ts. (b) Move the test to TASK-058 and accept that TASK-009's mount ships
    one wave without its acceptance signal. The architect declined to choose, correctly - this
    is an ownership call, and reassigning it silently would hide the one-wave gap.
  owner_slot: null
  status: escalated
  escalated_to: juano
  resolved_by: null
  resolved_round: null

