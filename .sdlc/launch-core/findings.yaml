- id: F-008
  phase: design
  source: sdlc-security-auditor
  round: 1
  severity: major
  kind: design
  file: design/contracts/web-api-client.md
  line: 75
  summary: The BFF proxy interpolates an unvalidated catch-all path into the upstream URL and never asserts the resolved origin.
  failure_scenario: A path beginning // resolves protocol-relative to an attacker host and the proxy attaches Authorization Bearer to it — a live tenant credential delivered to an attacker-chosen origin by a same-origin request the victim's browser makes. Traversal also escapes the /api prefix.
  required_change: Make URL construction normative and safe — reject empty, dot, dot-dot and separator-bearing segments after decoding; assert resolved.origin equals API_BASE_URL's origin; pass redirect manual; add an invariant that Authorization never leaves that origin.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: sdlc-architect
  resolved_round: 1

- id: F-009
  phase: design
  source: sdlc-security-auditor
  round: 1
  severity: major
  kind: design
  file: design/contracts/click-events.md
  line: 41
  summary: ip_hash is derived from the leftmost X-Forwarded-For entry, which is fully attacker-controlled.
  failure_scenario: Any visitor chooses their own ip_hash on a path deliberately exempt from rate limiting, writing unlimited rows attributing clicks to arbitrary visitors. The store is append-only, so the corruption is permanent and is exported to the tenant under GDPR.
  required_change: Use the platform-trusted client IP and state that the leftmost entry is never used. Pin the HMAC key rotation posture, or salt the message with tenant_id to remove cross-tenant correlation.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: sdlc-architect
  resolved_round: 1

- id: F-010
  phase: design
  source: sdlc-security-auditor
  round: 1
  severity: major
  kind: design
  file: design/contracts/domain-provisioning.md
  line: 119
  summary: Global hostname uniqueness is enforced on unverified claims, so any account can permanently squat hostnames it does not own. The contract is stricter than AC-68.
  failure_scenario: An attacker POSTs every agency hostname they can think of at 120 writes/minute. Every legitimate tenant later gets a permanent 409 with no support path and no way to distinguish a squat from a pending claim.
  required_change: Make uniqueness conditional on proof of ownership — a partial unique index over verified/provisioning/active, with pending claims allowed to coexist and expiring after a stated TTL via the existing reconciler. First to verify wins, which is what AC-68 says.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: sdlc-architect
  resolved_round: 1

