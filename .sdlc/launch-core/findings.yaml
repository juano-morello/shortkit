- id: F-037
  phase: design
  source: sdlc-security-auditor
  round: 6
  severity: major
  kind: scope
  file: design/contracts/rate-limit.md
  line: 191
  summary: The ownership row assigns resolveRateLimitPrincipal and assertBffProxySecretConfigured to TASK-009, whose own file moved auth-surface rate limiting out to TASK-058; the boot assertion lands in main.ts, which TASK-058's paths exclude.
  failure_scenario: TASK-009's implementer reads its Out-of-scope block and skips rate-limit machinery. TASK-058 never mentions the resolver, the secret, or the boot assertion, and its paths cover neither the resolver file nor main.ts. The resolver still gets built (TASK-058 needs a principal and has rate-limit.md in contracts); assertBffProxySecretConfigured has no owner in practice. Without it production can run with BFF_PROXY_SECRET unset and every IP-keyed bucket collapses — but the collapse is SIGNALLED, since the BFF still sends the auth header and bff_proxy_auth_mismatch_total fires.
