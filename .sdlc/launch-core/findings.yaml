- id: F-001
  phase: design
  source: sdlc-security-auditor
  round: 1
  severity: blocker
  kind: design
  file: design/contracts/auth-tokens.md
  line: 87
  summary: Public invitation routes must read and write tenant-scoped RLS tables with no tenant context, and no sanctioned mechanism exists.
  failure_scenario: Every valid invitation token returns null; the implementer's cheapest exit is a permissive policy letting any unauthenticated caller enumerate every tenant's pending invitations and role grants.
  required_change: Pin a tenant-id-bearing capability token in contract; public handler parses tenant id, opens withTenantTransaction, and verifies the digest before any statement acts on the tenant. Add as the third sanctioned pattern in tenant-context.md — not a GC-5 escape, since it still runs under SET LOCAL.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: sdlc-architect
  resolved_round: 1

- id: F-002
  phase: design
  source: sdlc-security-auditor
  round: 1
  severity: blocker
  kind: design
  file: design/contracts/tenant-scoped-tables.md
  line: 93
  summary: The GDPR erasure sequence is denied by its own policy set — it deletes nothing while reporting success.
  failure_scenario: Step 1 reads tenant_memberships under a policy testing an unset flag, returns zero rows, so the user-account delete hits nobody and assertNoTenantResidue passes over an empty set. Every member's email, credentials and sessions survive a completed erasure request.
  required_change: Define tenants_privileged_erase explicitly; extend or pair the per-table erase policy so the user-id collection can read; make assertNoTenantResidue re-derive ids from the database; assert non-zero deleted-row counts, not only zero residue.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: sdlc-architect
  resolved_round: 1

- id: F-003
  phase: design
  source: sdlc-security-auditor
  round: 1
  severity: blocker
  kind: design
  file: design/contracts/redirect-resolution.md
  line: 40
  summary: Redirect host resolution has no domain-state gate and there is no reserved-hostname list.
