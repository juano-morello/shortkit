- id: F-009
  phase: design
  source: sdlc-security-auditor
  round: 1
  severity: major
  kind: design
  file: design/contracts/click-events.md
  line: 41
  summary: ip_hash is derived from the leftmost X-Forwarded-For entry, which is fully attacker-controlled.
  failure_scenario: Any visitor chooses their own ip_hash on a path deliberately exempt from rate limiting, writing unlimited rows attributing clicks to arbitrary visitors. The store is append-only, so the corruption is permanent and is exported to the tenant under GDPR.
  required_change: Use the platform-trusted client IP and state that the leftmost entry is never used. Pin the HMAC key rotation posture, or salt the message with tenant_id to remove cross-tenant correlation.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: sdlc-architect
