  source: sdlc-security-auditor
  round: 1
  severity: blocker
  kind: design
  file: design/contracts/tenant-scoped-tables.md
  line: 93
  summary: The GDPR erasure sequence is denied by its own policy set — it deletes nothing while reporting success.
  failure_scenario: Step 1 reads tenant_memberships under a policy testing an unset flag, returns zero rows, so the user-account delete hits nobody and assertNoTenantResidue passes over an empty set. Every member's email, credentials and sessions survive a completed erasure request.
  required_change: Define tenants_privileged_erase explicitly; extend or pair the per-table erase policy so the user-id collection can read; make assertNoTenantResidue re-derive ids from the database; assert non-zero deleted-row counts, not only zero residue.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: sdlc-architect
  resolved_round: 1

