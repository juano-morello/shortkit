  failure_scenario: Two of three normative stubs were rewritten in round 5; this one was not. "Platform-trusted" is the design's own vocabulary for Fly-Client-IP. An implementer following it behind the BFF passes Vercel's egress for every user — 3 signups per hour and 10 sign-ins per 5 minutes product-wide. Availability failure, not a privilege bypass.
