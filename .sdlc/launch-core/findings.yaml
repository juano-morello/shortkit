- id: F-061
  phase: test
  task: TASK-002
  source: sdlc-reviewer
  round: 2
  severity: minor
  kind: behavior
  file: apps/api/tsup.config.ts
  line: 1
  summary: >-
    The production bundle's decorator-metadata transform is asserted by nothing.
    decorator-metadata.spec.ts covers the vitest/unplugin-swc transform, now a different code path
    from the build.
  failure_scenario: >-
    tsup declares @swc/core as an OPTIONAL peerDependency (auditor verified
    peerDependenciesMeta."@swc/core".optional = true). If it is absent, or the
    emitDecoratorMetadata detection changes across a tsup upgrade, tsup warns and falls back to
