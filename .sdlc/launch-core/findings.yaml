- id: F-031
  phase: design
  source: sdlc-security-auditor
  round: 5
  severity: major
  kind: design
  file: design/stubs/apps/api/src/common/rate-limit/rate-limit.types.ts
  line: 113
  summary: The BFF client-IP fix exists only in prose. Both normative stub blocks and rate-limit.md's /api/auth/* section still state Fly-Client-IP unconditionally, so the collapsed-bucket outage is still what gets built.
  failure_scenario: rate-limit.md names the stub as the normative form, and the stub says "the client IP is the platform-trusted value (Fly-Client-IP), NEVER the leftmost X-Forwarded-For" directly above both authRateLimitKey (TASK-009) and RateLimitGuard (TASK-051). Neither stub nor the /api/auth/* section mentions X-Shortkit-Client-IP, X-Shortkit-Proxy-Auth or BFF_PROXY_SECRET. TASK-009 implements from the stub in wave 2 and the entire product shares 10 sign-ins per 5 minutes. Mirror risk - an implementer building a shared resolveClientIp() helper from the prose lets the redirect path pick it up, putting an attacker-settable value into ip_hash and reopening F-009 on the append-only store.
  required_change: Put the resolution rule in the normative artifact the way F-028's constants were. Replace both stub comment blocks, export named header constants, specify a single resolveRateLimitPrincipal(headers) as the only site making the trusted-proxy decision, and state that click-events.md's trustedClientIp is separate and must not be merged with it.
