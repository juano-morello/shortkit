- id: F-059
  phase: test
  task: TASK-001
  source: sdlc-reviewer
  round: 2
  severity: minor
  kind: behavior
  file: apps/api/src/main.ts
  line: 56
  summary: >-
    The bootstrap catch sets process.exitCode = 1 and never closes the Nest app, so the process
    exits only if the event loop happens to be empty. The security auditor raised the same site
    for a different reason (raw error.stack outside ADR-0022 redaction); deduped here.
  failure_scenario: >-
    Works today because AppModule holds no handles. It breaks at TASK-005: DbModule opens a pg
    Pool during NestFactory.create, so if app.listen then fails the pool keeps the event loop
    alive indefinitely. exitCode is recorded but never delivered - the container runs forever,
    never listening and never exiting. On Fly.io the platform sees a live process, so the restart
    path that would recover a crashed boot never triggers: the API is down and looks up. Same
    shape for Redis at TASK-051 and any provider with a timer.
  required_change: >-
    Hold the app instance outside the try so the catch can await app?.close(), then call
    process.exit(1) after the log flushes rather than relying on the loop draining. Route the
    stack through ADR-0022's redaction, or log a redacted summary until TASK-003 lands pino.
  owner_slot: sdlc-implementer-backend
  status: open

