- id: F-008
  phase: design
  source: sdlc-security-auditor
  round: 1
  severity: major
  kind: design
  file: design/contracts/web-api-client.md
  line: 75
  summary: The BFF proxy interpolates an unvalidated catch-all path into the upstream URL and never asserts the resolved origin.
  failure_scenario: A path beginning // resolves protocol-relative to an attacker host and the proxy attaches Authorization Bearer to it — a live tenant credential delivered to an attacker-chosen origin by a same-origin request the victim's browser makes. Traversal also escapes the /api prefix.
  required_change: Make URL construction normative and safe — reject empty, dot, dot-dot and separator-bearing segments after decoding; assert resolved.origin equals API_BASE_URL's origin; pass redirect manual; add an invariant that Authorization never leaves that origin.
