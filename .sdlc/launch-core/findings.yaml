  status: open

- id: F-062
  phase: test
  task: TASK-001
  source: sdlc-reviewer + sdlc-security-auditor
  round: 2
  severity: minor
  kind: implementation
  file: .gitignore
  line: 27
  summary: >-
    THE TWO AUDITORS DISAGREE and the disagreement is preserved rather than resolved here.
    sdlc-reviewer says the repo-wide .npmrc ignore forecloses committed pnpm configuration.
    sdlc-security-auditor says keep it. Both agree the engine-strict tradeoff was not forced.
  failure_scenario: >-
    Reviewer's case: a project .npmrc is normal committed configuration and secrets belong in
    ~/.npmrc or env interpolation. An implementer writes engine-strict=true, runs git add -A, and
    git silently skips it - installs are engine-strict locally but not on a fresh clone or in CI,
    so the team believes a Node-version guard exists when it does not. Security's counter:
    actions/setup-node with registry-url WRITES _authToken into the project .npmrc, and git
    ignores files rather than lines, so the committed-settings-plus-ignored-credentials shape is
    not expressible. Both note the resolution: pnpm reads engineStrict from pnpm-workspace.yaml,
    which is tracked and already holds allowBuilds.
  required_change: >-
    Set engineStrict in pnpm-workspace.yaml, which satisfies both auditors and needs no .gitignore
    change. Then decide separately whether the .npmrc ignore stays; the security auditor's
    CI-append argument is the stronger one and nothing else currently needs the file.
  owner_slot: sdlc-implementer-backend
  status: open

