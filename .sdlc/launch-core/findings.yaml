  source: sdlc-reviewer + sdlc-security-auditor
  round: 1
  severity: nit
  kind: implementation
  file: apps/api/src/main.ts
  line: 19
  summary: >-
    process.env.PORT ?? DEFAULT_PORT treats an empty PORT as valid, and a failed bootstrap
    surfaces only as a bare unhandled rejection. Raised independently by both auditors.
  failure_scenario: >-
    ?? falls back only on null/undefined. PORT="" - common when an unset var is expanded
    into an env file or compose config - makes the app listen on '' rather than 3001;
    Express treats an empty string as a path/pipe, so the process comes up unreachable
    instead of falling back and the health check on the documented port fails against an
    otherwise healthy process.
  required_change: >-
    Validate as an integer in 1-65535 and fall back otherwise, or defer entirely to
    TASK-004's env schema, and attach a failure handler to bootstrap() that logs before exit.
  owner_slot: sdlc-implementer-backend
  status: open
  resolved_by: null
  resolved_round: null

