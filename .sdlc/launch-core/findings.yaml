  severity: nit
  kind: implementation
  file: package.json
  line: 7
  summary: >-
    engines.node ">=22.12.0" while @types/node is 24.13.3, so the compiler advertises a Node
    API surface wider than the minimum supported runtime. Raised independently by both.
  failure_scenario: >-
    Code typechecks against a Node 24-only API and fails at runtime on the 22.12 floor the
    repo claims to support. engines is also advisory here - no .npmrc, no engine-strict - so
    a contributor or runner on EOL Node installs and runs without error. The deploy image is
    TASK-042's, so exposure is local and CI only.
  required_change: >-
