  summary: The revision's residue paragraph contradicts the atomicity claim two paragraphs above it, and no artifact says what tenantIdForUser does when no membership exists.
  failure_scenario: An implementer working from the Decision block builds for atomicity, discovers it is not implementable — the same discovery this round already made — and improvises. Separately, AuthGuard never checks that tid is present or uuid-shaped, so a tid-less token passes the guard and is stopped only by withTenantTransaction's uuid validation one layer down, surfacing as a 500 rather than a 401. The design's safety here is real but accidental.
  required_change: Delete or correct the two stale atomicity sentences in ADR-0015 and ADR-0013. State that tenantIdForUser throws when no membership row exists, making the "cannot obtain a tid claim" argument a specified behaviour rather than an inference.
