- id: F-028
  phase: design
  source: sdlc-security-auditor
  round: 4
  severity: major
  kind: design
  file: design/contracts/rate-limit.md
  line: 127
  summary: LocalAuthRateLimiter is keyed on attacker-controlled principals with no stated memory bound, unlike every other local bucket in the design.
  failure_scenario: The sibling LocalRateLimiter is explicitly LRU-capped at 10,000 tenants with a named constant. LocalAuthRateLimiter is specified only as "same algorithm, same limits" with no cap, eviction or sweep, keyed on client IP and sha256(email) — both unbounded and attacker-chosen. An IPv6 /64 is free, so one live map entry per request with nothing to reap it. Live for the entire wave-2..wave-10 interval when it is the only auth limiter, and during any Redis outage when ADR-0012 routes every auth decision to it — converting that outage into an API OOM-restart loop while the redirect path is already degraded onto its Postgres fallback.
  required_change: State the bound the way it is stated for LocalRateLimiter — a per-bucket entry cap with LRU eviction and expiry of entries whose window has passed. Put the constant in the stub next to LOCAL_LIMITER_MAX_TENANTS so it is copied rather than remembered.
  owner_slot: sdlc-architect
  status: fixed
  resolved_by: sdlc-architect
  resolved_round: 4

