project: shortkit

# PLANNED, not detected. The repo was empty at init time; this records the
# intended stack so Plan and Design have something to reason against. It is
# not evidence that any of it is installed.
stack: [typescript, nestjs, nextjs, postgres, drizzle, redis]

gates:
  mode: phase
  require_approval: [refine, plan, design, test, implement, ship]

rework:
  max_rework_iterations: 5
  reaudit: raised-only

# models: omitted deliberately. Agent frontmatter defaults stand; see
# references/config.md "Model precedence". Only add a role here when this
# project wants something different from the agent's own default.

auditors:
  - sdlc-reviewer
  - sdlc-security-auditor
  - sdlc-product-auditor
  - sdlc-design-auditor        # kept: there is a real dashboard UI

# First match wins. Rule 0 in references/routing.md (design artifacts, test
# files, approved artifacts) beats every glob here.
ownership:
  - { paths: ["apps/web/**"], slot: sdlc-implementer-frontend }
  # packages/** is backend-owned: the API is the source of truth for
  # packages/contracts. Per ADR-0005 the web app imports those zod schemas
  # directly as source — there is no generated client and no OpenAPI document.
  - { paths: ["apps/api/**", "packages/**"], slot: sdlc-implementer-backend }
  - { paths: ["infra/**", ".github/**", "fly.toml", "docker-compose*.yml"], slot: sdlc-implementer-backend }
  - { paths: ["README.md", "docs/**", "*.md"], slot: sdlc-implementer-backend }
  - { paths: ["**"], slot: sdlc-implementer-backend }   # fallback: root manifests, tsconfig

# Populated 2026-08-04 by the `/juano-sdlc init` re-run that TASK-001 declares as a
# hard gate. Every value below was recorded by RUNNING the command from a state with
# all node_modules, .next and dist deleted, not by reading a manifest. All exit 0.
testing:
  command: pnpm test
  unit: pnpm test
  # Currently collects zero test files and passes via `passWithNoTests`. It becomes
  # meaningful once TASK-005 lands docker-compose.test.yml and TASK-006 the isolation
  # harness. Recorded now because ADR-0001 fixes the command name and TASK-002 wires
  # the CI job to it; init.md's "a command collecting nothing is broken" caveat is
  # noted rather than ignored.
  integration: pnpm test:integration
  coverage_gate: null          # no coverage tooling installed, no threshold chosen
  framework: vitest            # ADR-0001: Vitest 3 in all three workspaces

quality:
  lint: pnpm lint
  typecheck: pnpm typecheck
  build: pnpm build

git:
  branch_prefix: sdlc/
  commit_convention: conventional   # feat(scope): subject [TASK-001]
  ai_attribution: false             # HARD false. Juano is sole author.
  worktree_isolation: auto

observability:
  required: true
  notes: "structured logs via pino; no PII in log bodies; click events store ip_hash, never raw IP"

docs:
  required: [README]

writing:
  skill: stop-slop
  enabled: true

mirrors:
  obsidian:
    enabled: true
    project: shortkit
    include: [refinement, adrs, contracts, retro]
    sync_on: [refine, design, retro]
  linear:
    enabled: false             # sdlc-tracker-sync is not implemented yet
    team: null
    sync_on: [plan, implement, ship]
