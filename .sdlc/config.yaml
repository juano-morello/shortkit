project: shortkit

# PLANNED, not detected. The repo was empty at init time; this records the
# intended stack so Plan and Design have something to reason against. It is
# not evidence that any of it is installed.
stack: [typescript, nestjs, nextjs, postgres, drizzle, redis]

gates:
  mode: phase
  require_approval: [refine, plan, design, test, implement, ship]

# Added 2026-08-09 with the launch-core -> foundation re-scope. The initiative-size rule
# did not exist when launch-core was planned, and neither did this block; `full` was run
# by default on all 58 TASKs, which is how that initiative reached a 9:1
# artifact-to-code ratio. `standard` is the default now so the roadmap increments do not
# inherit full ceremony by habit — they have to earn it, or trip a glob below.
track:
  default: standard
  # Any initiative touching these is at least `full` and cannot be talked down to
  # `express`. Upgrading is automatic; downgrading is a decision.
  force_full_paths:
    - "apps/api/src/tenancy/**"              # tenant context; GC-5's transaction rule
    - "apps/api/src/db/**"                   # RLS policy template, client, check-policies
    - "apps/api/drizzle/**"                  # migrations — not reversible after the fact
    - "apps/api/src/auth/**"                 # auth surface, session and JWT issuance
    - "apps/api/src/common/authorization/**" # role checks
    - "apps/api/src/invitations/tokens/**"   # capability tokens, ADR-0021
    - "packages/contracts/src/auth/**"       # auth shapes both deployables read
    - "apps/api/test/isolation/**"           # the suite SC-1 rests on
    - "apps/api/src/gdpr/**"                 # export and erasure; destructive, cross-tenant

rework:
  max_rework_iterations: 5
  reaudit: raised-only

# models: omitted deliberately. Agent frontmatter defaults stand; see
# references/config.md "Model precedence". Only add a role here when this
# project wants something different from the agent's own default.

auditors:
  - sdlc-reviewer
  - sdlc-security-auditor
  - sdlc-product-auditor
  # sdlc-design-auditor REMOVED from the default panel 2026-08-12, foundation retro.
  # ZERO findings across 399 in this initiative, and it is the SECOND initiative where it
  # ran once and found nothing. shortkit has four UI files. Its one dispatch returned
  # APPROVED and DELIBERATELY DECLINED the only thing it could have raised, on acknowledged
  # placeholder scaffolding - so the prompt is fine and the STACK is the mismatch.
  # Sharpening it would manufacture findings, which is what its own judgement avoided.
  # Re-add it when a rendered surface exists: a dashboard, the branded 404, or the invitation
  # accept screen. Trigger on a diff touching apps/web/app/**, not on every TASK.

# First match wins. Rule 0 in references/routing.md (design artifacts, test
# files, approved artifacts) beats every glob here.
ownership:
  # Corrected 2026-08-12, foundation retro. ~40 observability findings resolved to the
  # correct slot ONLY through the `**` fallback below - by luck, because this project's
  # fallback happens to be the right slot. A project whose fallback were different would
  # have mis-routed every one. The fallback is a safety net, NOT a router.
  - { paths: ["apps/api/src/observability/**"], slot: sdlc-implementer-backend }
  - { paths: [".sdlc/**"], slot: orchestrator }   # findings, ledger, cards: never an implementer
  - { paths: ["apps/web/**"], slot: sdlc-implementer-frontend }
  # packages/** is backend-owned: the API is the source of truth for
  # packages/contracts. Per ADR-0005 the web app imports those zod schemas
  # directly as source — there is no generated client and no OpenAPI document.
  - { paths: ["apps/api/**", "packages/**"], slot: sdlc-implementer-backend }
  - { paths: ["infra/**", ".github/**", "fly.toml", "docker-compose*.yml"], slot: sdlc-implementer-backend }
  - { paths: ["README.md", "docs/**", "*.md"], slot: sdlc-implementer-backend }
  - { paths: ["**"], slot: sdlc-implementer-backend }   # fallback: root manifests, tsconfig

# Populated 2026-08-04 by the `/juano-sdlc init` re-run that TASK-001 declares as a
# hard gate. Every value below was recorded by RUNNING the command from a state with
# all node_modules, .next and dist deleted, not by reading a manifest. All exit 0.
testing:
  command: pnpm test
  unit: pnpm test
  # Currently collects zero test files and passes via `passWithNoTests`. It becomes
  # meaningful once TASK-005 lands docker-compose.test.yml and TASK-006 the isolation
  # harness. Recorded now because ADR-0001 fixes the command name and TASK-002 wires
  # the CI job to it; init.md's "a command collecting nothing is broken" caveat is
  # noted rather than ignored.
  integration: pnpm test:integration
  # Re-justified 2026-08-12, foundation retro. The 2026-08-04 reason - "no coverage tooling
  # installed" - IS NOW FALSE: 189 unit and 62 integration tests ship. It stays null as a
  # DECISION rather than an absence: a threshold set against a substrate whose consumers are
  # all deferred measures the fixtures, not the system. Revisit when the first request path
  # lands, which is roadmap item 1.
  coverage_gate: null
  framework: vitest            # ADR-0001: Vitest 3 in all three workspaces

quality:
  lint: pnpm lint
  typecheck: pnpm typecheck
  build: pnpm build

git:
  branch_prefix: feat/            # renamed 2026-08-04; was sdlc/
  commit_convention: conventional   # feat(scope): subject [TASK-001]
  ai_attribution: false             # HARD false. Juano is sole author.
  worktree_isolation: auto

observability:
  required: true
  notes: "structured logs via pino; no PII in log bodies; click events store ip_hash, never raw IP"

docs:
  required: [README]

writing:
  skill: stop-slop
  enabled: true

mirrors:
  obsidian:
    enabled: true
    project: shortkit
    include: [refinement, adrs, contracts, retro]
    sync_on: [refine, design, retro]
  linear:
    enabled: false             # sdlc-tracker-sync is not implemented yet
    team: null
    sync_on: [plan, implement, ship]
